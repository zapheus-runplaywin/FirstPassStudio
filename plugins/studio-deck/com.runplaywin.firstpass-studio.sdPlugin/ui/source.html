<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Source</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px 12px 16px;
    background: #2d2d2d; color: #d8d8d8;
    font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row > label:first-child { flex: 0 0 92px; color: #9a9a9a; text-align: right; }
  .row > .field { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; }
  input[type=text], select {
    width: 100%; background: #3d3d3d; color: #e6e6e6; border: 1px solid #4a4a4a;
    border-radius: 3px; padding: 4px 6px; font: inherit; outline: none;
  }
  input:focus, select:focus { border-color: #6b8cff; }
  button {
    background: #4a4a4a; color: #eee; border: 1px solid #5a5a5a; border-radius: 3px;
    padding: 4px 10px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #575757; }
  .check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check input { margin: 0; }
  .note { margin: 0 0 8px 100px; color: #9a9a9a; font-size: 11px; }
  .note.bad { color: #ff8a80; }
</style>
</head>
<body>
  <div class="row">
    <label for="source">Source</label>
    <div class="field">
      <select id="source"><option value="">Loading…</option></select>
      <button id="refresh" title="Fetch the list again">↻</button>
    </div>
  </div>
  <p class="note" id="note"></p>

  <div class="row">
    <label for="press">Press</label>
    <div class="field">
      <select id="press">
        <option value="toggle">Show or hide</option>
        <option value="on">Fade in</option>
        <option value="off">Fade out</option>
        <option value="restart">Refresh page or restart video</option>
        <option value="sound">Video sound on or off</option>
      </select>
    </div>
  </div>

  <div class="row">
    <label>Title</label>
    <div class="field">
      <label class="check"><input id="keepTitle" type="checkbox" /> Use my own title instead of the source's name</label>
    </div>
  </div>

  <div class="row">
    <label for="host">Studio</label>
    <div class="field"><input id="host" type="text" placeholder="http://localhost:8080" spellcheck="false" /></div>
  </div>
  <p class="note">Leave Studio empty when it runs on this computer.</p>

<script>
  let websocket = null;
  let uuid = null;
  let settings = {};
  let sources = [];

  const $ = (id) => document.getElementById(id);

  // Called by the Stream Deck app.
  // eslint-disable-next-line no-unused-vars
  function connectElgatoStreamDeckSocket(port, propertyInspectorUUID, registerEvent, info, actionInfo) {
    uuid = propertyInspectorUUID;
    const ai = JSON.parse(actionInfo);
    settings = (ai.payload && ai.payload.settings) || {};
    $("press").value = settings.press || "toggle";
    $("keepTitle").checked = !!settings.keepTitle;
    $("host").value = settings.host || "";
    fillSources();

    websocket = new WebSocket("ws://127.0.0.1:" + port);
    websocket.onopen = () => {
      websocket.send(JSON.stringify({ event: registerEvent, uuid }));
      askForSources();
    };
    websocket.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.event === "sendToPropertyInspector" && msg.payload && msg.payload.type === "sources") {
        sources = msg.payload.sources || [];
        const note = $("note");
        note.className = msg.payload.ok ? "note" : "note bad";
        note.textContent = msg.payload.ok
          ? (sources.length ? "Sources from the Output page's scene." : "The scene is empty: add sources on Studio's Output page.")
          : "Can't reach Studio at " + msg.payload.host + ". Is it on air?";
        fillSources();
      }
    };
  }

  function askForSources() {
    send({ event: "sendToPlugin", context: uuid, payload: { cmd: "sources", host: $("host").value.trim() } });
  }

  function fillSources() {
    const select = $("source");
    select.innerHTML = "";
    const add = (value, text) => { const o = document.createElement("option"); o.value = value; o.textContent = text; select.appendChild(o); };
    add("", sources.length ? "Choose a source" : "No sources");
    for (const s of sources) add(s.id, s.name + " (" + ({ browser: "page", image: "image", video: "video" }[s.type] || s.type) + ")");
    // A source picked before that isn't in the list now (Studio off air, or it was removed) stays chosen.
    if (settings.source && !sources.some((s) => s.id === settings.source)) add(settings.source, (settings.sourceName || "Source") + " (not in the scene now)");
    select.value = settings.source || "";
  }

  function send(obj) {
    if (websocket && websocket.readyState === 1) websocket.send(JSON.stringify(obj));
  }

  function save() {
    const id = $("source").value;
    const picked = sources.find((s) => s.id === id);
    settings = Object.assign({}, settings, {
      source: id,
      sourceName: picked ? picked.name : (id === settings.source ? settings.sourceName : ""),
      press: $("press").value,
      keepTitle: $("keepTitle").checked,
      host: $("host").value.trim(),
    });
    send({ event: "setSettings", context: uuid, payload: settings });
  }

  $("source").addEventListener("change", save);
  $("press").addEventListener("change", save);
  $("keepTitle").addEventListener("change", save);
  $("host").addEventListener("change", () => { save(); askForSources(); });
  $("refresh").addEventListener("click", askForSources);
</script>
</body>
</html>
