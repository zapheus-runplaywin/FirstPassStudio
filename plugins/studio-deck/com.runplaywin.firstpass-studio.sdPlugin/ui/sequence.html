<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sequence</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px 12px 16px;
    background: #2d2d2d; color: #d8d8d8;
    font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row > label:first-child { flex: 0 0 92px; color: #9a9a9a; text-align: right; }
  .row > .field { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; }
  input[type=text], select {
    width: 100%; background: #3d3d3d; color: #e6e6e6; border: 1px solid #4a4a4a;
    border-radius: 3px; padding: 4px 6px; font: inherit; outline: none;
  }
  input:focus, select:focus { border-color: #6b8cff; }
  button {
    background: #4a4a4a; color: #eee; border: 1px solid #5a5a5a; border-radius: 3px;
    padding: 4px 10px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #575757; }
  .check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check input { margin: 0; }
  .note { margin: 0 0 8px 100px; color: #9a9a9a; font-size: 11px; }
  .note.bad { color: #ff8a80; }
</style>
</head>
<body>
  <div class="row">
    <label for="press">Press</label>
    <div class="field">
      <select id="press">
        <option value="play">Play a sequence, or stop it while it plays</option>
        <option value="start">Play a sequence from the start</option>
        <option value="next">Next step of whatever is playing</option>
        <option value="delay">Delay: hold the step 10 s longer</option>
        <option value="pause">Pause or carry on</option>
        <option value="stop">Stop whatever is playing</option>
      </select>
    </div>
  </div>

  <div class="row" id="sequenceRow">
    <label for="sequence">Sequence</label>
    <div class="field">
      <select id="sequence"><option value="">Loading…</option></select>
      <button id="refresh" title="Fetch the list again">↻</button>
    </div>
  </div>
  <p class="note" id="note"></p>

  <div class="row">
    <label for="colour">Colour</label>
    <div class="field">
      <select id="colour">
        <option value="">The sequence's own colour</option>
        <option value="blue">Blue: live stream</option>
        <option value="green">Green: pre-game</option>
        <option value="grey">Grey: post-game</option>
        <option value="yellow">Yellow: ads</option>
        <option value="purple">Purple: quarter time</option>
      </select>
    </div>
  </div>
  <p class="note">The sequence's own colour is the one set in its editor on Studio's Output page. The key turns orange while its sequence plays (for Next, Delay, Pause and Stop, while any plays) and shows the step and the time left.</p>

  <div class="row">
    <label>Title</label>
    <div class="field">
      <label class="check"><input id="keepTitle" type="checkbox" /> Use my own title instead of the sequence's name</label>
    </div>
  </div>

  <div class="row">
    <label for="host">Studio</label>
    <div class="field"><input id="host" type="text" placeholder="http://localhost:8080" spellcheck="false" /></div>
  </div>
  <p class="note">Leave Studio empty when it runs on this computer.</p>

<script>
  let websocket = null;
  let uuid = null;
  let settings = {};
  let sequences = [];

  const $ = (id) => document.getElementById(id);

  // Called by the Stream Deck app.
  // eslint-disable-next-line no-unused-vars
  function connectElgatoStreamDeckSocket(port, propertyInspectorUUID, registerEvent, info, actionInfo) {
    uuid = propertyInspectorUUID;
    const ai = JSON.parse(actionInfo);
    settings = (ai.payload && ai.payload.settings) || {};
    $("press").value = settings.press || "play";
    $("colour").value = settings.colour || "";
    $("keepTitle").checked = !!settings.keepTitle;
    $("host").value = settings.host || "";
    showSequencePick();
    fillSequences();

    websocket = new WebSocket("ws://127.0.0.1:" + port);
    websocket.onopen = () => {
      websocket.send(JSON.stringify({ event: registerEvent, uuid }));
      askForSequences();
    };
    websocket.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.event === "sendToPropertyInspector" && msg.payload && msg.payload.type === "sequences") {
        sequences = msg.payload.sequences || [];
        const note = $("note");
        note.className = msg.payload.ok ? "note" : "note bad";
        note.textContent = msg.payload.ok
          ? (sequences.length ? "Sequences of the competition in use, from Studio's Output page." : "No sequences yet: make one on Studio's Output page.")
          : "Can't reach Studio at " + msg.payload.host + ". Is it on air?";
        fillSequences();
      }
    };
  }

  // Only playing one needs a sequence picked; the others act on whatever is playing.
  function showSequencePick() {
    const one = $("press").value === "play" || $("press").value === "start";
    $("sequenceRow").style.display = one ? "" : "none";
  }

  function askForSequences() {
    send({ event: "sendToPlugin", context: uuid, payload: { cmd: "sequences", host: $("host").value.trim() } });
  }

  function fillSequences() {
    const select = $("sequence");
    select.innerHTML = "";
    const add = (value, text) => { const o = document.createElement("option"); o.value = value; o.textContent = text; select.appendChild(o); };
    add("", sequences.length ? "Choose a sequence" : "No sequences");
    for (const s of sequences) add(s.id, s.name);
    // One picked before that isn't in the list now (Studio off air, another competition in use, or deleted) stays chosen.
    if (settings.sequence && !sequences.some((s) => s.id === settings.sequence)) add(settings.sequence, (settings.sequenceName || "Sequence") + " (not in Studio now)");
    select.value = settings.sequence || "";
  }

  function send(obj) {
    if (websocket && websocket.readyState === 1) websocket.send(JSON.stringify(obj));
  }

  function save() {
    const id = $("sequence").value;
    const picked = sequences.find((s) => s.id === id);
    settings = Object.assign({}, settings, {
      sequence: id,
      sequenceName: picked ? picked.name : (id === settings.sequence ? settings.sequenceName : ""),
      press: $("press").value,
      colour: $("colour").value,
      keepTitle: $("keepTitle").checked,
      host: $("host").value.trim(),
    });
    send({ event: "setSettings", context: uuid, payload: settings });
  }

  $("sequence").addEventListener("change", save);
  $("press").addEventListener("change", () => { showSequencePick(); save(); });
  $("colour").addEventListener("change", save);
  $("keepTitle").addEventListener("change", save);
  $("host").addEventListener("change", () => { save(); askForSequences(); });
  $("refresh").addEventListener("click", askForSequences);
</script>
</body>
</html>
