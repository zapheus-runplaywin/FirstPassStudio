# Keeps the versions rule without anyone remembering it: a pull request for each newer dependency,
# GitHub Action and the Stream Deck plugin's packages, once a month, grouped so one PR covers a batch.
# Dependabot adds a "major", "minor" or "patch" label to a PR when a label of that name exists in the
# repository, so the labels that raise the Mac app's version are named build-major and build-minor
# (mac-app.yml "Pick the version") and a dependency's major update can't raise it by accident.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies]
    groups:
      studio: { patterns: ["*"] }
    versioning-strategy: increase
  - package-ecosystem: npm
    directory: /plugins/studio-deck
    schedule: { interval: monthly }
    labels: [dependencies]
    groups:
      stream-deck-plugin: { patterns: ["*"] }
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies]
