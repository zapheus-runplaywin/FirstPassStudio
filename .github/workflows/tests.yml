# Runs the tests on every pull request (and on main after a merge), so a change that breaks
# something shows as a red check on the pull request before it's merged.
#   Studio: npm test (test/*.test.js), the helper, scenes, sequences, music, packing, and every page in a browser.
#   Stream Deck plugin: plugins/studio-deck's type check and tests.
#   Packages: npm audit on the packages that ship (not the build tools), so a known vulnerability in
#   one turns the pull request red the day it is published rather than waiting for Dependabot's month.
# PlayHQ is never called: the tests that need it run against recorded answers.
# Each run's summary page has a results table and every failure with its message
# (test/support/github-report.mjs), and failures are marked on the test in the pull request's Files tab.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  studio:
    name: Studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Electron itself isn't needed to test Studio, only its packages.
      # No install scripts (as in mac-app.yml); Electron's binary isn't needed here at all.
      - run: npm ci --ignore-scripts
      # Known vulnerabilities in the packages Studio ships (electron-updater, qrcode-generator and what they
      # pull in). Build-time packages are left out: they never run on anyone's Mac.
      - run: npm audit --omit=dev --audit-level=high
      # Chromium for the page test (test/pages.test.js), which fails here rather than skipping without it.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
        env:
          STUDIO_TEST_REQUIRE_BROWSER: '1'
          TEST_REPORT_TITLE: Studio tests

  stream-deck:
    name: Stream Deck plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/studio-deck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/studio-deck/package-lock.json
      # The end-to-end test starts a real Studio (server.js), which needs Studio's own packages: the
      # Switcher key's test drives Studio's ATEM connection (atem-connection) against the stand-in switcher.
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: .
      - run: npm ci --ignore-scripts
      # The plugin's shipped packages (@elgato/streamdeck and what it pulls in), as above. A warning rather
      # than a failure for now: @elgato/streamdeck 3.0.3 (the latest) pulls in a zod with a known
      # memory-exhaustion advisory that only the plugin's own settings could trigger, and there is no
      # release without it yet. Drop continue-on-error once a bump clears it.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      # The bundle the Mac app packs, so a dependency update that breaks it shows here first.
      - run: npm run build
      - run: npm run test:ci
        env:
          TEST_REPORT_TITLE: Stream Deck plugin tests
