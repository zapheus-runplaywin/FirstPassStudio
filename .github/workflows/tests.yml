# Runs the tests on every pull request (and on main after a merge), so a change that breaks
# something shows as a red check on the pull request before it's merged.
#   Studio: npm test (test/*.test.js), the helper, scenes, sequences, music, packing, every page in a browser, and the
#   Mac app itself (Electron, on a virtual display).
#   Stream Deck plugin: plugins/studio-deck's type check and tests.
#   NDI output module: native/ndi built, and its send timing against a stand-in NDI runtime.
#   Packages: npm audit on the packages that ship (not the build tools), so a known vulnerability in
#   one turns the pull request red the day it is published rather than waiting for Dependabot's month.
# PlayHQ is never called: the tests that need it run against recorded answers.
# Each run's summary page has a results table and every failure with its message
# (test/support/github-report.mjs), and failures are marked on the test in the pull request's Files tab.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces a run still going. On main every merge gets
# its own run that finishes, so merges close together don't send "Run cancelled" emails and
# each merge's result is known.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  studio:
    name: Studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # No install scripts (as in mac-app.yml); Electron's binary is fetched on its own below, for the app's test.
      - run: npm ci --ignore-scripts
      # Known vulnerabilities in the packages Studio ships (electron-updater, qrcode-generator and what they
      # pull in). Build-time packages are left out: they never run on anyone's Mac.
      - run: npm audit --omit=dev --audit-level=high
      # Chromium for the page test (test/pages.test.js), which fails here rather than skipping without it.
      - run: npx playwright install --with-deps chromium
      # Electron's own binary, for the Mac app's test (test/app.test.js), which runs the app on a virtual display.
      # From GitHub releases, which sometimes answer 504 for a while: a copy is kept under its version (a newer
      # Electron isn't found and is downloaded fresh), and the download tries again after 30 s, 1 and 2 minutes.
      - name: Electron's version
        id: electron-version
        run: echo "version=$(node -p 'require("electron/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore Electron's download
        id: electron
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-version.outputs.version }}
      - name: Download Electron
        run: |
          for wait in 30 60 120 0; do
            node node_modules/electron/install.js && exit 0
            [ "$wait" = 0 ] && break
            echo "::warning::Couldn't download Electron from GitHub. Trying again in $wait s."
            sleep "$wait"
          done
          echo "::error::Couldn't download Electron from GitHub four times. See the log above."
          exit 1
      - name: Keep Electron's download
        if: steps.electron.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-version.outputs.version }}
      - run: xvfb-run -a npm run test:ci
        env:
          STUDIO_TEST_REQUIRE_BROWSER: '1'
          STUDIO_TEST_REQUIRE_APP: '1'
          TEST_REPORT_TITLE: Studio tests

  ndi:
    name: NDI output module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/ndi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/ndi/package-lock.json
      # Builds native/ndi and checks it loads, then that it sends fill and key without waiting against a stand-in NDI
      # runtime that is slow to compress (timing-test.js). The Mac build runs the same tests on macOS.
      - run: npm ci && npm run build && npm test

  stream-deck:
    name: Stream Deck plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/studio-deck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/studio-deck/package-lock.json
      # The end-to-end test starts a real Studio (out/server.js), which needs Studio's own packages and its build: the
      # Switcher key's test drives Studio's ATEM connection (atem-connection) against the stand-in switcher.
      - run: npm ci --ignore-scripts && npm run build
        working-directory: .
      - run: npm ci --ignore-scripts
      # The plugin's shipped packages (@elgato/streamdeck and what it pulls in), as above. A warning rather
      # than a failure for now: @elgato/streamdeck 3.0.3 (the latest) pulls in a zod with a known
      # memory-exhaustion advisory that only the plugin's own settings could trigger, and there is no
      # release without it yet. Drop continue-on-error once a bump clears it.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      # The bundle the Mac app packs, so a dependency update that breaks it shows here first.
      - run: npm run build
      - run: npm run test:ci
        env:
          TEST_REPORT_TITLE: Stream Deck plugin tests
