# Builds the FirstPass Studio Mac app (signed and notarised) from the Actions tab:
# Actions > Mac app > Run workflow. The version is the one in package.json.
# "Publish" puts it on the public FirstPassStudio-releases repository, where the installed
# apps find their updates (the .zip is what they update from); otherwise only the .dmg is
# attached to the run to try first.
# Setup and the secrets it needs: see "Mac app" in README.md.
name: Mac app

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish as an update for everyone
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Put the Developer ID certificate in a keychain of its own (electron-builder's own
      # keychain step fails on the current macOS runners), so codesign finds it.
      - name: Import the signing certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then echo "::error::The MAC_CERTIFICATE secret is empty"; exit 1; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -f pkcs12 -P "$MAC_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security \
            || { echo "::error::Couldn't open the certificate. Check MAC_CERTIFICATE is the base64 of a .p12 (not a .cer) and MAC_CERTIFICATE_PASSWORD is its export password."; exit 1; }
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application certificate with its private key in MAC_CERTIFICATE."; exit 1; }
      - name: Build, sign and notarise
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder --mac --publish ${{ inputs.publish && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: FirstPass-Studio-mac
          path: dist/*.dmg
          compression-level: 0
          retention-days: 14
