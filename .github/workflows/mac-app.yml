# Builds the FirstPass Studio Mac app (signed and notarised) from the Actions tab:
# Actions > Mac app > Run workflow. The version is picked here: the last version published
# on FirstPassStudio-releases, raised by "Raise" (patch 0.1.0 > 0.1.1, minor > 0.2.0,
# major > 1.0.0), or exactly what's typed in "Version". With nothing published yet it's the
# version in package.json. package.json itself isn't changed.
# "Publish" puts it on the public FirstPassStudio-releases repository, where the installed
# apps find their updates (the .zip is what they update from); otherwise only the .dmg is
# attached to the run to try first.
# Every merge to main (that changes more than docs) also runs this and publishes the next
# patch version, so installed apps get each merged change. A "minor" or "major" label on a pull
# request merged since the last published version raises that part instead (0.1.4 > 0.2.0 or 1.0.0).
# Each run tags the commit it built: v0.1.3 when published, v0.1.3-test.12 for a test build.
# The release notes list the pull requests merged since the last published version's tag.
# Setup and the secrets it needs: see "Mac app" in README.md.
name: Mac app

on:
  # Every merge to main that changes the app builds and publishes the next patch version
  # (minor or major with that label on a merged pull request, see "Pick the version").
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '*.command', '*.bat']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish as an update for everyone
        type: boolean
        default: false
      bump:
        description: Raise the version by
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or use exactly this version (like 1.2.0), leave empty to raise it
        type: string
        default: ''

# One build at a time, so two merges close together don't pick the same version.
concurrency:
  group: mac-app
  cancel-in-progress: false

env:
  # A push (merge to main) publishes; a manual run publishes only with Publish ticked.
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  build:
    runs-on: macos-latest
    # Lets the run tag the commit it built (see "Tag the commit") and read the merged pull
    # requests' titles for the release notes.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and tags, so the release notes can find the last release's commit.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ffmpeg converts ProRes clips added to the Studio scene (vendor/ffmpeg/build.sh). Built from
      # source once and cached until build.sh changes (its versions are in it).
      - name: Cache ffmpeg
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/ffmpeg/build.sh') }}
      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          command -v cmake >/dev/null || brew install cmake
          vendor/ffmpeg/build.sh
      - run: test -x vendor/ffmpeg/ffmpeg && vendor/ffmpeg/ffmpeg -hide_banner -version | head -1
      # Studio's Stream Deck plugin ships inside the app (plugins/studio-deck); the menu bar menu installs it.
      - name: Pack the Stream Deck plugin
        working-directory: plugins/studio-deck
        run: npm ci && npm run pack
      # Blackmagic UltraStudio / DeckLink output (native/decklink): a Node-API module, so one build
      # loads in any Electron. It needs no Blackmagic software to build; the test checks it loads.
      - name: Build the DeckLink module
        working-directory: native/decklink
        run: npm ci && npm run build && npm test
      # On a merge, a "major" or "minor" label on any pull request merged since the last published
      # version (found from its tag, as for the release notes) raises that part instead of the patch,
      # so a labelled PR that only changed docs still counts at the next publish. Major wins over minor.
      - name: Pick the version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PR_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
          WANTED: ${{ inputs.version || '' }}
        run: |
          LATEST="$(gh release list --repo zapheus-runplaywin/FirstPassStudio-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')" \
            || { echo "::error::Couldn't read FirstPassStudio-releases. Check the RELEASES_TOKEN secret."; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$LATEST" ] && git rev-parse -q --verify "refs/tags/$LATEST^{commit}" > /dev/null; then
            for PR in $(git log --first-parent --merges --format='%s' "$LATEST..HEAD" | sed -n 's/^Merge pull request #\([0-9][0-9]*\) from .*/\1/p'); do
              LABELS="$(GH_TOKEN="$PR_TOKEN" gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' 2>/dev/null)" \
                || { echo "::warning::Couldn't read the labels of #$PR"; continue; }
              if printf '%s\n' "$LABELS" | grep -qix major; then BUMP=major; echo "#$PR is labelled major"
              elif printf '%s\n' "$LABELS" | grep -qix minor && [ "$BUMP" != major ]; then BUMP=minor; echo "#$PR is labelled minor"; fi
            done
          fi
          echo "Raising the version by: $BUMP"
          VERSION="$(LATEST="${LATEST#v}" node -e '
            const { LATEST, BUMP, WANTED } = process.env;
            const parse = v => /^\d+\.\d+\.\d+$/.test(v) ? v.split(".").map(Number) : null;
            const higher = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const fail = m => { console.error(m); process.exit(1); };
            const last = LATEST && parse(LATEST);
            if (WANTED.trim()) {
              const v = parse(WANTED.trim().replace(/^v/, ""));
              if (!v) fail(`"${WANTED}" is not a version like 1.2.0`);
              if (last && higher(v, last) <= 0) fail(`${v.join(".")} is not higher than the last published version, ${LATEST}, and updates only go to a higher version`);
              console.log(v.join("."));
            } else if (!last) {
              console.log(require("./package.json").version);
            } else {
              const [a, b, c] = last;
              console.log(BUMP === "major" ? `${a + 1}.0.0` : BUMP === "minor" ? `${a}.${b + 1}.0` : `${a}.${b}.${c + 1}`);
            }
          ' 2>"$RUNNER_TEMP/version-error")" || { echo "::error::$(cat "$RUNNER_TEMP/version-error")"; exit 1; }
          npm version "$VERSION" --no-git-tag-version --allow-same-version > /dev/null
          echo "Last published: ${LATEST:-none}. This build: $VERSION"
          echo "### FirstPass Studio $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Last published: ${LATEST:-none}. $([ "$PUBLISH" = true ] && echo 'Published as an update.' || echo 'Test build, not published.')" >> "$GITHUB_STEP_SUMMARY"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"
      # Lists the titles of the pull requests merged since the last published version, found
      # from that version's tag on this repository. Only the titles go out: this repository is
      # private, so the public release links to nothing in it.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          echo "FirstPass Studio $VERSION for Apple silicon Macs." > "$NOTES"
          if [ -n "$LATEST" ] && git rev-parse -q --verify "refs/tags/$LATEST^{commit}" > /dev/null; then
            # Each merge's pull request title, or its last commit's message if the title can't be read.
            CHANGES="$(git log --first-parent --merges --reverse --format='%H %s' "$LATEST..HEAD" \
              | sed -n 's/^\([0-9a-f]*\) Merge pull request #\([0-9][0-9]*\) from .*/\1 \2/p' \
              | while read -r SHA PR; do
                  TITLE="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title 2>/dev/null)" || TITLE=""
                  if [ -z "$TITLE" ]; then TITLE="$(git log -1 --format=%s "$SHA^2")"; fi
                  echo "- $TITLE"
                done)"
            if [ -n "$CHANGES" ]; then
              printf '\n## What'"'"'s new\n\n%s\n' "$CHANGES" >> "$NOTES"
            else
              printf '\nNo changes merged since %s.\n' "$LATEST" >> "$NOTES"
            fi
          else
            echo "::warning::No tag ${LATEST:-for the last release} on this repository, so the release notes don't list changes."
          fi
          cat "$NOTES"
          { echo; cat "$NOTES"; } >> "$GITHUB_STEP_SUMMARY"
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"
      # Put the Developer ID certificate in a keychain of its own (electron-builder's own
      # keychain step fails on the current macOS runners), so codesign finds it.
      - name: Import the signing certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then echo "::error::The MAC_CERTIFICATE secret is empty"; exit 1; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -f pkcs12 -P "$MAC_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security \
            || { echo "::error::Couldn't open the certificate. Check MAC_CERTIFICATE is the base64 of a .p12 (not a .cer) and MAC_CERTIFICATE_PASSWORD is its export password."; exit 1; }
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application certificate with its private key in MAC_CERTIFICATE."; exit 1; }
      - name: Build, sign and notarise
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Signing asks Apple's timestamp server for every file, and it sometimes doesn't answer
        # ("A timestamp was expected but was not found"), so try up to three times.
        run: |
          for attempt in 1 2 3; do
            npx electron-builder --mac --publish never && exit 0
            echo "::warning::Build attempt $attempt failed (often Apple's timestamp server). Trying again."
            rm -rf dist
            sleep 30
          done
          echo "::error::The build failed three times. See the log above."
          exit 1
      # Published here in one step rather than by electron-builder: its .zip and .dmg uploads
      # each tried to create the release at the same moment, and the second one failed
      # ("Published releases must have a valid tag"), leaving a release without the .dmg.
      # latest-mac.yml is what installed apps read to find the update.
      - name: Publish the update
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ls -l dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml
          gh release create "v$VERSION" --repo zapheus-runplaywin/FirstPassStudio-releases \
            --title "FirstPass Studio $VERSION" --notes-file "$NOTES_FILE" --latest \
            dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml
      # Tags the FirstPassStudio commit this was built from, so each build can be traced back
      # to its code: v0.1.3 for a published update, v0.1.3-test.12 for a test build
      # (12 is the run number), so a test build never takes a published version's tag.
      - name: Tag the commit
        run: |
          if [ "$PUBLISH" = true ]; then TAG="v$VERSION"; else TAG="v$VERSION-test.$GITHUB_RUN_NUMBER"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::warning::The tag $TAG already exists, so it was left as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "FirstPass Studio $VERSION, Mac app run $GITHUB_RUN_NUMBER"
          git push origin "refs/tags/$TAG"
          echo "Tagged ${GITHUB_SHA:0:7} as $TAG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: FirstPass-Studio-${{ env.VERSION }}-mac
          path: dist/*.dmg
          compression-level: 0
          retention-days: 14
