<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social picture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<style>
  /* One picture for social media, at Instagram's size: square 1080 x 1080, portrait 1080 x 1350 or a Story
     1080 x 1920. Not a stream graphic: the Socials tab (socials.html) shows these as previews, and the Mac app
     saves them as PNGs. The colours and font are the competition's (theme.css). */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: var(--font); color: var(--text); width: var(--w); height: var(--h); overflow: hidden; position: relative; }
  [hidden] { display: none !important; }
  /* The display face: the competition's font, or the template set's (social-templates.css sets --dfont). */
  body { --dfont: var(--font); }
  :is(.tab, .title, .when, .slot__time, .group__name, .verdict, .vs__v, .vs__score, .score, .game__v, .call__div, .call__time,
    .shooter__rank, .shooter__name, .stat, .polaroid__caption) { font-family: var(--dfont); }

  /* The ground: the competition's dark colour lit from the top, a band of its main colour across it. A polaroid
     with no photo cuts a see-through window out of it (mask, set by drawPolaroid). */
  .ground { position: absolute; inset: 0; background:
      linear-gradient(115deg, transparent 0 58%, rgba(var(--purple-rgb), .55) 58% 70%, transparent 70%),
      radial-gradient(circle at 30% 0%, var(--purple-dark-light), var(--purple-dark) 70%); }
  .ground::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: var(--pink); }

  .frame { position: absolute; inset: 0; padding: 64px 64px 0; display: flex; flex-direction: column; }
  /* A Story keeps its words and marks out of the top and bottom, where Instagram draws its own bar, name and reply box;
     only the ground runs to the edges. */
  .story .frame { padding-top: 200px; padding-bottom: 200px; }
  .story .title { font-size: 100px; }
  .story .head__logo { width: 210px; height: 210px; }
  .head { display: flex; align-items: center; gap: 28px; }
  .head__logo { width: 180px; height: 180px; object-fit: contain; flex: none; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
  .head__text { min-width: 0; }
  .tab { display: inline-block; background: var(--pink); color: var(--text); padding: 8px 18px; border-radius: 6px;
    font-size: 24px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .title { margin: 14px 0 0; font-size: 84px; font-weight: 800; line-height: .95; text-transform: uppercase; color: var(--yellow); letter-spacing: .01em; }
  .when { margin-top: 12px; font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .when small { color: var(--muted); font-size: .8em; letter-spacing: .1em; margin-left: 12px; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 36px 0 60px; } /* the mark sits above the sponsor strip */
  .fit { transform-origin: center center; }

  /* The foot: the top sponsors on a light strip, the FirstPass Studio mark and the PIVT logo. */
  .foot { position: relative; min-height: 64px; margin: 0 -64px; }
  .sponsors { display: flex; align-items: center; justify-content: center; gap: 44px; padding: 22px 64px; background: rgba(255,255,255,.94); }
  .sponsors small { color: #444; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .sponsors img { height: 74px; max-width: 220px; object-fit: contain; }
  .sponsors span { color: #222; font-size: 28px; font-weight: 800; }
  .mark { position: absolute; right: 40px; bottom: 22px; width: 230px; opacity: .85; }
  .sponsors:not([hidden]) ~ .mark { bottom: auto; top: -46px; }
  .pivt { position: absolute; left: 40px; bottom: 18px; height: 52px; }
  /* A carousel's place, top right: 2/6, with the arrow to swipe on (Swipe on the first) on all but the last. */
  .page { position: absolute; top: 24px; right: 28px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 6px 16px;
    border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font-size: 24px; font-weight: 800; letter-spacing: .06em; }
  .page b { font-size: 30px; line-height: 1; }
  .story .page { top: 120px; }
  .sponsors:not([hidden]) ~ .pivt { bottom: auto; top: -64px; }

  .logo { object-fit: contain; flex: none; }
  .logo-fallback { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--purple);
    color: var(--yellow); font-weight: 800; border: 4px solid var(--yellow); }
  .message { font-size: 34px; font-weight: 700; background: var(--purple-deep); padding: 28px 32px; border-radius: 14px; text-align: center; }

  /* Game night fixture: the night's games by time, every court. */
  .slot + .slot { margin-top: calc(26px + 2 * var(--spread, 0px)); }
  .slot__time { display: inline-block; font-size: 30px; font-weight: 800; color: var(--purple-dark); background: var(--yellow);
    border-radius: 8px; padding: 4px 16px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .game { display: grid; grid-template-columns: var(--logo) minmax(0, 1fr) 50px minmax(0, 1fr) var(--logo); align-items: center; gap: 16px;
    background: var(--purple-deep); border-radius: 14px; padding: 14px 20px; border-left: 8px solid var(--pink); }
  .game + .game { margin-top: calc(10px + var(--spread, 0px)); }
  .game .logo { width: var(--logo); height: var(--logo); }
  body { --logo: 76px; }
  /* A Story has the height for bigger rows. */
  body.story { --logo: 100px; }
  .story .game { padding: 20px 24px; }
  .story .game__team { font-size: calc(38px * var(--nf, 1)); }
  .story .slot + .slot { margin-top: calc(40px + 2 * var(--spread, 0px)); }
  .game .logo-fallback { font-size: 24px; border-width: 3px; }
  .game__team { font-size: calc(32px * var(--nf, 1)); font-weight: 800; text-transform: uppercase; line-height: 1.05; min-width: 0; overflow-wrap: anywhere; }
  .game__team.away { text-align: right; }
  .game__v { text-align: center; color: var(--pink); font-size: 26px; font-weight: 800; }
  .game__info { grid-column: 1 / -1; font-size: 22px; font-weight: 700; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-top: -4px; text-align: center; }

  /* Match up: one game, big. */
  .vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 20px; text-align: center; }
  .vs .logo { width: 360px; height: 360px; margin: 0 auto; display: flex; filter: drop-shadow(0 12px 26px rgba(0,0,0,.5)); }
  .vs .logo-fallback { font-size: 110px; }
  .vs h2 { margin: 22px 0 0; font-size: calc(50px * var(--nf, 1)); font-weight: 800; text-transform: uppercase; color: var(--yellow); line-height: 1.05; overflow-wrap: anywhere; }
  .vs__v { width: 120px; height: 120px; border-radius: 50%; background: var(--pink); display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 800; box-shadow: 0 0 0 8px var(--purple), 0 8px 24px rgba(0,0,0,.4); }
  .info { margin-top: 44px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 40px; background: var(--purple);
    border-radius: 14px; padding: 22px 28px; font-size: 32px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .info b { color: var(--yellow); }

  /* On the stream: the streamed court's games and who calls them. */
  .live { display: inline-flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text); background: #d11; border-radius: 999px; padding: 8px 22px; margin-bottom: 26px; align-self: flex-start; }
  .live::before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .call { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 22px; align-items: center; background: var(--purple-deep);
    border-radius: 14px; padding: 18px 24px; }
  .call + .call { margin-top: calc(12px + 2 * var(--spread, 0px)); }
  .call__time { grid-row: span 2; min-width: 150px; font-size: 40px; font-weight: 800; color: var(--yellow); font-variant-numeric: tabular-nums; }
  /* The logos either side of the names, which wrap between words (never mid-word) when long. */
  .call__teams { --cl: 100px; display: grid; grid-template-columns: var(--cl) minmax(0, 1fr) auto minmax(0, 1fr) var(--cl); align-items: center; gap: 14px;
    font-size: calc(32px * var(--nf, 1)); font-weight: 800; text-transform: uppercase; min-width: 0; }
  .story .call__teams { --cl: 124px; }
  .call__teams .logo { width: var(--cl); height: var(--cl); filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
  .call__teams .logo-fallback { font-size: 28px; border-width: 3px; }
  .call__teams span { line-height: 1.05; overflow-wrap: normal; }
  .call__teams span.away { text-align: right; }
  .call__teams i { font-style: normal; color: var(--pink); font-size: 24px; text-align: center; }
  .call__mic { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 24px; font-weight: 700; color: var(--muted); }
  .call__div { font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--purple-dark); background: var(--yellow);
    border-radius: 6px; padding: 2px 12px; }
  .call__mic b { color: var(--text); }

  /* Polaroid: a tilted white print with a match photo, or a see-through window to put one under. */
  .polaroid { position: absolute; background: transparent; border: solid #fbfaf6; border-width: var(--edge) var(--edge) var(--chin);
    box-shadow: 0 24px 50px rgba(0,0,0,.5); }
  .polaroid__photo { position: absolute; inset: 0; overflow: hidden; background: #ddd; }
  .polaroid__photo img { width: 100%; height: 100%; object-fit: cover; transform-origin: var(--px) var(--py); }
  .polaroid__caption { position: absolute; left: 0; right: 0; bottom: calc(-1 * var(--chin)); height: var(--chin); display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #1d1d24; text-align: center; padding: 0 30px; }
  .polaroid__caption b { font-size: var(--cap, 60px); font-weight: 800; font-style: italic; line-height: 1; text-transform: uppercase; color: var(--ink-dark, var(--purple-dark)); }
  .polaroid__caption span { margin-top: 10px; font-size: calc(var(--cap, 60px) * .45); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #555; }
  .polaroid__caption :is(b, span) { white-space: nowrap; max-width: 100%; }
  .tape { position: absolute; top: calc(-1 * var(--edge) - 26px); left: 50%; width: 220px; height: 56px; margin-left: -110px; transform: rotate(3deg);
    background: rgba(var(--yellow-rgb), .75); box-shadow: 0 2px 6px rgba(0,0,0,.2); }

  /* Results: the night's final scores, division by division; the winner in the highlight colour. */
  .group + .group { margin-top: calc(26px + 2 * var(--spread, 0px)); }
  .group__name { display: inline-block; font-size: 26px; font-weight: 800; color: var(--purple-dark); background: var(--yellow);
    border-radius: 8px; padding: 4px 16px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .result { display: grid; grid-template-columns: var(--logo) minmax(0, 1fr) 84px 84px minmax(0, 1fr) var(--logo); align-items: center; gap: 14px;
    background: var(--purple-deep); border-radius: 14px; padding: 14px 20px; border-left: 8px solid var(--pink); }
  .result + .result { margin-top: calc(10px + var(--spread, 0px)); }
  .result .logo { width: var(--logo); height: var(--logo); }
  .result .logo-fallback { font-size: 24px; border-width: 3px; }
  .story .result { padding: 20px 24px; }
  .score { text-align: center; font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 10px; padding: 4px 0;
    background: rgba(255,255,255,.08); color: var(--muted); }
  .score.won { background: var(--pink); color: var(--text); }
  .result .game__team { color: var(--muted); }
  .result .game__team.won { color: var(--yellow); }
  .result .game__team { overflow-wrap: normal; } /* breaks between words only; the score boxes leave less room */
  .later { margin-top: 18px; font-size: 22px; font-weight: 700; color: var(--muted); text-align: center; letter-spacing: .06em; text-transform: uppercase; }

  /* Rows of the Upcoming pictures, drawn as Finals bound's rows (so every template set styles them): a team or athlete,
     its logo, and what to say about it. */
  .bound.bound--form { grid-template-columns: var(--logo) minmax(0, 1fr); }
  .bound.bound--bye { grid-template-columns: var(--logo) minmax(0, 1fr); }
  .bound.bound--ms { grid-template-columns: 96px minmax(0, 1fr) auto; }
  .bound--ms .face { width: 96px; height: 96px; }
  .bound.bound--draw { grid-template-columns: 250px var(--logo) minmax(0, 1fr) auto; font-size: 30px; }
  .bound--draw .shooter__name { font-size: 28px; }
  .bound--draw .shooter__team { font-size: 19px; white-space: nowrap; }
  .form__chips { display: flex; gap: 10px; margin-top: 10px; }
  .form__chips .stat { min-width: 84px; }
  .form__none { font-size: 24px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .preview--pick { box-shadow: 0 0 0 4px var(--yellow); }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(18px + var(--spread, 0px)) 18px; }
  .tiles .stat { padding: 22px 10px; }
  .tiles .stat b { font-size: 96px; }
  .tiles .stat small { font-size: 22px; line-height: 1.2; }
  .tiles .stat .stat__note { display: block; margin-top: 6px; opacity: .75; }
  .card__head { display: flex; align-items: center; gap: 28px; margin-bottom: calc(20px + var(--spread, 0px)); }
  .card__head .logo { width: 150px; height: 150px; }
  .card__head .logo-fallback { font-size: 48px; }
  .card__lines { margin-top: calc(18px + var(--spread, 0px)); }
  .card__lines .bound + .bound { margin-top: calc(10px + var(--spread, 0px)); }
  .bound.bound--team { grid-template-columns: var(--logo) minmax(0, 1fr) auto; }
  .shooter.shooter--norank { grid-template-columns: 76px minmax(0, 1fr) auto; }
  .bound.bound--line { grid-template-columns: minmax(0, 1fr) auto; font-size: 30px; }
  /* The hand picks and spotlights: a big photo (or logo) with a team badge, as the Champions picture lays it out. */
  .champ__logo .champ__photo { position: relative; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 12px 26px rgba(0,0,0,.5)); }
  .champ__logo .logo.champ__badge { position: absolute; width: 120px; height: 120px; right: -24px; bottom: -8px; }
  .champ .tiles { margin-top: calc(26px + var(--spread, 0px)); width: 100%; }
  .champ .tiles .stat b { font-size: 76px; }
  .bound.bound--pos { grid-template-columns: 86px var(--logo) minmax(0, 1fr); }
  /* Thanks for watching's sponsors on a light panel, as the sponsor strip shows them. */
  .thanks__logos { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 36px 48px; margin-top: calc(18px + var(--spread, 0px));
    padding: 30px 36px; border-radius: 18px; background: rgba(255,255,255,.94); }
  .thanks__logos img { height: 120px; max-width: 300px; object-fit: contain; }
  /* Score worm: the margin over the game, each team's side of the line in its colour. */
  .worm { width: 100%; }
  .worm svg { display: block; width: 100%; height: auto; overflow: visible; }
  .worm .axis { fill: var(--muted); font-size: 24px; font-weight: 800; letter-spacing: .1em; }
  .worm .zero { stroke: var(--text); stroke-width: 3; opacity: .6; }
  .worm .qline { stroke: var(--text); stroke-width: 2; opacity: .2; stroke-dasharray: 6 8; }
  .worm .line { fill: none; stroke: var(--text); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  /* Game stats: a row a stat, the home team's figure on the left and the away team's on the right, the better one
     in the main colour. */
  .bound.bound--cmp { grid-template-columns: 150px minmax(0, 1fr) 150px; font-size: 30px; }
  .bound--cmp .game__team { text-align: center; }
  .bound--cmp .stat b { font-size: 48px; }
  .cmp__teams { margin-bottom: calc(16px + var(--spread, 0px)); }
  /* Team sheet: the two squads side by side, a row a player: position, name, games played. */
  .sheet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .sheet__team { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .sheet__team .logo { width: 72px; height: 72px; }
  .bound.bound--sheet { grid-template-columns: 62px minmax(0, 1fr) auto; gap: 12px; padding: 8px 14px; font-size: 24px; }
  .bound.bound--sheet + .bound--sheet { margin-top: calc(6px + var(--spread, 0px) / 2); }
  .bound--sheet .shooter__name { font-size: calc(26px * var(--nf, 1)); }
  .bound--sheet .bound__earned { font-size: 20px; padding: 4px 10px; }
  .sheet__pos { font-size: 22px; font-weight: 800; color: var(--yellow); text-align: center; }
  /* Moments of the game: a row a moment, its time, the team, what happened and the score then. */
  .bound.bound--moment { grid-template-columns: 130px var(--logo) minmax(0, 1fr) auto; font-size: 28px; }
  .moment__when { font-size: 24px; font-weight: 800; text-align: center; color: var(--yellow); line-height: 1.1; }
  .moment__when small { display: block; font-size: 18px; color: var(--muted); letter-spacing: .06em; }
  /* Watch it back: the QR code on white, beside what was streamed and the link. */
  .watch { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 40px; align-items: center; }
  .watch__qr { background: #fff; border-radius: 20px; padding: 18px; }
  .watch__qr svg { display: block; width: 100%; height: auto; }
  .watch__games .bound + .bound { margin-top: calc(10px + var(--spread, 0px)); }
  .watch__link { margin-top: 18px; font-size: 26px; font-weight: 800; overflow-wrap: anywhere; }
  .thanks__logos span { color: #222; font-size: 34px; font-weight: 800; text-transform: uppercase; }
  .count { text-align: center; font-family: var(--dfont); text-transform: uppercase; }
  .count__big { font-size: 320px; font-weight: 800; line-height: .9; color: var(--yellow); }
  .count__words { margin-top: 20px; font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: .02em; }
  .story .count__big { font-size: 420px; }

  /* Round in review: each pick's label over its result row, and what made it one under it. */
  .review__note { margin-top: 10px; }

  /* Full time: one result, big. */
  .vs__score { margin-top: 10px; font-size: 150px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  .vs__score.won { color: var(--text); text-shadow: 0 6px 22px rgba(0,0,0,.45); }
  .vs .lost .logo { opacity: .75; }
  .vs .lost h2 { color: var(--muted); }
  .verdict { margin: 34px auto 0; display: table; background: var(--yellow); color: var(--purple-dark); border-radius: 12px; padding: 12px 30px;
    font-size: 40px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }

  /* Ladder: a division's standings; a line under the finals places. */
  .ladder { width: 100%; border-collapse: separate; border-spacing: 0 calc(8px + var(--spread, 0px)); font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ladder th { font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 0 10px; }
  .ladder td { background: var(--purple-deep); padding: 12px 10px; text-align: center; }
  .ladder td:first-child { border-radius: 12px 0 0 12px; color: var(--yellow); width: 70px; }
  .ladder td:last-child { border-radius: 0 12px 12px 0; color: var(--purple-dark); background: var(--yellow); width: 100px; }
  .ladder td.team { text-align: left; text-transform: uppercase; }
  .ladder td.team div { display: flex; align-items: center; gap: 16px; }
  .ladder .logo { width: 58px; height: 58px; }
  .ladder .logo-fallback { font-size: 18px; border-width: 3px; }
  .ladder td.pct { color: var(--muted); font-size: 26px; }
  .ladder tr.cut td { border-bottom: 4px dashed var(--pink); }
  .story .ladder { font-size: 36px; border-spacing: 0 calc(12px + var(--spread, 0px)); }
  .story .ladder td { padding: 18px 10px; }
  .ladder td.mv { background: transparent; padding: 0 6px; width: 84px; }
  .ladder td.mv .move { display: inline-block; }
  .key { margin-top: 10px; font-size: 22px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .key i { display: inline-block; width: 40px; border-top: 4px dashed var(--pink); vertical-align: middle; margin-right: 10px; }

  /* Finals bound: the teams in a division's finals, each with what their ladder place earned. */
  .bound { display: grid; grid-template-columns: 70px var(--logo) minmax(0, 1fr) auto; align-items: center; gap: 18px; background: var(--purple-deep);
    border-radius: 14px; padding: 14px 20px; border-left: 8px solid var(--pink); font-size: 36px; font-weight: 800; text-transform: uppercase; }
  .bound + .bound { margin-top: calc(10px + var(--spread, 0px)); }
  .bound .logo { width: var(--logo); height: var(--logo); }
  .bound .logo-fallback { font-size: 24px; border-width: 3px; }
  .bound__earned { font-size: 22px; letter-spacing: .06em; border-radius: 8px; padding: 6px 14px; background: rgba(127,127,127,.2); color: inherit; white-space: nowrap; } /* reads on a dark row or a white one */
  .bound__earned--final, .bound__earned--double, .bound__earned--bye { background: var(--yellow); color: var(--purple-dark); }
  .bound__earned--elim { background: var(--pink); color: var(--text); }
  .tag { display: inline-block; margin-bottom: 16px; font-size: 22px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    background: var(--pink); color: var(--text); border-radius: 8px; padding: 6px 16px; }

  /* Finals draw: the finals week by week, each game with its name; the winners in the highlight colour, the grand final outlined. */
  .final__name { display: flex; justify-content: space-between; gap: 16px; font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px 8px; }
  .final + .final { margin-top: calc(12px + var(--spread, 0px)); }
  .final--gf .result { box-shadow: 0 0 0 4px var(--yellow); }
  .result .game__team.final__tbc { font-size: 26px; font-weight: 700; line-height: 1.2; text-transform: none; opacity: .8; }
  .result__final { font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 8px; }
  .result__final + .result { margin-top: 0; }
  .result + .result__final { margin-top: calc(12px + var(--spread, 0px)); }

  /* Champions: the grand final winners big, their logo lit in their own colour, and the grand final under them. */
  .champ { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .champ__logo { position: relative; width: 340px; height: 340px; display: flex; align-items: center; justify-content: center; }
  .champ__logo::before { content: ''; position: absolute; inset: -40px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--team, var(--yellow)) 70%, transparent) 0%, transparent 68%); }
  .champ__logo .logo { position: relative; width: 100%; height: 100%; }
  .champ__logo .logo-fallback { font-size: 110px; border-width: 8px; }
  .champ__name { margin: 26px 0 0; font-size: 84px; font-weight: 800; line-height: 1.05; text-transform: uppercase; color: var(--yellow); font-family: var(--dfont); }
  .champ__what { margin-top: 10px; font-size: 30px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .champ__final { margin-top: 40px; width: 100%; text-align: left; }
  .story .champ__logo { width: 460px; height: 460px; }
  .story .champ__name { font-size: 100px; }

  /* Top shooters: the night's best, from each finished game's line ups. */
  .shooter { display: grid; grid-template-columns: 60px 76px minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--purple-deep);
    border-radius: 14px; padding: 14px 22px; }
  .shooter + .shooter { margin-top: calc(10px + var(--spread, 0px)); }
  .shooter:first-of-type { background: var(--purple); box-shadow: 0 0 0 4px var(--yellow) inset; }
  .shooter__rank { font-size: 44px; font-weight: 800; color: var(--yellow); text-align: center; }
  .shooter .logo { width: 76px; height: 76px; }
  .shooter .logo-fallback { font-size: 22px; border-width: 3px; }
  .shooter__name { font-size: calc(36px * var(--nf, 1)); font-weight: 800; text-transform: uppercase; line-height: 1.05; white-space: nowrap; }
  .shooter__team { font-size: 22px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
  .shooter__stats { display: flex; gap: 12px; }
  .stat { min-width: 96px; text-align: center; border-radius: 10px; background: rgba(255,255,255,.08); padding: 6px 10px; }
  .stat b { display: block; font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat small { display: block; margin-top: 4px; font-size: 19px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .stat.main { background: var(--pink); }
  .stat.main small { color: var(--text); }
  .story .shooter { padding: 22px 24px; }
  /* Tournament top shooters: the move since the round before beside the rank, big enough to read on a phone, and a row
     that climbed (or is new) outlined. */
  .shooter__rank { display: flex; align-items: center; justify-content: center; gap: 8px; line-height: 1; }
  .move { min-width: 58px; text-align: center; font-size: 28px; font-weight: 800; letter-spacing: .02em; border-radius: 8px; padding: 5px 6px; }
  .move--up { background: #1f9d55; color: #fff; }
  .move--down { background: #b23a48; color: #fff; }
  .move--new { background: var(--yellow); color: var(--purple-deep); }
  .move--same { color: var(--muted); }
  .k-tournament .shooter { grid-template-columns: 64px 76px minmax(0, 1fr) auto; }
  .k-tournament .movers .shooter { grid-template-columns: 124px 76px minmax(0, 1fr) auto; }
  .k-tournament .shooter--climbed:not(:first-of-type) { box-shadow: 0 0 0 5px #1f9d55 inset; }
  .k-tournament .stat { min-width: 84px; }

  /* Commentary team: a headshot (or initials) per commentator of one game, their name, and the game once underneath. */
  .crew { display: flex; flex-wrap: nowrap; justify-content: center; align-items: flex-start; gap: 32px; --ms: 400px; }
  /* Up to three in one row, the biggest faces that fit (a Story stacks them); one alone is bigger still. */
  .crew--1 { --ms: 460px; }
  .crew--3 { --ms: 290px; gap: 24px; }
  .story .crew { --ms: 440px; flex-direction: column; align-items: center; gap: 20px; }
  .story .crew--1 { --ms: 620px; }
  .story .crew--3 { --ms: 300px; }
  .crew .mic { width: auto; flex: 0 1 calc(var(--ms) + 40px); min-width: 0; }
  .story .crew .mic { flex: none; width: calc(var(--ms) + 60px); }
  .crew .mic__face { width: min(var(--ms), 100%); height: auto; aspect-ratio: 1; }
  .crew .mic__name { font-size: calc(48px * var(--nf, 1)); text-wrap: balance; }
  .crew .mic__name span { white-space: nowrap; }
  .crew--3 .mic__name { font-size: calc(38px * var(--nf, 1)); }
  .crew__game { margin-top: 36px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .crew__game b { font-family: var(--dfont); font-size: 34px; font-weight: 800; color: var(--yellow); letter-spacing: .04em; }
  .crew__game span { font-family: var(--dfont); font-size: 46px; font-weight: 800; text-transform: uppercase; line-height: 1.05; text-wrap: balance; }
  .crew__game small { font-size: 24px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .mic { width: calc(var(--ms) + 60px); text-align: center; }
  .mic__face { width: var(--ms); height: var(--ms); margin: 0 auto; border-radius: 50%; overflow: hidden; border: 8px solid var(--yellow);
    background: var(--purple-deep); display: flex; align-items: center; justify-content: center; font-family: var(--dfont);
    font-size: calc(var(--ms) * .32); font-weight: 800; color: var(--yellow); box-shadow: 0 14px 30px rgba(0,0,0,.35); }
  .mic__face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  .mic__guest { display: inline-block; margin-top: -22px; position: relative; background: var(--pink); color: #fff; font-size: 22px; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase; padding: 6px 16px; border-radius: 6px; }
  .mic__guest--blank { visibility: hidden; }
  .story .mic__guest--blank { display: none; }
  .mic__name { margin-top: 18px; font-family: var(--dfont); font-size: calc(40px * var(--nf, 1)); font-weight: 800; text-transform: uppercase; line-height: 1.05; }

  /* Athletes' photos (only those who approved their use): a shooter's face in place of the logo, with the logo as a badge;
     an athlete picked for a match up or full time over their team's logo; a polaroid's print. Cut-out PNGs stand free. */
  .face { position: relative; width: 76px; height: 76px; flex: none; }
  .face img.face__photo { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; border-radius: 50%; background: rgba(255,255,255,.12); }
  .face .logo { position: absolute; right: -8px; bottom: -6px; width: 36px; height: 36px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .shooter .face .logo { width: 36px; height: 36px; }
  .athlete { position: relative; width: 360px; height: 400px; margin: 0 auto; }
  .athlete__photo { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 12px 26px rgba(0,0,0,.5)); }
  .vs .athlete .logo { position: absolute; left: -10px; bottom: 0; width: 130px; height: 130px; margin: 0; }
  .vs .athlete .logo-fallback { font-size: 40px; }
  .athlete__name { margin-top: 6px; font-size: 28px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .k-fulltime .athlete { width: 300px; height: 320px; } /* the score and the verdict need the room */
  .k-fulltime .vs .athlete .logo { width: 110px; height: 110px; }

<body>
  <!-- A picture of a game night for social media, drawn from Studio's own data (GET /api/socials/night), never PlayHQ
       directly. The Socials tab (socials.html) builds these links and the Mac app saves them as PNGs.
       http://localhost:8080/social.html?kind=fixtures&size=square
       kind:  Upcoming: fixtures (every game of the night)  matchup (one game, &game=<id>)  onstream (the court Studio
              streams and its commentators, from the Production Planner)  commentators (the commentary team's headshots,
              from the Production Planner)  polaroid (a match photo in a white print)  form (Form guide, &game=<id>)
              preview (Round preview, &division=<name>)  byes  milestones (&when=next: due that night; &when=played: on
              Results, played that night)  race (Finals race, &division=<name>)  countdown (to the finals or the grand
              final)  draw (Season draw, &division=<name>&team=<name>)  h2h (Head to head, &game=<id>: the teams' meetings
              this season)  teamsheet (Team sheet, &game=<id>: both squads with games played)
              Results: accuracy (Sharpshooter, &division=)  supershots (Super shot leaders, &division=)  teamsupers (Team super
              shots, &division=)  onfire
              (&division=)  numbers (Night in numbers)  club (Club round up, &club=<name>)  streaks (teams unbeaten or on
              a run)  season (Team season card, &division=&team=)  wrap (Season wrap, &division=)  potm (Player of the
              match, &game=<id>&athlete=<name>, &medal=<a medal's name>)  teamround (Team of the round, &division=,
              &GS=<name> .. &GK=<name>)  thanks (Thanks for watching)
              story (Game story, &game=<id>: a game Studio streamed, from its scoreboard)  worm (Score worm, &game=<id>)
              watch (Watch it back, &link=<the replay's web link>: a QR code)  moments (Moments of the game, &game=<id>:
              a game Studio streamed)  gamestats (Game stats, &game=<id>: team against team from the line ups)  shooting
              (Shooting duel, &game=<id>)  runs (Runs of the night)  supershottime (Super shot time)  comeback (Comeback
              of the night): the night's streamed games
              Either: spotlight (Athlete spotlight, &athlete=<name>)  sponsorspot (Sponsor spotlight, &sponsor=<id>)
              results (the night's final scores)  review (Round in review: the biggest win, the closest game and
              the upsets)  fulltime (one game's, &game=<id>)  ladder (&division=<name>, as PlayHQ has it now; on the
              division's latest night, &movers=0|1 the places each moved since before the night)  topshooters (&division=<name>, that division's, else the
              night's, from each finished game's line ups)  tournament (&division=<name>: its top shooters over every
              finished game so far, &after=HH:MM counting only this night's games starting by then, &movers=0|1 the
              places each moved since the round before; else as on the tab)  polaroid&game=<id> (the
              game's score under the photo)  finalsbound (&division=<name>: the teams in its finals and what
              each earned)  finalsdraw (&division=<name>: its finals week by week, winners filled in)
              champions (&division=<name>: its grand final winners, called Champions or Premiers as set up)
              On a finals night, match up, full time and results name each final (Major semi final, Grand final).
       size:  square (1080 x 1080)  portrait (1080 x 1350)  story (1080 x 1920)
       Options: ?date=2026-11-05 (the night; else the next one)  ?sponsor=0|1 (the sponsor strip; else as on the tab)
                ?colours=<colour set> (competition, accent-first, highlight-ground, accent-ground, night, day,
                two-colours or one made on the tab; else the one picked there)
                ?template=<template set> (default, dynamic, junior, retro, professional, thunder, gradient,
                highcontrast, neon, poster, splash, gameday, hero, final, court, bib, goal, bottle, cones,
                sneakers, stadium or locker; else the one picked there)
                ?mark=0|1 (the FirstPass Studio mark, bottom right; else as on the tab)  ?pivt=0|1 (the PIVT logo, bottom left)  ?title= (the heading)
                ?page=2/6 (its place in a carousel, marked top right, with an arrow to swipe on until the last)
                Match up, full time: &home=<athlete> &away=<athlete> (their photo over the team's logo, when they approved its use)
                Top shooters: each shooter's photo, when they approved its use
                Polaroid: ?athlete=<name> (their photo) or ?photo=<file from POST /api/socials/photo> &px=50&py=50 (the point of the photo kept in view, %)
                &zoom=1.4 (1-3); with no photo the window is see-through, to put one under it in another app.
                ?fit=1 (drawn smaller to fit a smaller window, for the Mac app)
                &caption= &note= (the two lines under the photo)
       When drawn it sets window.socialReady (a promise) to true, or to a message when there's nothing to draw. -->
  <div class="ground" id="ground"></div>
  <div class="frame" id="frame">
    <header class="head" id="head">
      <img class="head__logo" id="compLogo" alt="" hidden>
      <div class="head__text">
        <div class="tab" id="tab"></div>
        <h1 class="title" id="title"></h1>
        <div class="when" id="when"></div>
      </div>
    </header>
    <div class="body" id="body"><div class="fit" id="fit"></div></div>
    <footer class="foot" id="foot">
      <div class="sponsors" id="sponsors" hidden></div>
      <img class="mark" id="mark" src="studio/firstpass-studio.svg" alt="FirstPass Studio" hidden>
      <img class="pivt" id="pivt" src="studio/pivt.svg" alt="PIVT" hidden>
    </footer>
    <div class="page" id="page" hidden></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    const SIZES = { square: [1080, 1080], portrait: [1080, 1350], story: [1080, 1920] };
    const size = SIZES[params.get('size')] ? params.get('size') : 'square';
    const [W, H] = SIZES[size];
    document.body.classList.add(size);
    // ?fit=1: drawn smaller to fit a smaller window (the Mac app draws a picture taller than the screen in a window
    // half its size at twice the density, so it still comes out at full size).
    if (params.get('fit') === '1' && innerWidth && innerWidth < W) document.documentElement.style.zoom = String(innerWidth / W);
    document.documentElement.style.setProperty('--w', `${W}px`);
    document.documentElement.style.setProperty('--h', `${H}px`);
    const KINDS = ['story', 'worm', 'watch', 'gamestats', 'shooting', 'moments', 'h2h', 'teamsheet', 'runs', 'supershottime', 'comeback', 'potm', 'teamround', 'spotlight', 'sponsorspot', 'thanks', 'accuracy', 'supershots', 'teamsupers', 'onfire', 'numbers', 'club', 'streaks', 'season', 'wrap', 'fixtures', 'matchup', 'form', 'preview', 'byes', 'milestones', 'race', 'countdown', 'draw', 'onstream', 'commentators', 'polaroid', 'results', 'review', 'fulltime', 'ladder', 'topshooters', 'tournament', 'finalsbound', 'finalsdraw', 'champions'];
    const kind = KINDS.includes(params.get('kind')) ? params.get('kind') : 'fixtures';
    document.body.classList.add(`k-${kind}`);
    const flag = (name, saved) => (params.has(name) ? params.get(name) !== '0' : saved);

    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; };
    function logoEl(team, cls) {
      if (team.logo) { const img = el('img', `logo ${cls || ''}`); img.src = team.logo; img.alt = ''; return img; }
      const initials = String(team.name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase();
      return el('div', `logo logo-fallback ${cls || ''}`, initials);
    }
    function clock(time) {
      const [h, m] = String(time || '').split(':').map(Number);
      return Number.isFinite(h) ? `${(h % 12) || 12}:${String(m || 0).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}` : (time || 'TBC');
    }
    const nth = n => `${n}${[, 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th'}`;
    const dayLong = d => new Date(`${d}T00:00:00`).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
    const dayShort = d => { const x = new Date(`${d}T00:00:00`); return `${x.toLocaleDateString('en-AU', { weekday: 'short' })} ${x.getDate()} ${x.toLocaleDateString('en-AU', { month: 'short' })}`; };

    // Fits what's in the middle between the heading and the foot: shrinks it when it's too big, and when there's room
    // to spare, lays it out narrower and scales it back up to the full width, as far as the height allows (up to 1.35
    // times, 1.6 on a Story), then spreads its rows apart, so a short ladder or two games fill the picture instead of
    // floating in it.
    function fit() {
      const box = $('body'), inner = $('fit');
      inner.style.scale = ''; inner.style.width = ''; inner.style.alignSelf = ''; inner.style.removeProperty('--spread');
      // The body's own padding is 36 + 60; a template that pads it more (to clear its decoration) gets less room.
      const cs = getComputedStyle(box), pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) - 96;
      // With the sponsor strip, the PIVT logo and the mark sit in the body's bottom padding, so nothing runs into it.
      const room = { w: box.clientWidth, h: box.clientHeight - ($('sponsors').hidden ? 72 : 108) - pad }, need = { w: inner.scrollWidth, h: inner.scrollHeight };
      const s = Math.min(1, room.w / need.w, room.h / need.h);
      if (s < 1) { inner.style.scale = String(Math.floor(s * 1000) / 1000); return; }
      // How tall it comes out at g times, laid out at the width that g brings back to full; no good if anything is too
      // wide for it, or any words wrap onto more lines than at full width (a name broken up, a row taller).
      const all = [...inner.querySelectorAll('*')];
      const words = all.filter(e => !e.children.length && e.textContent.trim());
      const lines = words.map(e => e.offsetHeight);
      const spill = e => e.clientWidth ? e.scrollWidth - e.clientWidth : 0; // a name running out of its cell, say
      const spills = all.map(spill);
      const tall = g => {
        inner.style.width = `${room.w / g}px`;
        if (inner.scrollWidth > room.w / g + 1 || words.some((e, i) => e.offsetHeight > lines[i] * 1.2 + 2)
          || all.some((e, i) => spill(e) > spills[i] + 1)) return Infinity;
        return inner.scrollHeight * g;
      };
      let lo = 1, hi = size === 'story' ? 1.6 : 1.35;
      if (tall(hi) <= room.h) lo = hi;
      else for (let i = 0; i < 8; i++) { const g = (lo + hi) / 2; if (tall(g) <= room.h) lo = g; else hi = g; }
      if (lo >= 1.03) {
        inner.style.width = `${room.w / lo}px`;
        inner.style.alignSelf = 'center';
        inner.style.scale = String(Math.floor(lo * 1000) / 1000);
      } else { inner.style.width = ''; lo = 1; }
      // Height still to spare (a Story, mostly): the rows and groups spread apart into it, up to 36px more between rows.
      let a = 0, b = 36;
      const fits = x => { inner.style.setProperty('--spread', `${x}px`); return inner.scrollHeight * lo <= room.h; };
      if (fits(b)) a = b;
      else for (let i = 0; i < 6; i++) { const x = (a + b) / 2; if (fits(x)) a = x; else b = x; }
      inner.style.setProperty('--spread', `${Math.floor(a)}px`);
    }

    // A team or player name stays on one line in its row, shrinking (to 60%) rather than breaking onto a second line, so
    // the rows keep one height; a name too long for that wraps between words at 85%.
    function fitNames() {
      for (const e of $('fit').querySelectorAll(':is(.game__team, .call__teams span, .shooter__name, .vs h2, .crew__game span, .champ__name):not(.final__tbc)')) {
        const base = parseFloat(getComputedStyle(e).fontSize);
        e.style.whiteSpace = 'nowrap';
        if (!e.clientWidth || e.scrollWidth <= e.clientWidth) continue;
        const px = Math.floor(base * e.clientWidth / e.scrollWidth);
        if (px >= base * .6) { e.style.fontSize = `${px}px`; continue; }
        e.style.whiteSpace = 'normal'; e.style.overflowWrap = 'normal'; e.style.fontSize = `${Math.round(base * .85)}px`;
      }
    }

    // The commentators' names share one size, so a long name next to a short one keeps the row balanced: the biggest
    // that fits each one's longest word in its column, shrinking up to 25% to keep a hyphenated name whole, and
    // otherwise breaking it after the hyphen (down to 60%).
    function fitCrew() {
      const names = [...$('fit').querySelectorAll('.crew .mic__name')];
      if (!names.length) return;
      const base = parseFloat(getComputedStyle(names[0]).fontSize);
      const fitOf = n => {
        const words = [[]];
        for (const c of n.childNodes) if (c.nodeType === 3) words.push([]); else if (c.tagName === 'SPAN') words.at(-1).push(c.offsetWidth);
        const k = ws => Math.min(1, ...ws.filter(Boolean).map(w => n.clientWidth / w));
        const whole = k(words.map(w => w.reduce((a, b) => a + b, 0)));
        return whole >= .75 ? whole : k(words.flat());
      };
      const k = Math.min(...names.map(fitOf));
      if (k < 1) for (const n of names) n.style.fontSize = `${Math.floor(base * Math.max(k, .6))}px`;
    }

    function head(d, title, when, tab) {
      $('tab').textContent = tab || d.competition;
      $('tab').hidden = !$('tab').textContent;
      // A word a span, so a template can set one apart (Final puts the last word in its script face).
      const words = String(params.get('title') || title).split(/\s+/).filter(Boolean);
      $('title').replaceChildren(...words.flatMap((w, i) => [...(i ? [' '] : []), el('span', 'w', w)]));
      $('title').dataset.text = $('title').textContent; // for a template that echoes the title (Final's faint echo)
      $('when').replaceChildren(...when);
      if (d.competitionLogo) { $('compLogo').src = d.competitionLogo; $('compLogo').hidden = false; }
    }

    // The title stays on one line, shrinking up to 30% to fit beside the logo at any size; only a title that would get
    // smaller than that wraps (at the template's size, each word still fitting). Poster stacks its words on purpose.
    function fitTitle() {
      const t = $('title'), head = $('head'), logo = $('compLogo');
      if (document.body.classList.contains('t-poster') && size !== 'square') return;
      const gap = parseFloat(getComputedStyle(head).columnGap) || 0;
      // --title-clear: the room a template keeps free at the right for its decoration (Poster's bar).
      const clear = parseFloat(getComputedStyle(head).getPropertyValue('--title-clear')) || 0;
      const room = head.clientWidth - (logo.hidden ? 0 : logo.getBoundingClientRect().width + gap) - 8 - clear;
      fitWhen(room);
      const base = parseFloat(getComputedStyle(t).fontSize);
      t.style.whiteSpace = 'nowrap';
      const wide = t.scrollWidth;
      if (wide <= room) return;
      if (wide * .7 <= room) {
        let px = Math.floor(base * room / wide);
        t.style.fontSize = `${px}px`;
        while (t.scrollWidth > room && px > base * .7) t.style.fontSize = `${--px}px`;
        return;
      }
      t.style.whiteSpace = '';
      for (let px = base; t.scrollWidth > room && px > base * .5; px -= 2) t.style.fontSize = `${px}px`;
    }
    // The date line under the title stays on one line too, shrinking a little (to 75%); a longer one puts its small part
    // (court, venue) on a second line.
    function fitWhen(room) {
      const w = $('when');
      w.style.whiteSpace = 'nowrap';
      if (w.scrollWidth <= room) return;
      const base = parseFloat(getComputedStyle(w).fontSize);
      if (w.scrollWidth * .75 > room) {
        // Too long to shrink: the small part (court, venue) goes on a line of its own rather than breaking mid-phrase.
        const small = w.querySelector('small');
        if (small) { small.style.display = 'block'; small.style.marginLeft = '0'; small.style.marginTop = '4px'; }
        for (let px = base; w.scrollWidth > room && px > base * .75; px--) w.style.fontSize = `${px}px`;
        if (w.scrollWidth > room) w.style.whiteSpace = '';
        return;
      }
      w.style.fontSize = `${base * room / w.scrollWidth}px`;
    }

    function drawFixtures(d) {
      head(d, 'Game night', [dayLong(d.date), el('small', '', d.venue)]);
      if (!d.games.length) return `No games on ${dayLong(d.date)}.`;
      const times = [...new Set(d.games.map(g => g.time))];
      for (const t of times) {
        const slot = $('fit').appendChild(el('div', 'slot'));
        slot.append(el('div', 'slot__time', clock(t)));
        for (const g of d.games.filter(x => x.time === t)) {
          const row = slot.appendChild(el('div', 'game'));
          row.append(logoEl(g.home), el('div', 'game__team', g.home.name), el('div', 'game__v', 'v'), el('div', 'game__team away', g.away.name), logoEl(g.away),
            el('div', 'game__info', [g.division, g.court].filter(Boolean).join('  ·  ')));
        }
      }
    }

    // An athlete picked for a side: their photo over the team's logo (as a badge), else the logo alone.
    function picture(t, who) {
      if (!who) return [logoEl(t)];
      const box = el('div', 'athlete');
      const img = box.appendChild(el('img', 'athlete__photo')); img.src = who.photo; img.alt = who.name;
      box.append(logoEl(t));
      return [box];
    }
    const athleteName = who => (who ? [el('div', 'athlete__name', who.name)] : []);
    // A shooter's face with their team's logo as a badge.
    function face(p) {
      const box = el('div', 'face');
      const img = box.appendChild(el('img', 'face__photo')); img.src = p.photo; img.alt = p.name;
      box.append(logoEl({ name: p.team, logo: p.logo }));
      return box;
    }

    // Commentary team: one picture a game (?game=, else the night's first called game), with who calls it side by side,
    // each with their headshot (or initials) and a Special guest tag, and the game's time and teams once underneath.
    function drawCommentators(d) {
      head(d, 'Commentary team', [dayLong(d.date), el('small', '', d.stream ? [d.stream.court, d.venue].filter(Boolean).join('  ·  ') : '')]);
      if (!d.stream) return `No plan for ${dayLong(d.date)} yet: plan the court and commentators on the Production Planner tab.`;
      const called = d.stream.slots.filter(s => s.people.length);
      const s = called.find(x => x.id === params.get('game')) || called[0];
      if (!s) return `Nobody is on the mic for ${dayLong(d.date)} yet: add the commentators on the Production Planner tab.`;
      const box = $('fit').appendChild(el('div', `crew crew--${s.people.length}`));
      for (const c of s.people) {
        const card = box.appendChild(el('div', 'mic'));
        const faceBox = card.appendChild(el('div', 'mic__face'));
        if (c.headshot) { const img = faceBox.appendChild(el('img')); img.src = c.headshot; img.alt = c.name; }
        else faceBox.append(c.name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase());
        // A blank tag under the others when someone is a guest, so the names all start on one line.
        if (s.people.some(x => x.guest)) card.append(el('div', `mic__guest${c.guest ? '' : ' mic__guest--blank'}`, 'Special guest'));
        // A word a span that never breaks, with a break allowed after a hyphen: Hartley- / Nguyen, never Papadopoul / os.
        const name = card.appendChild(el('div', 'mic__name'));
        c.name.split(/\s+/).forEach((w, i) => w.split(/(?<=-)/).forEach((bit, j) => name.append(...(i && !j ? [' '] : j ? [document.createElement('wbr')] : []), el('span', '', bit))));
      }
      const game = $('fit').appendChild(el('div', 'crew__game'));
      game.append(el('b', '', clock(s.time)), el('span', '', `${s.home.name} v ${s.away.name}`), ...(s.division ? [el('small', '', s.division)] : []));
    }

    function drawMatchup(d) {
      const g = d.games.find(x => x.id === params.get('game')) || d.games[0];
      if (!g) { head(d, 'Match up', [dayLong(d.date)]); return `No games on ${dayLong(d.date)}.`; }
      head(d, 'Match day', [[g.division, g.final || g.round].filter(Boolean).join('  ·  ')]);
      const vs = $('fit').appendChild(el('div', 'vs'));
      const side = (t, which) => { const s = el('div'); s.append(...picture(t, d.picked[which]), el('h2', '', t.name), ...athleteName(d.picked[which])); return s; };
      vs.append(side(g.home, 'home'), el('div', 'vs__v', 'v'), side(g.away, 'away'));
      const info = $('fit').appendChild(el('div', 'info'));
      const bit = (label, value) => { const s = el('span'); s.append(el('b', '', label), ` ${value}`); return s; };
      info.append(el('span', '', dayShort(d.date)), bit('', clock(g.time)), ...(g.court ? [el('span', '', g.court)] : []), ...(g.venue || d.venue ? [el('span', '', g.venue || d.venue)] : []));
    }

    const bound = (cls, ...kids) => { const row = el('div', `bound ${cls}`); row.append(...kids); return row; };
    const who = (name, line) => { const x = el('div'); x.append(el('div', 'shooter__name', name), el('div', 'shooter__team', line)); return x; };
    const pill = (text, mark) => el('div', `bound__earned${mark ? ` bound__earned--${mark}` : ''}`, text);
    const stat = (v, label, main) => { const x = el('div', `stat${main ? ' main' : ''}`); x.append(el('b', '', String(v)), el('small', '', label)); return x; };

    // Form guide (?game=): each team's last five results this season (oldest first, a win in the main colour) and how
    // their meetings this season went.
    function drawForm(d) {
      const g = d.games.find(x => x.id === params.get('game')) || d.games[0];
      if (!g) { head(d, 'Form guide', [dayLong(d.date)]); return `No games on ${dayLong(d.date)}.`; }
      head(d, 'Form guide', [[g.division, g.final || g.round].filter(Boolean).join('  ·  '), el('small', '', [dayShort(d.date), clock(g.time), g.court].filter(Boolean).join('  ·  '))]);
      const f = (d.form || []).find(x => x.id === g.id) || { home: [], away: [], meetings: [], wins: {} };
      for (const side of ['home', 'away']) {
        const chips = el('div', 'form__chips');
        for (const r of f[side]) chips.append(stat(r.result, `${r.for}–${r.against}`, r.result === 'W'));
        if (!f[side].length) chips.append(el('div', 'form__none', 'First game of the season'));
        const team = el('div'); team.append(el('div', 'game__team', g[side].name), chips);
        $('fit').append(bound('bound--form', logoEl(g[side]), team));
      }
      const info = $('fit').appendChild(el('div', 'info'));
      const m = f.meetings || [];
      if (!m.length) info.append(el('span', '', 'First meeting this season'));
      else {
        const s = el('span');
        s.append('This season: ', el('b', '', `${g.home.name} ${f.wins.home}`), ', ', el('b', '', `${g.away.name} ${f.wins.away}`), ...(f.wins.draws ? [`, ${f.wins.draws} drawn`] : []));
        info.append(s);
      }
    }

    // Round preview (?division=): the division's games that night with each team's ladder place and points, the game of
    // the round outlined, and who a win could lift into the finals places.
    function drawPreview(d) {
      const p = d.preview || {};
      const mine = d.games.filter(g => g.division === p.division);
      const rounds = [...new Set(mine.map(g => g.final || g.round).filter(Boolean))];
      head(d, 'Round preview', [p.division || '', el('small', '', [rounds.join(', '), dayShort(d.date)].filter(Boolean).join('  ·  '))]);
      if (p.error) return p.error;
      if (!mine.length) return `${p.division} doesn't play on ${dayLong(d.date)}.`;
      for (const g of mine) {
        const x = (p.games || []).find(y => y.id === g.id) || {};
        const place = t => t ? `${nth(t.place)} (${t.points} pts)` : '';
        if (p.pick === g.id) $('fit').append(el('div', 'result__final', p.topOfTable ? 'Top of the table' : 'Game of the round'));
        const row = $('fit').appendChild(el('div', `game${p.pick === g.id ? ' preview--pick' : ''}`));
        const info = x.home && x.away ? `${place(x.home)}  v  ${place(x.away)}  ·  ${clock(g.time)}` : [clock(g.time), g.court].filter(Boolean).join('  ·  ');
        row.append(logoEl(g.home), el('div', 'game__team', g.home.name), el('div', 'game__v', 'v'), el('div', 'game__team away', g.away.name), logoEl(g.away),
          el('div', 'game__info', info));
        for (const t of x.climbs || []) $('fit').append(el('div', 'later', `A win can lift ${t} into the top ${p.finalsPlaces}`));
      }
    }

    // Byes: the teams of each division playing that night that aren't.
    function drawByes(d) {
      head(d, 'Byes', [dayLong(d.date), el('small', '', d.venue)]);
      if (!(d.byes || []).length) return `Every team plays on ${dayLong(d.date)}.`;
      for (const b of d.byes) {
        const group = $('fit').appendChild(el('div', 'group'));
        group.append(el('div', 'group__name', b.division));
        for (const t of b.teams) group.append(bound('bound--bye', logoEl(t), el('div', 'game__team', t.name)));
      }
    }

    // Milestones: athletes playing a first game or a 50th, 100th... (?when=played: those who played it that night, from the
    // finished games' line ups; ?when=next: those whose next game would be it, for before the night).
    function drawMilestones(d) {
      const when = params.get('when') === 'next' ? 'next' : 'played';
      head(d, 'Milestones', [dayLong(d.date), el('small', '', d.venue)]);
      const list = (d.milestones || []).filter(m => m.played === (when === 'played'));
      if (!list.length) return when === 'played' ? `No milestones in ${dayLong(d.date)}'s line ups.` : `No milestones due on ${dayLong(d.date)}.`;
      for (const m of list) {
        const line = m.games === 1 ? `${m.team}  ·  first game` : `${m.team}  ·  ${when === 'played' ? 'played' : 'set to play'} their ${nth(m.games)}`;
        $('fit').append(bound('bound--ms', m.photo ? face(m) : logoEl({ name: m.team, logo: m.logo }), who(m.name, line), stat(m.games === 1 ? '1st' : nth(m.games), 'Game', true)));
      }
    }

    // Finals race (?division=): the ladder as it stands, each team in, out or still a chance, with its games left.
    function drawRace(d) {
      const r = d.race || {};
      const on = (d.raceOn || []).find(x => x.division === r.division);
      head(d, 'Finals race', [r.division || '', el('small', '', on ? (on.left === 1 ? 'Last round' : `${on.left} rounds to go`) : '')]);
      if (r.error) return r.error;
      if (!(r.rows || []).length) return `No ladder for ${r.division} yet.`;
      const words = { in: ['In the finals', 'final'], chance: ['Still a chance', ''], out: ['Out', 'out'] };
      for (const t of r.rows) {
        const [text, mark] = words[t.status];
        $('fit').append(bound('', el('div', 'shooter__rank', String(t.position)), logoEl({ name: t.team, logo: t.logo }),
          who(t.team, `${t.points} pts  ·  ${t.left} to play`), pill(text, mark)));
      }
      const k = $('fit').appendChild(el('div', 'key')); k.append(`Top ${r.finalsPlaces} play finals`);
    }

    // Countdown: the rounds left before the finals, or on a finals night the days to the grand final.
    function drawCountdown(d) {
      const c = d.countdown || {};
      head(d, 'Countdown', [dayLong(d.date), el('small', '', d.venue)]);
      let big, words;
      if (c.rounds === 1) [big, words] = ['Last', 'round before finals'];
      else if (c.rounds) [big, words] = [String(c.rounds), 'rounds to go until finals'];
      else if (c.grandFinal === 0) [big, words] = ['GF', 'Grand final night'];
      else if (c.grandFinal % 7 === 0) [big, words] = [String(c.grandFinal / 7), c.grandFinal === 7 ? 'week to the grand final' : 'weeks to the grand final'];
      else if (c.grandFinal) [big, words] = [String(c.grandFinal), 'days to the grand final'];
      else return 'The finals are more than four rounds away.';
      const box = $('fit').appendChild(el('div', 'count'));
      box.append(el('div', 'count__big', big), el('div', 'count__words', words));
    }

    // Season draw (?division= &team=): every game of the team's season, with the result once played.
    function drawDraw(d) {
      const x = d.draw || {};
      head(d, 'Season draw', [x.team || '', el('small', '', x.division || '')]);
      if (!x.team) return 'Pick a team: there is a Season draw picture for each one on the Socials tab.';
      if (!(x.games || []).length) return `${x.team} has no games in ${x.division}.`;
      for (const g of x.games) {
        const r = g.result;
        $('fit').append(bound('bound--draw', who(dayShort(g.date), [clock(g.time), g.court].filter(Boolean).join('  ·  ')), logoEl({ name: g.opponent, logo: g.opponentLogo }), el('div', 'game__team', `v ${g.opponent}`),
          r ? pill(`${r.result} ${r.for}–${r.against}`, r.result === 'W' ? 'final' : '') : pill(g.round || '')));
      }
    }

    // A shooter's row: rank (none when null), face (or team logo), name and team, then the stats given.
    function shooterRow(i, p, ...stats) {
      const row = el('div', `shooter${i === null ? ' shooter--norank' : ''}`);
      const s = el('div', 'shooter__stats'); s.append(...stats);
      row.append(...(i === null ? [] : [el('div', 'shooter__rank', String(i + 1))]), p.photo ? face(p) : logoEl({ name: p.team, logo: p.logo }), who(p.name, p.team), s);
      return row;
    }
    // Sharpshooter (?division=): the night's best accuracy, from its finished games' line ups.
    function drawAccuracy(d) {
      const a = d.accuracy || { players: [] };
      head(d, 'Sharpshooter', [a.division || '', el('small', '', dayLong(d.date))]);
      if (!a.gamesFinished) return `No results in ${a.division} for ${dayLong(d.date)} yet.`;
      if (!a.players.length) return `Nobody in ${a.division} had ${a.minShots} or more shots at goal that night.`;
      for (const [i, p] of a.players.entries()) $('fit').append(shooterRow(i, p, stat(`${p.goals + p.superGoals}/${p.shots}`, 'Shots'), stat(`${p.accuracy}%`, 'Accuracy', true)));
    }
    // Super shot leaders (?division=): the most super shots that night and over the season so far.
    function drawSuperShots(d) {
      const x = d.superShots || {};
      head(d, 'Super shot leaders', [x.division || '', el('small', '', dayLong(d.date))]);
      if (x.error) return x.error;
      if (!(x.night || []).length && !(x.season || []).length) return `No super shots in ${x.division} yet.`;
      for (const [label, list] of [['Tonight', x.night || []], ['Season', x.season || []]]) {
        if (!list.length) continue;
        const group = $('fit').appendChild(el('div', 'group'));
        group.append(el('div', 'group__name', label));
        for (const [i, p] of list.entries()) group.append(shooterRow(i, p, stat(p.points, 'Points'), stat(p.superGoals, 'Super', true)));
      }
    }
    // Team super shots (?division=): every team's super shots that night and over the season so far, from PlayHQ's team
    // counts, most first; a team that didn't play that night shows a dash.
    function drawTeamSupers(d) {
      const x = d.teamSupers || {};
      head(d, 'Team super shots', [x.division || '', el('small', '', dayLong(d.date))]);
      if (x.error) return x.error;
      if (!x.gamesFinished) return `No results in ${x.division} for ${dayLong(d.date)} yet.`;
      for (const [i, t] of (x.teams || []).entries()) {
        $('fit').append(shooterRow(i, { name: t.team, team: `${t.games} ${t.games === 1 ? 'game' : 'games'}`, logo: t.logo },
          stat(t.tonight === null ? '–' : t.tonight, 'Tonight'), stat(t.season, 'Season', true)));
      }
      if (x.notCounted) $('fit').append(el('p', 'message', `${x.notCounted} ${x.notCounted === 1 ? 'game' : 'games'} not counted: PlayHQ couldn't give ${x.notCounted === 1 ? 'its' : 'their'} stats.`));
    }
    // On fire (?division=): the shooters who played that night whose goals a game have risen most over their last games.
    function drawOnFire(d) {
      const x = d.onFire || { players: [] };
      head(d, 'On fire', [x.division || '', el('small', '', dayLong(d.date))]);
      if (!x.players.length) return `Nobody in ${x.division} has more goals a game lately than before.`;
      for (const [i, p] of x.players.entries()) {
        const row = shooterRow(i, p, ...p.last.map(n => stat(n, 'Goals')), stat(`+${p.rise}`, 'A game', true));
        row.querySelector('.shooter__team').textContent = `${p.team}  ·  was ${p.earlier} a game`;
        $('fit').append(row);
      }
    }
    // Night in numbers: the night's finished games added up.
    function drawNumbers(d) {
      const n = d.numbers || {};
      head(d, 'Night in numbers', [dayLong(d.date), el('small', '', d.venue)]);
      if (!n.games) return noResults(d);
      const tile = (v, label, note) => { const x = stat(v, label); if (note) x.append(el('small', 'stat__note', note)); return x; };
      const tiles = $('fit').appendChild(el('div', 'tiles'));
      tiles.append(tile(n.games, n.games === 1 ? 'Game' : 'Games'), tile(n.points, n.superShots === null ? 'Goals' : 'Points'));
      // Super shots from PlayHQ's team counts; a game whose line ups couldn't be read is said, not counted as none.
      if (n.superShots !== null && n.superShots !== undefined) tiles.append(tile(n.superShots, 'Super shots', n.notCounted ? `${n.notCounted} ${n.notCounted === 1 ? 'game' : 'games'} not counted` : ''));
      // Margins are in points where super shots count (a super shot is 2).
      tiles.append(tile(n.close, `Within ${n.closeMargin} ${n.superShots === null ? 'goals' : 'points'}`), tile(n.biggest, 'Biggest win'));
      if (n.highest) tiles.append(tile(n.highest.score, 'Highest score', n.highest.team));
      if (n.accuracy !== null && n.accuracy !== undefined) tiles.append(tile(`${n.accuracy}%`, 'Shooting'));
      // Upsets (Round in review's rule); a night without one shows the average winning margin instead.
      if (n.upsets) tiles.append(tile(n.upsets, n.upsets === 1 ? 'Upset' : 'Upsets'));
      else if (n.averageWin !== null && n.averageWin !== undefined) tiles.append(tile(n.averageWin, 'Average win'));
      if (n.draws) tiles.append(tile(n.draws, n.draws === 1 ? 'Draw' : 'Draws'));
    }
    // Club round up (?club=): every result that night of one club's teams, division by division.
    function drawClub(d) {
      const c = (d.clubs || []).find(x => x.club === params.get('club')) || (d.clubs || [])[0];
      head(d, c ? c.club : 'Club round up', [dayLong(d.date), el('small', '', d.venue)], 'Club round up');
      if (!c) return 'No club had more than one team playing that night.';
      const mine = d.games.filter(g => c.games.includes(g.id));
      for (const div of [...new Set(mine.map(g => g.division))]) {
        const group = $('fit').appendChild(el('div', 'group'));
        if (div) group.append(el('div', 'group__name', div));
        for (const g of mine.filter(x => x.division === div)) group.append(resultRow(g));
      }
    }
    // Still unbeaten: the teams unbeaten all season, or on a run of wins, once that night's results are in.
    function drawStreaks(d) {
      head(d, 'On a roll', [dayLong(d.date), el('small', '', d.venue)]);
      const list = d.streaks || [];
      if (!list.length) return 'No team is unbeaten or on a run of three wins or more.';
      for (const t of list) {
        const text = t.unbeaten && t.won === t.played ? `${t.won} from ${t.played}` : t.unbeaten ? `Unbeaten in ${t.played}` : `${t.run} wins in a row`;
        $('fit').append(bound('bound--team', logoEl(t), who(t.team, `${t.division}  ·  ${t.unbeaten ? 'Still unbeaten' : 'On a run'}`), pill(text, 'final')));
      }
    }
    // Team season card (?division= &team=): the season so far: its record, place, run, biggest win and top shooter.
    function drawSeason(d) {
      const c = d.season || {};
      head(d, c.team || 'Season so far', [c.division || '', el('small', '', `after ${dayShort(d.date)}`)], 'Season so far');
      if (c.error) return c.error;
      if (!c.played) return `${c.team} hasn't played yet this season.`;
      const tiles = $('fit').appendChild(el('div', 'tiles'));
      tiles.append(stat(c.played, 'Played'), stat(c.won, 'Won', true), stat(c.lost, 'Lost'));
      if (c.drawn) tiles.append(stat(c.drawn, 'Drawn'));
      if (c.place) tiles.append(stat(nth(c.place), 'On the ladder'));
      if (c.percentage !== null) tiles.append(stat(c.percentage, 'Percentage'));
      const lines = $('fit').appendChild(el('div', 'card__lines'));
      const line = (label, value) => lines.append(bound('bound--line', el('div', 'game__team', label), pill(value, 'final')));
      if (c.run && c.run.games > 1) line('Current run', `${c.run.games} ${{ W: 'wins', L: 'losses', D: 'draws' }[c.run.result]} in a row`);
      if (c.biggestWin) line('Biggest win', `by ${c.biggestWin.for - c.biggestWin.against} v ${c.biggestWin.opponent}`);
      if (c.topShooter) line('Top shooter', `${c.topShooter.name}  ·  ${c.topShooter.points}`);
    }
    // Season wrap (?division=): the division's season in five lines: champions, top shooter, sharpest shooter, most super
    // shots and the biggest win.
    function drawWrap(d) {
      const w = d.wrap || {};
      head(d, 'Season wrap', [w.division || '', el('small', '', dayLong(d.date))]);
      if (w.error) return w.error;
      const lines = $('fit');
      const add = (label, ...kids) => { const group = lines.appendChild(el('div', 'group')); group.append(el('div', 'group__name', label), ...kids); };
      if (w.champion) add(d.winners || 'Champions', bound('bound--bye', logoEl(w.champion), el('div', 'game__team', w.champion.name)));
      if (w.topShooter) add('Top shooter', shooterRow(null, w.topShooter, stat(w.topShooter.points, 'Points', true)));
      if (w.accuracy) add('Sharpest shooter', shooterRow(null, w.accuracy, stat(`${w.accuracy.accuracy}%`, 'Accuracy', true)));
      if (w.superShots) add('Most super shots', shooterRow(null, w.superShots, stat(w.superShots.superGoals, 'Super', true)));
      if (w.biggestWin) add('Biggest win', resultRow({ ...w.biggestWin, winner: w.biggestWin.home.score > w.biggestWin.away.score ? 'home' : 'away' }));
      if (!lines.children.length) return `${w.division} has no results yet.`;
    }

    // A big picture in the middle: an athlete's approved photo with their team's logo as a badge, else the logo alone;
    // the name under it in the title's colour, then a line of what they are.
    function bigCard(who, what) {
      const box = $('fit').appendChild(el('div', 'champ'));
      const pic = box.appendChild(el('div', 'champ__logo'));
      if (who.photo) {
        const img = pic.appendChild(el('img', 'champ__photo')); img.src = who.photo; img.alt = who.name;
        if (who.logo || who.team) pic.append(logoEl({ name: who.team, logo: who.logo }, 'champ__badge'));

    // Game story (?game=): a game Studio streamed, as its scoreboard kept it: the score quarter by quarter, then quarters

    function storyHead(d, title) {
      const x = d.story || {}, g = x.game;
      head(d, title, [g ? [g.division, g.final || g.round].filter(Boolean).join('  ·  ') : dayLong(d.date), el('small', '', g ? `${g.home.name} ${g.home.score}–${g.away.score} ${g.away.name}` : '')]);
      return x;
    }
    function drawStory(d) {
      const x = storyHead(d, 'Game story');
      if (x.error) return x.error;
      const { game: g, stats } = x;
      const quarters = (stats.quarters || []).filter(q => q.played);
      const t = $('fit').appendChild(el('table', 'ladder story'));
      const hr = t.appendChild(el('tr'));
      for (const h of ['', 'Team', ...quarters.map(q => q.label), 'Total']) hr.append(el('th', '', h));
      for (const side of ['home', 'away']) {
        const tr = t.appendChild(el('tr'));
        const logo = el('td'); logo.append(logoEl(g[side]));
        tr.append(logo, el('td', 'team', g[side].name), ...quarters.map(q => el('td', '', q.sure ? String(q[side]) : '–')), el('td', '', String(g[side].score)));
      }
      const lines = $('fit').appendChild(el('div', 'card__lines'));
      const line = (label, value) => lines.append(bound('bound--line', el('div', 'game__team', label), pill(value, 'final')));
      const s = stats.stats || {}, name = k => g[k].name;
      const both = (f, fmt) => ['home', 'away'].map(k => [k, f[k]]).filter(([, v]) => v).map(([k, v]) => fmt(k, v));
      if (s.quartersWon && s.quartersWon.of) line('Quarters won', `${name('home')} ${s.quartersWon.home}  ·  ${name('away')} ${s.quartersWon.away}`);
      const best = both(s.bestQuarter || {}, (k, v) => ({ k, v })).sort((a, b) => b.v.points - a.v.points)[0];
      if (best) line('Best quarter', `${name(best.k)}  ·  ${best.v.points} in ${best.v.label}`);
      const run = ['home', 'away'].map(k => ({ k, n: (s.longestRun || {})[k] || 0 })).sort((a, b) => b.n - a.n)[0];
      if (run && run.n > 1) line('Longest run', `${name(run.k)}  ·  ${run.n} goals`);
      const w = x.worm || {}, lead = ['home', 'away'].map(k => ({ k, v: (w.biggestLead || {})[k] })).filter(l => l.v).sort((a, b) => b.v.margin - a.v.margin)[0];
      if (lead) line('Biggest lead', `${name(lead.k)} by ${lead.v.margin}`);
      if (w.leadChanges !== undefined) line('Lead changes', String(w.leadChanges));
      if (stats.superShots && s.superShots && (s.superShots.home || s.superShots.away)) line('Super shots', `${name('home')} ${s.superShots.home}  ·  ${name('away')} ${s.superShots.away}`);
      if (!x.complete) $('fit').append(el('div', 'later', 'Studio didn\'t see every goal of this game'));
    }
    // Moments of the game (?game=): every moment Studio's scoreboard saw in a game it streamed (lead changes, comebacks,
    // runs, super shots), oldest first, each with its quarter, the time left in it (when the clock ran) and the score then.
    // The 8 that matter most when there are more.
    const MOMENT_WORDS = { heating: 'Heating up', fire: 'On fire', goalForGoal: 'Goal for goal', lead: 'Hits the front', level: 'All square',
      comeback: 'Coming back', siren: 'On the siren', backToBack: 'Back to back super shots' };
    const MOMENT_RANK = ['siren', 'backToBack', 'comeback', 'lead', 'fire', 'goalForGoal', 'level', 'heating'];
    const MOMENTS_SHOWN = 8;
    function drawMoments(d) {
      const x = storyHead(d, 'Moments of the game');
      if (x.error) return x.error;
      const { game: g } = x;
      let list = (x.moments || []).map((m, i) => ({ ...m, i }));
      if (!list.length) return `No moments in ${g.home.name} v ${g.away.name}: no runs, comebacks or lead changes.`;
      const rank = m => Math.min(...[m.kind, ...(m.also || []).map(a => a.kind)].map(k => { const r = MOMENT_RANK.indexOf(k); return r === -1 ? 99 : r; }));
      if (list.length > MOMENTS_SHOWN) list = [...list].sort((a, b) => rank(a) - rank(b) || a.i - b.i).slice(0, MOMENTS_SHOWN).sort((a, b) => a.i - b.i);
      const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      const timed = new Set(list.map(m => m.clockLeft)).size > 1; // a clock never run says the same time for them all
      for (const m of list) {
        const when = el('div', 'moment__when', `${m.periodLabel || 'Q'}${m.period || ''}`);
        if (timed && Number.isFinite(m.clockLeft)) when.append(el('small', '', `${mmss(m.clockLeft)} left`));
        const team = m.side ? g[m.side] : null;
        const words = [MOMENT_WORDS[m.kind] || m.kind, m.goals ? `${m.goals} in a row` : m.down ? `from ${m.down} down` : ''].filter(Boolean).join('  ·  ');
        const also = (m.also || []).map(a => (MOMENT_WORDS[a.kind] || a.kind).toLowerCase()).filter(w => !words.toLowerCase().includes(w));
        $('fit').append(bound('bound--moment', when, team ? logoEl(team) : el('div'), who(team ? team.name : 'Both teams', [words, ...also].join('  ·  ')),
          pill(m.score ? `${m.score.home}–${m.score.away}` : '', 'final')));
      }
      if (!x.complete) $('fit').append(el('div', 'later', 'Studio didn\'t see every goal of this game'));
    }

    // Game stats (?game=): a finished game's numbers from PlayHQ's line ups, team against team (points and super shots

    function gameHead(d, title) {

      head(d, title, [g ? [g.division, g.final || g.round].filter(Boolean).join('  ·  ') : dayLong(d.date), el('small', '', g ? [dayShort(d.date), g.court].filter(Boolean).join('  ·  ') : '')]);

      };

      if (x.read) {

        else row('Goals', g.home.goals + g.home.superGoals, g.away.goals + g.away.superGoals);

        if (s.longestRun) row('Longest run', s.longestRun.home || 0, s.longestRun.away || 0);
        if (s.biggestLead) row('Biggest lead', (s.biggestLead.home || {}).margin || 0, (s.biggestLead.away || {}).margin || 0);
        if (s.leadChanges !== null && s.leadChanges !== undefined) $('fit').append(bound('bound--line', el('div', 'game__team', 'Lead changes'), pill(String(s.leadChanges), 'final')));
      }
      if (!x.read && !s) return x.error;
    }
    // Shooting duel (?game=): each team's shooters that game, most points first, with goals from attempts and accuracy,
    // under the team's own total.
    function drawShooting(d) {
      const x = gameHead(d, 'Shooting duel');

        const t = g[k];

        const total = t.shots ? `${t.goals + t.superGoals}/${t.shots}${t.accuracy !== null ? `  ·  ${Math.round(t.accuracy)}%` : ''}` : String(t.goals + t.superGoals);
        group.append(el('div', 'group__name', `${t.name}  ·  ${total}`));
        for (const p of t.shooters.slice(0, 4)) {
          const scored = p.goals + p.superGoals;
          const stats = [stat(p.shots ? `${scored}/${p.shots}` : scored, p.superGoals ? `Goals (${p.superGoals} super)` : 'Goals', true)];
          if (p.accuracy !== null) stats.push(stat(`${Math.round(p.accuracy)}%`, 'Accuracy'));
          group.append(shooterRow(null, { ...p, team: [t.name, p.position].filter(Boolean).join('  ·  '), logo: t.logo }, ...stats));

    // Head to head (?game=): how the two teams' meetings this season went before this night, each with its score, and
    // the wins each way.
    function drawH2H(d) {
      const g = d.games.find(x => x.id === params.get('game')) || d.games[0];
      if (!g) { head(d, 'Head to head', [dayLong(d.date)]); return `No games on ${dayLong(d.date)}.`; }
      head(d, 'Head to head', [[g.division, g.final || g.round].filter(Boolean).join('  ·  '), el('small', '', [dayShort(d.date), clock(g.time), g.court].filter(Boolean).join('  ·  '))]);

    // Team sheet (?game=): both teams' squads this season side by side, each player's position (the one they play most)

    function drawTeamSheet(d) {
      const x = d.teamSheet || {}, g = x.game;
      head(d, 'Team sheet', [g ? [g.division, g.final || g.round].filter(Boolean).join('  ·  ') : dayLong(d.date), el('small', '', g ? [dayShort(d.date), clock(g.time), g.court].filter(Boolean).join('  ·  ') : '')]);
      if (x.error) return x.error;
