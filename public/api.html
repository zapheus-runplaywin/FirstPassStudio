<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard API · FirstPass Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/swagger-ui/swagger-ui.css">
<link rel="stylesheet" href="studio.css">
<style>
  body { margin: 0; background: var(--fp-white); }
  /* Swagger sets its own fonts at several specificities, so the brand font has to win outright. */
  .swagger-ui :not(code, pre, pre *, code *, textarea, .opblock-summary-path, .opblock-summary-path *) { font-family: var(--fp-font) !important; }
  .swagger-ui .markdown code, .swagger-ui .renderedMarkdown code { color: var(--fp-blue-dark); background: var(--fp-blue-soft); }
  .swagger-ui .info { margin: 32px 0 24px; }
  .swagger-ui .info .title { color: var(--fp-navy); font-weight: 900; font-style: italic; letter-spacing: -0.5px; }
  .swagger-ui .info .title small { background: var(--fp-blue); }
  .swagger-ui .info .title small.version-stamp { background: var(--fp-orange); }
  .swagger-ui .info a, .swagger-ui .info .link { color: var(--fp-blue); }
  .swagger-ui .opblock-tag { color: var(--fp-navy); font-weight: 800; border-bottom-color: var(--fp-line); }
  .swagger-ui .btn.execute { background: var(--fp-blue); border-color: var(--fp-blue); }
  .swagger-ui .btn.try-out__btn, .swagger-ui .btn.cancel { border-radius: 8px; }
  .swagger-ui .opblock.opblock-get { border-color: var(--fp-blue); background: rgba(34, 116, 165, 0.06); }
  .swagger-ui .opblock.opblock-get .opblock-summary-method { background: var(--fp-blue); font-weight: 800; }
  .swagger-ui .opblock.opblock-get .opblock-summary { border-color: var(--fp-blue); }
  .swagger-ui .opblock.opblock-get .tab-header .tab-item.active h4 span:after { background: var(--fp-blue); }
  .swagger-ui .opblock { border-radius: 8px; }
  .swagger-ui .opblock-summary-path { color: var(--fp-navy); }
  #fallback { max-width: 760px; margin: 24px auto; padding: 0 16px; }
</style>
<script src="log.js"></script>
</head>
<body>
  <header class="fp-bar"><div class="fp-bar__in">
    <a class="fp-mark" href="/">FirstPass<b>STUDIO</b></a>
    <span class="fp-app">PlayHQ Graphics</span>
    <nav class="fp-nav"><a href="/">Home</a><a href="/control.html">Control</a><a href="/setup.html">Competition setup</a><a href="/api.html" aria-current="page">API docs</a><a href="/openapi.yaml" download>Download YAML</a></nav>
  </div></header>
  <div id="swagger"></div>
  <div id="fallback" hidden>
    <p>The documentation viewer did not load.
       The raw document is at <a href="/openapi.yaml">/openapi.yaml</a>, and STREAMDECK.md in the folder lists every link.</p>
  </div>
  <script src="vendor/swagger-ui/swagger-ui-bundle.js"></script>
  <script>
    // "Try it out" on any link sends it to the scoreboard for real.
    if (window.SwaggerUIBundle) {
      SwaggerUIBundle({
        url: '/openapi.yaml',
        dom_id: '#swagger',
        deepLinking: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 0,
        tryItOutEnabled: true,
      });
    } else {
      document.getElementById('fallback').hidden = false;
    }
  </script>
</body>
</html>
