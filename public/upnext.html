<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Up Next</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<style>
  /* This page's own layout. What it shares with other graphics is in graphics.css. */
  /* Up next (match up for the following game) */
  .upnext__tabs { display: flex; justify-content: center; gap: 12px; }
  .upnext__tab { background: var(--yellow); color: var(--text-on-yellow); }
  .upnext__middle { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .upnext__time {
    background: var(--yellow); color: var(--text-on-yellow); font-size: 34px; font-weight: 800; padding: 8px 22px;
    border-radius: 999px; white-space: nowrap;
  }
  .upnext__time:empty { display: none; }
  /* Up next's end of night card: after the last game, thanks and when to join again */
  .wrap { --card-width: 1400px; position: relative; text-align: center; }
  .wrap__header { padding: 34px 40px 0; position: relative; z-index: 1; }
  .wrap__title {
    margin: 22px 0 0; font-size: 58px; font-weight: 800; text-transform: uppercase; color: var(--yellow);
    line-height: 1.05; letter-spacing: 0.02em; text-wrap: balance; animation: rise 0.6s 0.15s ease-out both;
  }
  .wrap__body { position: relative; z-index: 1; padding: 22px 60px 34px; display: flex; flex-direction: column; align-items: center; }
  .wrap__logo {
    width: 260px; height: 260px; object-fit: contain; margin-bottom: 18px;
    filter: drop-shadow(0 0 28px rgba(var(--yellow-rgb), .35)) drop-shadow(0 10px 22px rgba(0,0,0,.5));
    animation: wrap-pop 0.8s 0.3s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .wrap__thanks { color: var(--muted); font-size: 26px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; animation: rise 0.5s 0.5s ease-out both; }
  .wrap__comp {
    margin: 8px 0 0; font-size: 64px; font-weight: 800; text-transform: uppercase; line-height: 1.05; text-wrap: balance;
    animation: rise 0.5s 0.6s ease-out both;
  }
  .wrap__org { margin-top: 12px; color: var(--muted); font-size: 28px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-wrap: balance; animation: rise 0.5s 0.7s ease-out both; }
  .wrap__org:empty, .wrap__comp:empty, .wrap__when:empty { display: none; }
  .wrap__next { position: relative; z-index: 1; background: var(--purple); padding: 22px 40px 24px; border-top: 4px solid var(--yellow); animation: rise 0.5s 0.9s ease-out both; }
  .wrap__invite { font-size: 46px; font-weight: 800; text-transform: uppercase; color: var(--yellow); line-height: 1.1; text-wrap: balance; }
  .wrap__when { margin-top: 8px; font-size: 26px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .wrap__sponsors { position: relative; z-index: 1; padding: 18px 40px 22px; text-align: center; animation: rise 0.5s 1.2s ease-out both; }
  .wrap__sponsors-title { font-size: 18px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .wrap__sponsors-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .wrap__sponsor { box-sizing: border-box; width: 190px; height: 74px; padding: 10px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .wrap__sponsor img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .wrap__sponsor span { color: var(--purple-dark); font-size: 18px; font-weight: 800; text-transform: uppercase; text-align: center; line-height: 1.05; overflow-wrap: anywhere; }
  .wrap__confetti { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .wrap__confetti i {
    position: absolute; top: -24px; width: 12px; height: 18px; border-radius: 2px; opacity: 0;
    animation: wrap-fall 3s ease-in both;
  }
  @keyframes wrap-pop { from { opacity: 0; transform: scale(.4) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes wrap-fall {
    0% { opacity: 0; transform: translate(0, 0) rotate(0); }
    8% { opacity: .85; }
    80% { opacity: .85; }
    100% { opacity: 0; transform: translate(var(--drift), 860px) rotate(var(--spin)); }
  }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="fit.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/upnext.html
       Shows the game after the one picked on the scoreboard control page, on the same
       court (for half time). With no game picked, it shows the second timeslot.
       Loads once, each time it comes on.
       After the last game of the night it shows the end of night card instead: the last game of the
       night (or season), the competition and organisation, and when to join again (next week, a day,
       finals, or a thank you for the season). ?wrap=1 shows that card now, ?wrap=0 never shows it,
       ?message= changes the invite line and ?mode=dark uses the dark mode competition logo. The end of
       night card thanks the competition's sponsors (Sponsors page) with a strip of their logos, naming
       rights to Major; ?sponsors=0 leaves it out, ?sponsors=all shows every tier. -->
  <main class="card matchup upnext" id="card" data-fit hidden>
    <header class="matchup__header">
      <div class="upnext__tabs"><div class="tab upnext__tab">Up next</div><div class="tab" id="comp"></div></div>
      <div class="matchup__division" id="division"></div>
    </header>
    <div class="matchup__teams">
      <div class="matchup__team"><div id="homeLogo"></div><h2 id="homeName"></h2></div>
      <div class="upnext__middle"><div class="matchup__vs">VS</div><div class="upnext__time" id="time"></div></div>
      <div class="matchup__team"><div id="awayLogo"></div><h2 id="awayName"></h2></div>
    </div>
    <footer class="matchup__info" id="info"></footer>
  </main>
  <main class="card wrap" id="wrap" data-fit hidden>
    <div class="wrap__confetti" id="confetti"></div>
    <header class="wrap__header">
      <div class="upnext__tabs"><div class="tab upnext__tab" id="wrapTab">That's a wrap</div><div class="tab" id="wrapRound"></div></div>
      <h1 class="wrap__title" id="wrapTitle">That's the last game of the night</h1>
    </header>
    <div class="wrap__body">
      <img class="wrap__logo" id="wrapLogo" alt="" hidden>
      <div class="wrap__thanks" id="wrapThanks">Thanks for watching</div>
      <h2 class="wrap__comp" id="wrapComp"></h2>
      <div class="wrap__org" id="wrapOrg"></div>
    </div>
    <footer class="wrap__next">
      <div class="wrap__invite" id="wrapInvite"></div>
      <div class="wrap__when" id="wrapWhen"></div>
    </footer>
    <section class="wrap__sponsors" id="wrapSponsors" hidden><div class="wrap__sponsors-title">Thanks to our sponsors</div><div class="wrap__sponsors-row" id="wrapSponsorRow"></div></section>
  </main>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script src="wrapwords.js"></script>
  <script>

    function clock(time) {
      const [h, m] = String(time || '').split(':').map(Number);
      return Number.isFinite(h) ? `${(h % 12) || 12}:${String(m || 0).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}` : (time || '');
    }
    function setLogo(id, name, logo) {
      const node = logoEl({ name, logo }, 'matchup__logo');
      node.id = id;
      document.getElementById(id).replaceWith(node);
    }

    const params = new URLSearchParams(location.search);
    // The end of night card: no game after this one tonight.
    function showWrap(w) {
      const set = (id, text) => { document.getElementById(id).textContent = text; };
      const words = wrapWords(w);
      set('wrapRound', w.round);
      set('wrapTitle', words.title);
      set('wrapComp', w.competition);
      set('wrapOrg', w.organisation && w.organisation !== w.competition ? w.organisation : '');
      const logo = (params.get('mode') === 'dark' ? w.competitionLogoDark : w.competitionLogoLight) || w.competitionLogoLight;
      const img = document.getElementById('wrapLogo');
      if (logo) { img.src = logo; img.hidden = false; img.onerror = () => { img.hidden = true; }; }
      set('wrapInvite', params.get('message') || words.invite);
      set('wrapWhen', words.detail);
      document.getElementById('wrap').hidden = false;
      confetti();
      sponsors();
    }
    // Thanks to our sponsors: their logos on white plates, naming rights to Major (?sponsors=all for every tier).
    async function sponsors() {
      const want = params.get('sponsors');
      if (want === '0') return;
      try {
        const tiers = want === 'all' ? '' : '&tiers=naming,elite,major';
        const r = await (await fetch(`/api/sponsors/wall?place=night&max=8${tiers}`, { cache: 'no-store' })).json();
        const list = (r.tiers || []).flatMap(t => t.sponsors).slice(0, 8);
        if (!list.length) return;
        const row = document.getElementById('wrapSponsorRow');
        for (const s of list) {
          const plate = document.createElement('div');
          plate.className = 'wrap__sponsor';
          const words = () => { const w = document.createElement('span'); w.textContent = s.name; return w; };
          if (s.logoUrl) {
            const img = new Image();
            img.alt = s.name;
            img.onerror = () => { img.replaceWith(words()); };
            img.src = s.logoUrl;
            plate.append(img);
          } else plate.append(words());
          row.append(plate);
        }
        document.getElementById('wrapSponsors').hidden = false;
        window.pageLog && pageLog('info', `End of night sponsors: ${list.map(s => s.name).join(', ')}`);
      } catch (err) { console.warn('Sponsors unavailable:', err.message); }
    }
    // A short burst of confetti in the competition's colours, falling once behind the words.
    function confetti() {
      const box = document.getElementById('confetti');
      const colours = ['var(--yellow)', 'var(--pink)', 'var(--text)', 'var(--yellow-light)'];
      for (let i = 0; i < 36; i++) {
        const bit = document.createElement('i');
        bit.style.left = `${Math.random() * 100}%`;
        bit.style.background = colours[i % colours.length];
        bit.style.animationDelay = `${0.2 + Math.random() * 1.4}s`;
        bit.style.animationDuration = `${2.4 + Math.random() * 1.6}s`;
        bit.style.setProperty('--spin', `${(Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 540)}deg`);
        bit.style.setProperty('--drift', `${Math.round((Math.random() - 0.5) * 160)}px`);
        if (i % 3 === 0) bit.style.borderRadius = '50%';
        box.appendChild(bit);
      }
    }

    (async () => {
      const msg = document.getElementById('message');
      try {
        const wrap = params.get('wrap');
        const g = await (await fetch(`/api/upnext${wrap === '0' || wrap === '1' ? `?wrap=${wrap}` : ''}`, { cache: 'no-store' })).json();
        if (g.wrap) return showWrap(g.wrap);
        if (g.error) throw new Error(g.error);
        document.getElementById('comp').textContent = g.competition || '';
        document.getElementById('division').textContent = [g.division, g.round].filter(Boolean).join('  ·  ');
        document.getElementById('homeName').textContent = g.home.name;
        document.getElementById('awayName').textContent = g.away.name;
        setLogo('homeLogo', g.home.name, g.logos && g.logos.home);
        setLogo('awayLogo', g.away.name, g.logos && g.logos.away);
        document.getElementById('time').textContent = clock(g.time);
        const info = document.getElementById('info');
        info.replaceChildren();
        [g.court, g.venueName].filter(Boolean).forEach(t => info.appendChild(el('span', '', t)));
        document.getElementById('card').hidden = false;
      } catch (err) {
        console.warn('Up next unavailable:', err.message);
        msg.textContent = `Up next unavailable: ${err.message}`;
        msg.hidden = false;
      }
    })();
  </script>
</body>
</html>
