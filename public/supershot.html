<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Super shot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="log.js"></script>
<style>
  /* Super shot celebration, 3 seconds, then it fades out and leaves the frame clear. Transparent outside the graphics.
     By default it stays on and plays whenever the scoreboard gets a super shot, with that team's logo, name and club colour.
     ?team=home|away|none plays it once when the page loads instead (manual), for that team or without one.
     Every animation runs from one start on the page's CSS clock, so it plays the same each time.
     Times in seconds: ball flies in 0 to 0.5, bursts 0.5, SUPER SHOT slams 0.45 to 0.65, team 0.95, fades 2.4 to 3. */
  @font-face { font-family: "Montserrat"; font-style: italic; font-weight: 900; src: url("vendor/montserrat/montserrat-latin-900-italic.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-style: italic; font-weight: 800; src: url("vendor/montserrat/montserrat-latin-800-italic.woff2") format("woff2"); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .stage { position: absolute; inset: 0; visibility: hidden; font-family: var(--font, "Montserrat"), "Montserrat", sans-serif;
    --team-rgb: var(--pink-rgb, 230, 0, 126); --side-rgb: var(--purple-rgb, 127, 64, 146); --side-dark: var(--deep-rgb, 40, 16, 50); --side-text: #fff; }
  .stage.go { visibility: visible; animation: out .6s ease-in 2.4s forwards; }
  @keyframes out { to { opacity: 0; transform: scale(1.06); filter: blur(8px); } }
  .shaker { position: absolute; inset: 0; }
  .go .shaker { animation: shake .45s linear .5s; }
  @keyframes shake { 0%, 100% { transform: none; } 15% { transform: translate(-14px, 8px) rotate(-.4deg); } 30% { transform: translate(12px, -10px) rotate(.4deg); }
    45% { transform: translate(-9px, -5px); } 60% { transform: translate(7px, 6px); } 80% { transform: translate(-3px, 2px); } }
  .centre { position: absolute; left: 960px; top: 400px; width: 0; height: 0; }

  /* Light rays and a glow in the team's colour behind the words */
  .rays { position: absolute; left: -1100px; top: -1100px; width: 2200px; height: 2200px; border-radius: 50%; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(var(--team-rgb), .6) 0deg 6deg, rgba(var(--team-rgb), 0) 6deg 12deg,
      rgba(var(--yellow-rgb), .35) 12deg 15deg, rgba(var(--yellow-rgb), 0) 15deg 24deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, .75) 14%, transparent 36%);
            mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, .75) 14%, transparent 36%); }
  .go .rays { animation: fadeIn .35s ease-out .5s forwards, spin 9s linear .5s infinite; }
  .halo { position: absolute; left: -560px; top: -380px; width: 1120px; height: 760px; border-radius: 50%; opacity: 0;
    background: radial-gradient(ellipse, rgba(var(--yellow-rgb), .5), rgba(var(--team-rgb), .4) 38%, rgba(var(--team-rgb), 0) 68%); }
  .go .halo { animation: fadeIn .3s ease-out .5s forwards, pulse .5s ease-in-out .8s infinite alternate; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { opacity: .75; transform: scale(.96); } 100% { opacity: 1; transform: scale(1.05); } }

  /* The netball arcs in from the super shot circle (bottom left), spinning, with a trail, and bursts in the middle */
  .flight { position: absolute; left: -75px; top: -75px; width: 150px; height: 150px; opacity: 0; }
  .go .flight { animation: flyX .5s linear forwards; }
  .flight .arc { width: 100%; height: 100%; }
  .go .flight .arc { animation: flyY .5s cubic-bezier(.2,.8,.4,1) forwards; }
  .flight svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .5)); }
  .go .flight svg { animation: ball .5s ease-in forwards, pop .2s ease-out .5s forwards; }
  @keyframes flyX { 0% { opacity: 1; transform: translateX(-980px); } 100% { opacity: 1; transform: translateX(0); } }
  @keyframes flyY { 0% { transform: translateY(560px); } 45% { transform: translateY(-170px); } 100% { transform: translateY(0); } }
  @keyframes ball { 0% { transform: scale(.45) rotate(0); } 100% { transform: scale(1.25) rotate(720deg); } }
  @keyframes pop { 0% { opacity: 1; transform: scale(1.25) rotate(720deg); } 100% { opacity: 0; transform: scale(2.6) rotate(760deg); } }
  .flight.ghost { filter: blur(3px); }
  .go .flight.g1 { animation-delay: .035s; } .go .flight.g1 .arc, .go .flight.g1 svg { animation-delay: .035s, .535s; }
  .go .flight.g2 { animation-delay: .07s; } .go .flight.g2 .arc, .go .flight.g2 svg { animation-delay: .07s, .57s; }
  .go .flight.g3 { animation-delay: .105s; } .go .flight.g3 .arc, .go .flight.g3 svg { animation-delay: .105s, .605s; }
  .ghost.g1 svg { opacity: .45; } .ghost.g2 svg { opacity: .28; } .ghost.g3 svg { opacity: .15; }
  .go .ghost svg { animation-name: ball, popGhost; }
  @keyframes popGhost { to { opacity: 0; } }

  /* The burst: flash, rings and sparks flying out */
  .flash { position: absolute; left: -700px; top: -700px; width: 1400px; height: 1400px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(var(--yellow-rgb), .65) 15%, rgba(var(--team-rgb), .3) 34%, rgba(var(--team-rgb), 0) 58%); }
  .go .flash { animation: flash .7s ease-out .48s forwards; }
  @keyframes flash { 0% { opacity: 0; transform: scale(.2); } 15% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
  .ring { position: absolute; left: -80px; top: -80px; width: 160px; height: 160px; border-radius: 50%; border: 12px solid var(--yellow); opacity: 0; box-sizing: border-box; }
  .ring--2 { border-color: #fff; border-width: 6px; }
  .ring--3 { border-color: rgb(var(--team-rgb)); border-width: 8px; }
  .go .ring--1 { animation: ring .8s ease-out .5s forwards; }
  .go .ring--2 { animation: ring 1s ease-out .6s forwards; }
  .go .ring--3 { animation: ring 1.1s ease-out .72s forwards; }
  @keyframes ring { 0% { opacity: 1; transform: scale(.3); } 100% { opacity: 0; transform: scale(9); border-width: 1px; } }
  .spark { position: absolute; left: 0; top: -3px; height: 6px; width: var(--len); border-radius: 3px; opacity: 0; transform-origin: 0 50%;
    background: linear-gradient(90deg, transparent, var(--c)); }
  .go .spark { animation: spark var(--t) cubic-bezier(.1,.7,.3,1) .5s forwards; }
  @keyframes spark { 0% { opacity: 1; transform: rotate(var(--a)) translateX(30px) scaleX(.2); }
    70% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scaleX(1); } }

  /* Speed lines sweeping through as the words land */
  .lines { position: absolute; inset: 0; pointer-events: none; }
  .line { position: absolute; left: 0; top: var(--y); width: var(--w); height: var(--h); border-radius: 4px; opacity: 0; background: var(--c); }
  .go .line { animation: sweep .55s cubic-bezier(.5,0,.4,1) var(--dl) forwards; }
  @keyframes sweep { 0% { opacity: .95; transform: translateX(-110%); } 100% { opacity: .95; transform: translateX(2050px); } }

  /* SUPER from the left, SHOT from the right, slamming into place */
  .words { position: absolute; left: 0; right: 0; top: 188px; text-align: center; font-weight: 900; font-style: italic; line-height: .88; white-space: nowrap; }
  .word { position: relative; display: block; font-size: 220px; letter-spacing: 6px; color: var(--yellow); opacity: 0;
    -webkit-text-stroke: 5px #fff; paint-order: stroke fill;
    text-shadow: 10px 10px 0 var(--purple-dark), 0 0 60px rgba(var(--yellow-rgb), .55); }
  .word--super { margin-left: -170px; }
  .word--shot { margin-left: 170px; }
  .go .word--super { animation: inL .45s cubic-bezier(.25,1.5,.5,1) .42s forwards; }
  .go .word--shot { animation: inR .45s cubic-bezier(.25,1.5,.5,1) .5s forwards; }
  @keyframes inL { 0% { opacity: 0; transform: translateX(-1400px) skewX(-25deg); filter: blur(14px); } 100% { opacity: 1; transform: none; filter: none; } }
  @keyframes inR { 0% { opacity: 0; transform: translateX(1400px) skewX(25deg); filter: blur(14px); } 100% { opacity: 1; transform: none; filter: none; } }
  /* A light sweep across the letters */
  .word::after { content: attr(data-text); position: absolute; inset: 0; -webkit-text-stroke: 0; text-shadow: none; color: transparent;
    background: linear-gradient(110deg, transparent 40%, rgba(255, 255, 255, .95) 50%, transparent 60%) no-repeat; background-size: 300% 100%; background-position: 150% 0;
    -webkit-background-clip: text; background-clip: text; }
  .go .word--super::after { animation: shine .7s ease-in-out 1.15s forwards; }
  .go .word--shot::after { animation: shine .7s ease-in-out 1.3s forwards; }
  @keyframes shine { to { background-position: -50% 0; } }

  /* ?team=home|away: the team's logo and name on a plate in their colour */
  .team { position: absolute; left: 0; right: 0; top: 625px; display: none; justify-content: center; align-items: center; opacity: 0; }
  .has-team .team { display: flex; }
  .go .team { animation: rise .45s cubic-bezier(.2,.9,.2,1) .95s forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(60px); } 100% { opacity: 1; transform: none; } }
  .team .crest { width: 150px; height: 150px; margin-right: -36px; position: relative; z-index: 1; }
  .logo { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .5)); }
  .logo-fallback { display: flex; align-items: center; justify-content: center; border-radius: 50%; box-sizing: border-box;
    background: rgb(var(--side-rgb)); border: 7px solid var(--yellow); color: var(--side-text); font-weight: 900; font-size: 52px; }
  .plate { padding: 12px 56px 12px 66px; max-width: 1100px; box-sizing: border-box; white-space: nowrap;
    background: linear-gradient(180deg, rgb(var(--side-rgb)), rgb(var(--side-dark))); border-bottom: 6px solid var(--yellow);
    clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); }
  .plate h2 { margin: 0; color: var(--side-text); font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 64px; line-height: 1.1; letter-spacing: 1px; }
</style>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page; leave it on:
       http://localhost:8080/supershot.html             (plays by itself for each super shot: a +2 press, or PlayHQ's scorer)
       It runs for 3 seconds, fades out and leaves the frame clear.
       Manual, plays once each time the source comes on (keep "Load the page fresh each time it's shown" ticked):
       http://localhost:8080/supershot.html?team=home   (or ?team=away: that team's logo, name and club colour)
       http://localhost:8080/supershot.html?team=none   (no team, the competition's colours) -->
  <div class="stage" id="stage">
    <div class="shaker">
      <div class="centre"><div class="rays"></div><div class="halo"></div></div>
      <div class="lines" id="lines"></div>
      <div class="centre" id="sparks"><div class="flash"></div><div class="ring ring--1"></div><div class="ring ring--2"></div><div class="ring ring--3"></div></div>
      <div class="words"><span class="word word--super" id="w1" data-text="SUPER">SUPER</span><span class="word word--shot" id="w2" data-text="SHOT">SHOT</span></div>
      <div class="team" id="team"><div class="crest" id="crest"></div><div class="plate" id="plate"><h2 id="name"></h2></div></div>
      <div class="centre" id="balls"></div>
    </div>
  </div>
  <template id="ballSvg">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="shade" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1f1f1"/><stop offset="1" stop-color="#b9b9b9"/></radialGradient></defs>
      <circle cx="50" cy="50" r="47" fill="url(#shade)" stroke="var(--purple-dark, #3a1f45)" stroke-width="2"/>
      <g fill="none" stroke="rgb(var(--team-rgb))" stroke-width="5" stroke-linecap="round">
        <path d="M50 3 C 28 26, 28 74, 50 97"/><path d="M50 3 C 72 26, 72 74, 50 97"/><path d="M4 44 C 32 34, 68 34, 96 44"/><path d="M6 66 C 34 58, 66 58, 94 66"/>
      </g>
    </svg>
  </template>
  <script src="teams.js"></script>
  <script>
    const opts = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const stage = $('stage');

    // A club colour from the competition setup page, as on winner.html; without one, the competition's main colour (home) or accent (away).
    function colourOf(hex, fallbackVar) {
      const ok = /^#[0-9a-f]{6}$/i.test(hex || '');
      const rgb = ok ? [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)) : (css(fallbackVar) || '127, 64, 146').split(',').map(Number);
      const lum = rgb.map(c => c / 255).map(c => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
      const light = 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2] > 0.4;
      return { rgb: rgb.join(', '), dark: rgb.map(c => Math.round(c * .5)).join(', '), text: light ? '#111111' : '#ffffff' };
    }
    function fit(node, max, size, min) {
      node.style.fontSize = size + 'px';
      while (node.scrollWidth > max && size > min) node.style.fontSize = (size -= 2) + 'px';
    }

    // The ball and three fading copies behind it for a trail (drawn last so the ball flies over the words).
    function balls() {
      const box = $('balls');
      ['g3', 'g2', 'g1', ''].forEach(g => {
        const f = document.createElement('div');
        f.className = 'flight' + (g ? ' ghost ' + g : '');
        f.innerHTML = '<div class="arc">' + $('ballSvg').innerHTML + '</div>';
        box.appendChild(f);
      });
    }
    // Sparks flying out from where the ball bursts, and speed lines across the words.
    function sparks() {
      const box = $('sparks');
      const colours = ['var(--yellow)', '#ffffff', 'rgb(var(--team-rgb))'];
      for (let i = 0; i < 30; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        const a = i * 12 + (i % 3) * 4;
        s.style.cssText = `--a:${a}deg;--d:${380 + (i * 53) % 340}px;--len:${70 + (i * 37) % 90}px;--t:${.7 + (i % 4) * .12}s;--c:${colours[i % 3]}`;
        box.appendChild(s);
      }
      const lines = $('lines');
      [[250, 10, 900, '.38s', 'var(--yellow)'], [330, 5, 1300, '.42s', '#ffffff'], [420, 14, 700, '.46s', 'rgb(var(--team-rgb))'],
       [505, 6, 1100, '.40s', '#ffffff'], [580, 10, 800, '.50s', 'var(--yellow)'], [190, 4, 600, '.52s', 'rgb(var(--team-rgb))']]
        .forEach(([y, h, w, dl, c]) => {
          const l = document.createElement('div');
          l.className = 'line';
          l.style.cssText = `--y:${y}px;--h:${h}px;--w:${w}px;--dl:${dl};--c:${c}`;
          lines.appendChild(l);
        });
    }

    // Puts a team's logo, name and club colour on the stage, or takes them off (side '' or no name).
    function dress(s, side) {
      const t = side && s && s[side];
      stage.classList.toggle('has-team', !!(t && t.name));
      ['--team-rgb', '--side-rgb', '--side-dark', '--side-text'].forEach(v => stage.style.removeProperty(v));
      if (!t || !t.name) return null;
      const c = colourOf(s.teamColours && s.teamColours[side], side === 'home' ? '--purple-rgb' : '--pink-rgb');
      stage.style.setProperty('--team-rgb', c.rgb);
      stage.style.setProperty('--side-rgb', c.rgb);
      stage.style.setProperty('--side-dark', c.dark);
      stage.style.setProperty('--side-text', c.text);
      $('name').textContent = t.name;
      fit($('name'), 960, 64, 30);
      const node = logoEl({ name: t.name, logo: s.logos && s.logos[side] }, 'logo');
      $('crest').replaceChildren(node);
      return node.tagName === 'IMG' ? Promise.race([node.decode().catch(() => {}), new Promise(r => setTimeout(r, 1500))]).then(() => t.name) : t.name;
    }
    const scoreboard = async () => (await fetch('/api/scoreboard', { cache: 'no-store' })).json();

    // Starts the animation from the beginning (taking 'go' off and back on restarts every CSS animation).
    const LENGTH_MS = 3000;
    let playingUntil = 0, queued = null;
    async function play(s, side) {
      const who = await dress(s, side);
      stage.classList.remove('go');
      void stage.offsetWidth;
      stage.classList.add('go');
      playingUntil = performance.now() + LENGTH_MS;
      window.pageLog && window.pageLog('info', `Playing the super shot${who ? ` for ${who} (${side})` : ''}`);
      setTimeout(() => { if (queued) { const q = queued; queued = null; play(q.s, q.side); } }, LENGTH_MS);
    }

    // Watching (the default): stays clear until the helper reports a new super shot on the scoreboard (a +2 press on
    // the control page or Stream Deck, or PlayHQ's super shot count going up), then plays it for that team.
    // One that lands while another is playing plays straight after it. Only asks the helper on this computer.
    let seen = null, warned = false;
    async function watch() {
      try {
        const s = await scoreboard();
        const shot = s.superShot || { n: 0 };
        if (warned) { console.info('Super shot: the helper is back'); warned = false; }
        if (seen === null || shot.n < seen) seen = shot.n; // first look, or the helper's count started again
        else if (shot.n > seen) {
          seen = shot.n;
          const age = (s.serverNow || Date.now()) - (shot.at || 0);
          if (age > 15000) console.info(`Super shot ${shot.n} is ${Math.round(age / 1000)} s old, so it isn't played`);
          else if (performance.now() < playingUntil) queued = { s, side: shot.side };
          else play(s, shot.side);
        }
      } catch (err) {
        if (!warned) console.warn('Super shot: scoreboard unavailable, still watching:', err.message);
        warned = true;
      }
      setTimeout(watch, 1000);
    }

    (async function start() {
      const side = String(opts.get('team') || '').toLowerCase();
      if (document.fonts) await document.fonts.ready;
      balls(); sparks();
      if (!opts.has('team')) {
        window.pageLog && window.pageLog('info', 'Watching the scoreboard for super shots');
        return watch();
      }
      // ?team=home|away|none: play once now, for that team or without one.
      if (!['home', 'away', 'none'].includes(side)) console.warn(`Super shot: ?team=${opts.get('team')} is not home, away or none; playing without a team`);
      let s = null;
      if (side === 'home' || side === 'away') {
        try { s = await scoreboard(); } catch (err) { console.warn('Super shot: scoreboard unavailable, playing without the team:', err.message); }
      }
      play(s, side === 'home' || side === 'away' ? side : '');
    })();
  </script>
</body>
</html>
