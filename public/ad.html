<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PIVT and FirstPass Studio ad</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="done.js"></script>
<style>
  /* A 10 second ad for the breaks: the PIVT and FirstPass Studio logos animated together.
     Colours come from the two logos (PIVT's violet to orange gradient, FirstPass blue, orange and gold).
     Every animation runs from one start on the page's CSS clock, so it plays the same each time.
     Times in seconds: streaks 0.2, PIVT lands 1.25, lockup forms 3.0 to 4.6, holds, exits 8.8 to 9.8, clear by 10. */
  @font-face { font-family: "Montserrat"; font-style: italic; font-weight: 800; src: url("vendor/montserrat/montserrat-latin-800-italic.woff2") format("woff2"); }
  :root {
    --violet: #5b4bff; --purple: #9b30ff; --magenta: #d9468f; --orange: #ff8a1f; --amber: #ffb000;
    --fp-blue: #2274a5; --fp-orange: #f75c03; --fp-gold: #f1c40f;
    --pivt-w: 560px; --mark-w: 980px;
    --tag-colour: #0f172a; --glow: .2;
  }
  .dark { --tag-colour: #ffffff; --glow: .45; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Montserrat", system-ui, sans-serif; }
  .stage { position: absolute; inset: 0; visibility: hidden; }
  .stage.go { visibility: visible; }

  /* Optional full-frame background (?bg=, ?bgimage=): fades in at the start and out at the end. */
  .backdrop { position: absolute; inset: 0; opacity: 0; background-size: cover; background-position: center; }
  .backdrop[hidden] { display: none; }
  .go .backdrop { animation: fadeIn .4s ease-out both, fadeOut .6s ease-in 9.3s forwards; }
  .stay .backdrop { animation: fadeIn .4s ease-out both; }

  /* Streaks in PIVT's colours, slanted like the PIVT badge, that sweep across the frame (in at the start, back out at the end) */
  .streaks { position: absolute; inset: 0; pointer-events: none; }
  .bar { position: absolute; left: 0; top: var(--y); height: var(--h); width: var(--w); opacity: 0; border-radius: 6px;
    background: linear-gradient(90deg, var(--violet), var(--purple) 35%, var(--magenta) 65%, var(--orange)); }
  .bar:nth-child(2) { background: var(--fp-blue); }
  .bar:nth-child(4) { background: var(--fp-orange); }
  .bar:nth-child(5) { background: var(--fp-gold); }
  .go .streaks--in .bar { animation: sweepRight .75s cubic-bezier(.5,0,.4,1) var(--d) both; }
  .go .streaks--out .bar { animation: sweepLeft .75s cubic-bezier(.5,0,.4,1) calc(8.8s + var(--d)) both; }
  .stay .streaks--out { display: none; }
  @keyframes sweepRight { 0% { opacity: 1; transform: translateX(calc(-1 * var(--w) - 200px)) skewX(-14deg); }
                          100% { opacity: 1; transform: translateX(2150px) skewX(-14deg); } }
  @keyframes sweepLeft  { 0% { opacity: 1; transform: translateX(2150px) skewX(-14deg); }
                          100% { opacity: 1; transform: translateX(calc(-1 * var(--w) - 200px)) skewX(-14deg); } }

  /* Sparkles that drift up behind the logos while they hold (made by the script) */
  .sparkles { position: absolute; inset: 0; pointer-events: none; }
  .spark { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); opacity: 0; rotate: 45deg; border-radius: 2px; }
  .go .spark { animation: drift var(--t) ease-in-out var(--d) both; }
  @keyframes drift { 0% { opacity: 0; transform: translateY(0) scale(.4); } 20% { opacity: .9; }
                     75% { opacity: .7; } 100% { opacity: 0; transform: translateY(-260px) scale(1); } }
  .stay .spark { animation-iteration-count: infinite; }

  /* The lockup: PIVT above, a gold rule, the FirstPass Studio wordmark below. Each layer is centred on a point
     (translate centres it, so the transforms below scale and turn about its middle). */
  .lockup { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
  .lockup > * { position: absolute; left: 0; top: 0; translate: -50% -50%; translate: round(-50%, 1px) round(-50%, 1px); }
  .go .lockup { animation: push 4.2s ease-out 4.6s forwards; }
  @keyframes push { from { transform: scale(1); } to { transform: scale(1.04); } }

  /* Soft glow behind PIVT. Only over a ?bg= or ?bgimage= background (or with ?glow=1): on a transparent page a key and fill
     output shows it as a coloured oval around the logos. */
  .glow { display: none; }
  .with-glow .glow { display: block; }
  .glow { top: -40px; width: 1500px; height: 820px; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(155,48,255,var(--glow)), rgba(255,138,31,calc(var(--glow) * .4)) 55%, transparent); }
  .go .glow { animation: fadeIn .8s ease-out 1.1s both, fadeOut .6s ease-in 8.9s forwards; }
  .stay .glow { animation: fadeIn .8s ease-out 1.1s both; }

  /* PIVT: slams in from the left, big and alone in the middle, then rises and shrinks to make room for FirstPass Studio */
  .pivt-pos { top: -63px; }
  .go .pivt-pos { animation: riseUp .9s cubic-bezier(.6,0,.2,1) 3s both; }
  @keyframes riseUp { from { transform: translateY(63px) scale(1.3); } to { transform: none; } }
  .go .pivt-in { animation: slamIn .7s cubic-bezier(.2,.9,.3,1.15) .55s both; }
  @keyframes slamIn {
    0%   { opacity: 0; transform: translateX(-1100px) skewX(-24deg) scaleX(1.5); }
    15%  { opacity: 1; }
    70%  { transform: translateX(36px) skewX(8deg) scaleX(.94); }
    100% { opacity: 1; transform: none; }
  }
  .go .pivt-out { animation: shootOut .6s linear 9s forwards; }
  .stay .pivt-out { animation: none; }
  @keyframes shootOut { 0% { transform: none; opacity: 1; animation-timing-function: ease-out; }
                        25% { transform: translateX(-50px) skewX(8deg); animation-timing-function: cubic-bezier(.5,0,.8,.3); }
                        100% { transform: translateX(2100px) skewX(-28deg) scaleX(1.6); opacity: 1; } }
  .pivt { display: block; width: var(--pivt-w); filter: drop-shadow(0 12px 30px rgba(0,0,0,.35)); }
  .art { position: relative; line-height: 0; }

  /* The landing: a gradient outline of the badge that bursts outward, and a quick squash */
  .go .pivt-in .art { animation: squash .35s cubic-bezier(.3,1.6,.5,1) 1.25s; }
  @keyframes squash { 0% { transform: scale(1.08, .9); } 100% { transform: none; } }
  .impact { position: absolute; left: 50%; top: 50%; width: calc(var(--pivt-w) * .93); height: calc(var(--pivt-w) * .4);
    translate: -50% -50%; opacity: 0; padding: 10px; box-sizing: border-box; border-radius: 24px;
    background: linear-gradient(90deg, var(--violet), var(--magenta), var(--amber));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .go .impact { animation: impact .8s cubic-bezier(.1,.7,.3,1) 1.25s both; }
  .go .impact--2 { animation-delay: 1.38s; }
  @keyframes impact { 0% { opacity: 1; transform: skewX(-12deg) scale(.95); } 100% { opacity: 0; transform: skewX(-12deg) scale(1.9); } }

  /* Light sweeps across the logos, masked to their own shapes */
  .shine { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.8) 50%, transparent 62%) no-repeat;
    background-size: 250% 100%; background-position: 160% 0;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .shine--pivt { -webkit-mask-image: url("studio/pivt.png"); mask-image: url("studio/pivt.png"); }
  .go .shine--pivt { animation: shine .9s ease-in-out 1.6s, shine .9s ease-in-out 5.6s, shine .9s ease-in-out 7.6s; }
  .go .shine--mark { animation: shine 1s ease-in-out 5.75s, shine 1s ease-in-out 7.75s; }
  @keyframes shine { from { background-position: 160% 0; } to { background-position: -60% 0; } }

  /* Gold rule between the two */
  .rule { top: 88px; width: 900px; height: 4px; border-radius: 2px; transform: scaleX(0);
    background: linear-gradient(90deg, transparent, var(--fp-gold) 15%, var(--fp-gold) 85%, transparent); }
  .go .rule { animation: ruleIn .6s cubic-bezier(.7,0,.2,1) 3.45s both, ruleOut .4s cubic-bezier(.7,0,.2,1) 8.85s forwards; }
  .stay .rule { animation: ruleIn .6s cubic-bezier(.7,0,.2,1) 3.45s both; }
  @keyframes ruleIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes ruleOut { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* FirstPass Studio wipes in left to right behind a slanted bar, and back out the same way at the end */
  .mark-pos { top: 152px; }
  .mark { display: block; width: var(--mark-w); }
  .mark-clip { clip-path: inset(-20px 100% -20px 0); }
  .go .mark-clip { animation: wipeIn .8s cubic-bezier(.6,0,.2,1) 3.7s forwards, wipeOut .45s cubic-bezier(.7,0,.3,1) 8.8s forwards; }
  .stay .mark-clip { animation: wipeIn .8s cubic-bezier(.6,0,.2,1) 3.7s forwards; }
  @keyframes wipeIn { from { clip-path: inset(-20px 100% -20px 0); } to { clip-path: inset(-20px -20px -20px 0); } }
  @keyframes wipeOut { from { clip-path: inset(-20px -20px -20px 0); } to { clip-path: inset(-20px -20px -20px 100%); } }
  .go .mark-clip .art { animation: markSlide .8s cubic-bezier(.2,.8,.2,1) 3.7s both; }
  @keyframes markSlide { from { transform: translateX(-40px); filter: blur(4px); } to { transform: none; filter: none; } }
  .wiper { position: absolute; left: 0; top: 50%; width: 26px; height: 120px; margin-top: -60px; opacity: 0; border-radius: 4px;
    background: linear-gradient(var(--fp-orange), var(--magenta)); transform: skewX(-14deg); }
  .go .wiper { animation: wiper .8s cubic-bezier(.6,0,.2,1) 3.7s, wiperOut .45s cubic-bezier(.7,0,.3,1) 8.8s; }
  .stay .wiper { animation: wiper .8s cubic-bezier(.6,0,.2,1) 3.7s; }
  @keyframes wiper { 0% { opacity: 1; left: -10px; } 85% { opacity: 1; } 100% { opacity: 0; left: calc(var(--mark-w) + 10px); } }
  @keyframes wiperOut { 0% { opacity: 1; left: -10px; } 90% { opacity: 1; } 100% { opacity: 0; left: calc(var(--mark-w) + 10px); } }

  /* Optional line of text under the lockup (?tagline=) */
  .tagline { top: 240px; white-space: nowrap; font-weight: 800; font-style: italic; font-size: 40px; letter-spacing: .02em;
    color: var(--tag-colour); opacity: 0; }
  .tagline[hidden] { display: none; }
  .go .tagline { animation: tagIn .6s cubic-bezier(.2,.8,.2,1) 4.5s both, fadeOut .35s ease-in 8.8s forwards; }
  .stay .tagline { animation: tagIn .6s cubic-bezier(.2,.8,.2,1) 4.5s both; }
  @keyframes tagIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/ad.html
       A 10 second ad: PIVT slams in, FirstPass Studio wipes in below it, they hold, then sweep away and leave the frame
       transparent. Plays once when the page loads, so it plays each time it comes on.
       Options: ?mode=light or ?mode=dark picks the FirstPass Studio wordmark for a light or dark picture behind it
                (light, the coloured one, unless a ?bg= or ?bgimage= background is set, when it is dark: the white one);
                ?bg=gradient puts a dark radial gradient behind it, ?bg=0f172a (or a colour name) a radial gradient from that
                colour to a darker shade (?bg2= sets the edge colour), ?bg=solid-0f172a a flat colour, and ?bgimage=court.jpg
                a picture from the competition's brand folder (or a full link); the background fades in and out with the ad;
                ?tagline=Live%20netball%20every%20Thursday adds a line of text under the logos;
                ?out=0 keeps the logos on screen at the end instead of sweeping them away;
                a soft glow sits behind the logos only when there is a background (?glow=1 adds it on the transparent page,
                ?glow=0 removes it): over key and fill it would show as a coloured oval. -->
  <div class="stage" id="stage">
    <div class="backdrop" id="backdrop" hidden></div>
    <div class="sparkles" id="sparkles"></div>
    <div class="streaks streaks--in" id="streaksIn"></div>
    <div class="lockup">
      <div class="glow"></div>
      <div class="pivt-pos"><div class="pivt-out"><div class="pivt-in"><div class="art">
        <div class="impact"></div><div class="impact impact--2"></div>
        <img class="pivt" id="pivt" src="studio/pivt.png" alt="PIVT">
        <div class="shine shine--pivt"></div>
      </div></div></div></div>
      <div class="rule"></div>
      <div class="mark-pos">
        <div class="mark-clip"><div class="art">
          <img class="mark" id="mark" alt="FirstPass Studio">
          <div class="shine shine--mark" id="markShine"></div>
        </div></div>
        <div class="wiper"></div>
      </div>
      <div class="tagline" id="tagline" hidden></div>
    </div>
    <div class="streaks streaks--out" id="streaksOut"></div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const $ = id => document.getElementById(id);
      const stage = $('stage');
      if (params.get('out') === '0') stage.classList.add('stay');

      // Background, as on logo.html: ?bg=gradient, ?bg=<colour> (radial to a darker shade, ?bg2= the edge),
      // ?bg=solid-<colour>, ?bgimage=<file in the competition's brand folder, or a link>.
      function colour(v) {
        if (!v) return null;
        v = v.trim();
        if (/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v)) v = '#' + v;
        return CSS.supports('color', v) ? v : null;
      }
      function darker(c) {
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.fillStyle = c; ctx.fillRect(0, 0, 1, 1);
        const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
        return `rgb(${Math.round(r * .3)}, ${Math.round(g * .3)}, ${Math.round(b * .3)})`;
      }
      const bg = (params.get('bg') || '').trim(), image = (params.get('bgimage') || '').trim();
      const layers = [];
      if (image) {
        const url = /[/:]/.test(image) ? image : '/brand/' + encodeURIComponent(image);
        layers.push(`url("${url.replace(/"/g, '%22')}")`);
        const test = new Image(); test.onerror = () => console.warn('Ad: could not load the background image', image); test.src = url;
      }
      if (bg) {
        const solid = bg.toLowerCase().startsWith('solid-') ? colour(bg.slice(6)) : null;
        const centre = bg.toLowerCase() === 'gradient' ? '#3a4250' : colour(bg);
        const edge = colour(params.get('bg2')) || (bg.toLowerCase() === 'gradient' ? '#15181d' : centre && darker(centre));
        if (solid) layers.push(`linear-gradient(${solid}, ${solid})`);
        else if (centre) layers.push(`radial-gradient(circle at 50% 40%, ${centre}, ${edge})`);
        else console.warn('Ad: ?bg= is not a colour or "gradient":', bg);
      }
      if (layers.length) { $('backdrop').style.backgroundImage = layers.join(', '); $('backdrop').hidden = false; }
      const glow = params.get('glow');
      // Chroma key safe (chroma.js): the soft glow would only key as a coloured oval, so it's left out.
      if (!window.studioChroma && (glow === '1' || (glow !== '0' && layers.length))) stage.classList.add('with-glow');

      // The wordmark: the coloured one (light mode) over a light or busy picture, the white one (dark mode) over a dark one.
      const asked = (params.get('mode') || '').toLowerCase();
      const dark = asked ? asked === 'dark' : layers.length > 0;
      if (dark) stage.classList.add('dark');
      const markSrc = dark ? 'studio/firstpass-studio.svg' : 'studio/firstpass-studio-light.svg';
      $('mark').src = markSrc;
      $('markShine').style.webkitMaskImage = $('markShine').style.maskImage = `url("${markSrc}")`;

      const tagline = (params.get('tagline') || '').trim();
      if (tagline) { $('tagline').textContent = tagline; $('tagline').hidden = false; }

      // Streak bars and sparkles. A fixed seed keeps them the same on every play.
      let seed = 7;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      function streaks(box, start) {
        [[300, 46, 760], [400, 22, 520], [486, 70, 980], [612, 26, 640], [700, 14, 420]].forEach(([y, h, w], i) => {
          const b = document.createElement('div');
          b.className = 'bar';
          b.style.cssText = `--y:${y}px;--h:${h}px;--w:${w}px;--d:${start + i * .06}s`;
          box.appendChild(b);
        });
      }
      streaks($('streaksIn'), .2);
      streaks($('streaksOut'), 0);
      const sparkColours = ['#f1c40f', '#ff8a1f', '#9b30ff', '#ffffff', '#d9468f'];
      for (let i = 0; i < 44; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        const x = 960 + (rand() - .5) * 1500, y = 560 + (rand() - .3) * 420;
        s.style.cssText = `--x:${x}px;--y:${y}px;--s:${6 + rand() * 10}px;--t:${2 + rand() * 1.6}s;--d:${1.3 + rand() * 5.4}s;background:${sparkColours[i % sparkColours.length]}`;
        $('sparkles').appendChild(s);
      }

      // Starts once both logos have loaded, so it never animates an empty box.
      let started = false;
      const start = () => { if (!started) { started = true; stage.classList.add('go'); if (params.get('out') !== '0') studioDone.afterAnimations(); } };
      Promise.all([$('pivt'), $('mark')].map(img => img.decode().catch(() => console.warn('Ad: could not load', img.src))))
        .then(start);
      setTimeout(start, 3000);
    })();
  </script>
</body>
</html>
