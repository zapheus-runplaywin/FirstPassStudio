<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full Time</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<style>
  /* This page's own layout. What it shares with other graphics is in graphics.css. */
  /* Full time */
  .fulltime { --card-width: 1500px; text-align: center; }
  .fulltime__score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 30px; padding: 26px 50px 20px; }
  .fulltime__logo { width: 260px; height: 260px; object-fit: contain; display: block; margin: 0 auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
  .fulltime__logo.logo-fallback { display: flex; font-size: 80px; }
  .fulltime__name { margin-top: 12px; font-size: 40px; font-weight: 800; text-transform: uppercase; color: var(--yellow); }
  .fulltime__nums { font-size: 150px; font-weight: 800; line-height: 1; display: flex; gap: 24px; color: var(--muted); }
  .fulltime__nums .is-win { color: var(--text); }
  .fulltime__dash { color: var(--pink); }
  .fulltime__stats { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 0 40px 32px; }
  .fulltime__stats[hidden] { display: none; }
  .fulltime__panel { background: var(--purple-deep-alt); border-radius: 10px; padding: 16px 20px; text-transform: uppercase; }
  .fulltime__panel:empty { visibility: hidden; }
  .fulltime__label { font-size: 16px; color: var(--muted); letter-spacing: .1em; font-weight: 700; }
  .fulltime__label + .fulltime__player, .fulltime__label + .fulltime__pct { margin-bottom: 10px; }
  .fulltime__player { font-size: 32px; font-weight: 800; }
  .fulltime__line { font-size: 22px; font-weight: 700; color: var(--yellow); margin-bottom: 12px; }
  .fulltime__pct { font-size: 40px; font-weight: 800; color: var(--yellow); }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="fit.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/fulltime.html
       Final score from the scoreboard, with each team's top shooter and shooting accuracy from
       PlayHQ's game stats.
       Loads once, each time it comes on. Options: ?title=Half%20time -->
  <main class="card fulltime" id="card" data-fit hidden>
    <header class="matchup__header">
      <div class="tab" id="title">Full time</div>
      <div class="matchup__division" id="division"></div>
    </header>
    <div class="fulltime__score">
      <div class="fulltime__team" id="homeTeam"></div>
      <div class="fulltime__nums"><span id="homeScore"></span><span class="fulltime__dash">–</span><span id="awayScore"></span></div>
      <div class="fulltime__team" id="awayTeam"></div>
    </div>
    <div class="fulltime__stats" id="stats"></div>
  </main>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script type="module" src="fulltime.js"></script>
</body>
</html>
