<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Last 10 Goals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="fit.js"></script>
<script src="sceneevents.js"></script>
<style>
  /* Last 10 goals: who scored each of the game's last ten goals, oldest to newest, with a
     momentum line (up for a home goal, down for an away goal) and the current run.
     Transparent outside the card. Updates itself every 2 seconds, like the scoreboard. */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: var(--font, "Montserrat"), "Montserrat", sans-serif; color: var(--text, #fff); position: relative; }
  [hidden] { display: none !important; }
  /* Made to sit over play (Matt, 2026-10-21): no box. The goals float on a soft shade that fades out to nothing at the
     edges, with dark ribbons only where text and the momentum line need them, so the court shows through. */
  .card { position: absolute; box-sizing: border-box; animation: rise .5s ease-out both;
    --size: .8; /* drawn at 80% of its layout size (on top of fit.js's scale), so it takes less of the frame */
    /* Without club colours, home is the competition's pink and away its yellow, as on the game stats, score worm and
       commentator stats (Matt, 2026-10-28: they were the other way round here). */
    --home: var(--pink); --away: var(--yellow); --home-text: #fff; --away-text: var(--text-on-yellow); }
  .card::before { content: ""; position: absolute; inset: -50px; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side, rgba(var(--deep-rgb), .5), rgba(var(--deep-rgb), .3) 70%, rgba(var(--deep-rgb), 0)); }
  /* Where it sits (?y= and ?x=, each layout's default set in the script): in the space between the title and the
     scoreboard (fit.js sets --zone-* and scales the card down if it's too big), 60px in from the sides. Centred with
     translate rounded to whole pixels, so its edges and letters don't land on half pixels. */
  .card { --dx: 0px; --dy: 0px; transform: translate(var(--dx), var(--dy)) scale(calc(var(--fit, 1) * var(--size))); transform-origin: var(--ox) var(--oy); }
  .card[data-x="left"] { left: 60px; --ox: left; }
  .card[data-x="center"] { left: 50%; --dx: round(-50%, 1px); --ox: center; }
  .card[data-x="right"] { right: 60px; --ox: right; }
  .card[data-y="top"] { top: var(--zone-top, 244px); --oy: top; }
  .card[data-y="middle"] { top: calc(var(--zone-top, 244px) + var(--zone-height, 650px) / 2); --dy: round(-50%, 1px); --oy: center; }
  .card[data-y="bottom"] { bottom: calc(1080px - var(--zone-bottom, 894px)); --oy: bottom; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  .head { display: flex; align-items: center; gap: 18px; padding: 16px 26px 6px; }
  .tab { background: var(--pink); color: var(--text); padding: 7px 18px; border-radius: 6px; font-size: 22px; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 17px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  /* Lifts light text off whatever is behind */
  .when, .meta, .gap, .card--h .worm-label, .card--h .team .name, .run:not(.is-hot) { text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }

  .logo { width: 100%; height: 100%; object-fit: contain; display: block; }
  .initials { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-weight: 800; font-size: 20px; }
  .name { min-width: 0; font-weight: 800; text-transform: uppercase; white-space: nowrap; overflow: hidden; line-height: 1.1; }
  .count { font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 8px; text-align: center; }

  /* A goal: a disc in the club colour with the team's logo, +2 badge on a super goal */
  .ball { position: relative; width: var(--ball); height: var(--ball); border-radius: 50%; box-sizing: border-box; flex: none;
    background: var(--c); color: var(--t); border: 3px solid rgba(255, 255, 255, .85); box-shadow: 0 4px 12px rgba(0, 0, 0, .4); }
  .ball .logo, .ball .initials { position: absolute; inset: 9%; width: 82%; height: 82%; }
  .ball--home { --c: var(--home); --t: var(--home-text); }
  .ball--away { --c: var(--away); --t: var(--away-text); }
  .ball.is-super { border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(var(--yellow-rgb), .35), 0 4px 14px rgba(0, 0, 0, .45); }
  .ball .two { position: absolute; right: -10px; top: -10px; min-width: 30px; height: 30px; padding: 0 4px; box-sizing: border-box; border-radius: 15px;
    background: var(--yellow); color: var(--text-on-yellow); font-size: 17px; font-weight: 900; line-height: 30px; text-align: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
  .ball.is-latest::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--c);
    animation: ping 1.6s ease-out infinite; }
  @keyframes ping { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.35); } }
  .ball.is-new { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .empty { width: var(--ball); height: var(--ball); border-radius: 50%; border: 3px dashed rgba(255, 255, 255, .16); box-sizing: border-box; flex: none; }
  .when { font-size: 15px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .worm path.line { fill: none; stroke: #fff; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  .worm .zero { stroke: rgba(255, 255, 255, .25); stroke-width: 2; stroke-dasharray: 6 6; }
  .worm .fill-home { fill: var(--home); opacity: .45; }
  .worm .fill-away { fill: var(--away); opacity: .45; }
  .worm .dot { fill: #fff; }
  .worm .dot.is-latest { fill: var(--yellow); stroke: #fff; stroke-width: 3; }
  .worm .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .6s ease-out .1s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .run { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 24px; font-size: 20px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase; background: rgba(var(--deep-rgb), .8); color: var(--text); min-height: 26px;
    width: fit-content; max-width: calc(100% - 28px); box-sizing: border-box; margin: 0 auto; border-radius: 999px; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
  .run:empty { display: none; }
  .run .chip { width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 2px solid #fff; flex: none; }
  .run.is-hot { background: var(--c); color: var(--t); animation: glow 1.2s ease-in-out infinite alternate; }
  .run.is-hot .chip { display: none; }
  @keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.15); } }
  .run .flame { font-size: 22px; }

  /* ── Horizontal: lanes for each team, oldest goal on the left ─────────────────────── */
  .card--h { --ball: 72px; --slot: 104px; }
  .card--h .grid { display: grid; grid-template-columns: 330px auto; padding: 6px 26px 14px; column-gap: 14px; }
  .card--h .team { display: grid; grid-template-columns: 64px minmax(0, 1fr) 58px; align-items: center; gap: 12px; height: 70px; margin: 8px 0;
    padding: 0 8px 0 4px; border-left: 6px solid var(--c); border-radius: 12px; background: linear-gradient(90deg, rgba(var(--deep-rgb), .8), rgba(var(--deep-rgb), .35)); }
  .card--h .team .badge { width: 64px; height: 64px; }
  .card--h .team .name { font-size: 26px; }
  .card--h .team .count { font-size: 34px; padding: 4px 0; background: var(--c); color: var(--t); }
  .card--h .team--home { --c: var(--home); --t: var(--home-text); }
  .card--h .team--away { --c: var(--away); --t: var(--away-text); }
  .card--h .worm-label { display: flex; align-items: center; height: 50px; color: var(--muted); font-size: 15px; font-weight: 800;
    letter-spacing: .12em; text-transform: uppercase; }
  .card--h .track { position: relative; display: grid; grid-template-rows: 86px 50px 86px; }
  /* A dark ribbon under the momentum line, across and down the middle */
  .card--h .track::before { content: ""; position: absolute; left: 0; right: 0; top: 86px; height: 50px; border-radius: 25px; background: rgba(var(--deep-rgb), .6); }
  .card--h .worm { position: relative; }
  .card--h .lane { display: flex; }
  .card--h .slot { width: var(--slot); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
  .card--h .lane--home .slot { justify-content: flex-end; padding-bottom: 2px; }
  .card--h .lane--away .slot { justify-content: flex-start; padding-top: 2px; }
  .card--h .lane--home .slot .when { order: -1; }
  .card--h .slot.is-break::before { content: ""; position: absolute; left: -1px; top: -6px; bottom: -6px; border-left: 2px dashed rgba(255, 255, 255, .35); }
  .qlabel { position: absolute; z-index: 2; background: var(--yellow); color: var(--text-on-yellow); border-radius: 4px; padding: 2px 6px;
    font-size: 13px; font-weight: 900; letter-spacing: .06em; line-height: 1.2; }
  .card--h .qlabel { left: 6px; top: -48px; }
  .card--h .lane--away .slot.is-break::before { top: -56px; }
  .card--h .worm { width: 100%; height: 50px; display: block; }

  /* ── Vertical: home goals on the left, away on the right, newest at the bottom ───── */
  .card--v { --ball: 48px; width: 400px; }
  .card--v .run { font-size: 18px; padding: 10px 14px; }
  .card--v .run .says { white-space: nowrap; overflow: hidden; min-width: 0; }
  .card--v .head { justify-content: center; padding: 18px 20px 8px; }
  .card--v .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 14px 12px; }
  .card--v .team { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px 12px; border-radius: 10px; background: var(--c); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); color: var(--t); min-width: 0; }
  .card--v .team--home { --c: var(--home); --t: var(--home-text); }
  .card--v .team--away { --c: var(--away); --t: var(--away-text); }
  .card--v .team .badge { width: 56px; height: 56px; }
  /* Long names wrap onto a second line rather than shrinking to nothing in the narrow column */
  .card--v .team .name { font-size: 21px; max-width: 100%; text-align: center; white-space: normal; overflow-wrap: break-word;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .card--v .team .count { font-size: 30px; line-height: 1; }
  .card--v .team .count small { display: block; font-size: 12px; letter-spacing: .1em; opacity: .8; margin-top: 2px; }
  .card--v .rows { position: relative; padding: 2px 14px 12px; }
  .card--v .rows::before { content: ""; position: absolute; left: calc(50% - 32px); width: 64px; top: 0; bottom: 10px; border-radius: 32px; background: rgba(var(--deep-rgb), .6); }
  .card--v .row { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; height: 52px; }
  .card--v .cell { display: flex; align-items: center; gap: 8px; }
  .card--v .cell--home { justify-content: flex-end; }
  .card--v .cell--away { justify-content: flex-start; }
  .card--v .cell--home .when { order: -1; }
  .card--v .row.is-break { border-top: 2px dashed rgba(255, 255, 255, .35); position: relative; }
  .card--v .qlabel { left: 0; top: -12px; }
  .card--v .worm { position: absolute; left: calc(50% - 32px); width: 64px; top: 2px; display: block; }
  .card--v .row .empty { margin: 0 auto; grid-column: 1 / -1; width: 36px; height: 36px; }
  /* ?fill=1: the card fills its window instead of a 1920 x 1080 frame, scaled to fit, for a page that shows it in a box
     of its own (commentatorstats.html, horizontal); no shade, as that box has its own background. */
  html.fill, html.fill body { width: 100%; height: 100%; }
  html.fill .card::before { display: none; }
  html.fill .card { left: 50%; top: 0; transform: translateX(-50%) scale(var(--fill, 1)); transform-origin: top center; }
  .gap { color: var(--muted); font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/goals.html               (horizontal, centred just above the scoreboard)
       http://localhost:8080/goals.html?layout=vertical  (vertical, in the middle of the right-hand side)
       The last 10 goals of the game on the scoreboard, oldest to newest, with a momentum line and the current run.
       Like the scoreboard it updates itself (every 2 seconds), so it can stay on screen.
       Options: ?count=8 (3 to 30)  ?times=0 (no quarter and time under each goal)  ?run=0 (no current run line)
                ?y=top|middle|bottom  ?x=left|center|right (where it sits, either layout)  ?title=Momentum
       &fill=1 fills the window it's in rather than a 1920 x 1080 frame (horizontal spreads its goals to the window's
       shape): commentatorstats.html shows it that way. -->
  <main class="card" id="card" data-fit="var" hidden></main>
  <script type="module" src="goals.js"></script>
</body>
</html>
