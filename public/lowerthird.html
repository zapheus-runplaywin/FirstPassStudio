<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lower Third</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<style>
  /* Laid out for 1920 x 1080 at 1x, on whole pixels. By default the bar's left edge lines up with the
     scoreboard's (the scoreboard is 1335px wide and centred on whole pixels, so its left edge is at 293px and its right edge 292px from the right) and its bottom
     sits 8px above the scoreboard's PlayHQ Live tab (top 930px), like the ladder lower third. ?position=right
     mirrors it (badge on the right, words right-aligned) with its right edge on the scoreboard's, for a second
     person on screen at the same time. */
  :root { --left: 293px; --right: 292px; --bottom: 158px; --height: 120px; --width: 900px; }
  /* One fixed width, so every person's bar is the same size whatever their name (a photo adds its own width). */
  html, body { margin: 0; background: transparent; }
  body { font-family: var(--font); color: var(--text); width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  [hidden] { display: none !important; }
  body.bottom, body.bottom-center, body.bottom-right { --bottom: 80px; }

  .l3 { position: absolute; left: var(--left); bottom: var(--bottom); display: flex; flex-direction: column; align-items: flex-start; }
  body.center .l3, body.bottom-center .l3 { left: 50%; transform: translateX(-50%); transform: translateX(round(-50%, 1px)); align-items: center; }

  body.right .l3, body.bottom-right .l3 { left: auto; right: var(--right); align-items: flex-end; }
  /* Two people on screen: the right one and a left-half one share the scoreboard's width with a 15px gap. */
  body.right, body.bottom-right, body.left-half, body.bottom-left-half { --width: 660px; }
  body.bottom-left-half { --bottom: 80px; }
  .l3__tag {
    background: var(--pink); color: var(--text); font-size: 20px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    padding: 6px 18px; border-radius: 6px 6px 0 0; margin-left: 150px; white-space: nowrap;
  }
  body.center .l3__tag, body.bottom-center .l3__tag { margin-left: 0; }
  .l3__tag:empty { display: none; }
  body.right .l3__tag, body.bottom-right .l3__tag { margin-left: 0; margin-right: 150px; }
  body.right .l3__bar, body.bottom-right .l3__bar { flex-direction: row-reverse; }
  body.right .l3__text, body.bottom-right .l3__text { padding: 0 30px 0 40px; text-align: right; }
  .l3__bar {
    display: flex; height: var(--height); width: var(--width); box-sizing: border-box;
    background: var(--purple-deep); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    border-bottom: 5px solid var(--pink);
  }
  .l3__badge {
    width: var(--height); flex: none; background: radial-gradient(circle at 50% 45%, var(--purple) 0%, var(--purple-dark) 80%);
    display: flex; align-items: center; justify-content: center;
  }
  .l3__logo { width: 96px; height: 96px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
  .l3__logo.logo-fallback { box-sizing: border-box; font-size: 28px; }
  .l3__photo { width: var(--height); flex: none; object-fit: cover; object-position: center 20%; background: var(--purple-dark); }
  .l3__text { padding: 0 40px 0 30px; display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1; }
  /* Names keep one font size: a name too long for the bar is squeezed narrower (fitText below), like TV
     sports graphics, and only made smaller once it's squeezed as far as it reads well. */
  .l3__name { font-size: 50px; line-height: 58px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; }
  .l3__name span, .l3__line span { display: inline-block; transform-origin: left center; }
  .l3__name span, .l3__line span { flex: none; }
  /* Right-aligned with flex, so a squeezed name shrinks towards the right edge instead of running off it. */
  body.right .l3__name, body.right .l3__line, body.bottom-right .l3__name, body.bottom-right .l3__line { display: flex; justify-content: flex-end; }
  body.right .l3__name span, body.right .l3__line span, body.bottom-right .l3__name span, body.bottom-right .l3__line span { transform-origin: right center; }
  /* The half-width bars use a slightly smaller name for everyone, so two people side by side match. */
  body.right .l3__name, body.bottom-right .l3__name, body.left-half .l3__name, body.bottom-left-half .l3__name { font-size: 44px; }
  .l3__line { font-size: 24px; line-height: 30px; font-weight: 700; color: var(--yellow); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .l3__line:empty { display: none; }
  .l3__bar.has-photo { width: calc(var(--width) + var(--height)); }

  /* In: the badge pops, the bar opens out from it, then the words come up. Out (?out=) runs it backwards. */
  .go .l3__badge, .go .l3__photo { animation: pop .45s cubic-bezier(.3,1.5,.5,1) both; }
  .go .l3__bar { animation: open .55s cubic-bezier(.2,.9,.2,1) .15s both; }
  .go .l3__name { animation: up .45s ease-out .45s both; }
  .go .l3__line { animation: up .45s ease-out .6s both; }
  .go .l3__tag { animation: up .4s ease-out .7s both; }
  .away .l3 { animation: leave .5s ease-in both; }
  @keyframes pop { from { scale: .4; opacity: 0; } to { scale: 1; opacity: 1; } }
  @keyframes open { from { clip-path: inset(0 calc(100% - var(--height)) 0 0 round 14px); } to { clip-path: inset(0 0 0 0 round 14px); } }
  @keyframes up { from { opacity: 0; translate: 0 18px; } to { opacity: 1; translate: 0 0; } }
  @keyframes leave { to { opacity: 0; translate: -60px 0; } }
  body.center .away .l3, body.bottom-center .away .l3 { animation-name: leave-down; }
  body.right .go .l3__bar, body.bottom-right .go .l3__bar { animation-name: open-left; }
  @keyframes open-left { from { clip-path: inset(0 0 0 calc(100% - var(--height)) round 14px); } to { clip-path: inset(0 0 0 0 round 14px); } }
  body.right .away .l3, body.bottom-right .away .l3 { animation-name: leave-right; }
  @keyframes leave-right { to { opacity: 0; translate: 60px 0; } }
  body.right .message, body.bottom-right .message { left: auto; right: var(--right); }
  @keyframes leave-down { to { opacity: 0; translate: 0 40px; } }
  .message { position: absolute; left: var(--left); bottom: var(--bottom); color: var(--text); background: var(--purple-deep); padding: 16px 24px; border-radius: 8px; font-size: 22px; }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="done.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page, introducing someone on camera:
       http://localhost:8080/lowerthird.html?name=Jane%20Smith                         an athlete: name, team and club logo
       http://localhost:8080/lowerthird.html?type=guest&name=Sam%20Lee&title=Commentator   a guest or commentator: name, title and the competition logo
       An athlete is found by name in the competition's athletes (the Athletes page), for their team and its club logo
       from the competition setup. Loads once, each time it comes on.
       Options: &team=Knights   the team, for an athlete who plays for more than one (else one in the picked game, else the first)
                &display=Chris%20Montgomery  the name to show, when it's too long (an athlete is still found by name=)
                &title=Captain  the smaller line (an athlete's goes after their team name)
                &tag=Player%20of%20the%20match  a small tab above the bar
                &photo=1        the athlete's photo (or silhouette) beside the logo
                &position=center | bottom | bottom-center | right | bottom-right | left-half | bottom-left-half
                (default: left, lined up with the scoreboard, just above it; right mirrors it for a second person on
                screen, half the width, and left-half is the left one at half width to go with it)
                &mode=light     the light mode competition logo (default dark, for the dark bar)
                &out=8          animates away after 8 seconds -->
  <div id="stage">
    <div class="l3" id="l3" hidden>
      <div class="l3__tag" id="tag"></div>
      <div class="l3__bar" id="bar">
        <div class="l3__badge" id="badge"></div>
        <img class="l3__photo" id="photo" alt="" hidden>
        <div class="l3__text" id="text">
          <div class="l3__name" id="name"></div>
          <div class="l3__line" id="line"></div>
        </div>
      </div>
    </div>
  </div>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    const type = params.get('type') === 'guest' ? 'guest' : 'athlete';
    const name = (params.get('name') || '').trim();
    const title = (params.get('title') || '').trim();
    const position = params.get('position');
    if (['center', 'bottom', 'bottom-center', 'right', 'bottom-right', 'left-half', 'bottom-left-half'].includes(position)) document.body.classList.add(position);

    // Puts the words in el, squeezed narrower to fit its width (down to `squeeze`, 0.7 is 70% of their width).
    // Only words still too wide squeezed that far get a smaller font, never below `smallest` px.
    function fitText(el, text, squeeze, smallest) {
      const span = el.appendChild(document.createElement('span'));
      span.textContent = text;
      const room = el.clientWidth;
      let size = parseInt(getComputedStyle(el).fontSize, 10);
      while (span.offsetWidth * squeeze > room && size > smallest) { size -= 2; el.style.fontSize = size + 'px'; }
      const fit = Math.min(1, room / span.offsetWidth);
      if (fit < 1) span.style.scale = `${Math.floor(fit * 1000) / 1000} 1`;
      if (fit < 1 || size < smallest + 1) window.pageLog && window.pageLog('info', `Lower third: "${text}" squeezed to ${Math.round(fit * 100)}% width at ${size}px to fit`);
    }

    function show(d) {
      const comp = params.get('mode') === 'light' ? d.competitionLogoLight || d.competitionLogoDark : d.competitionLogoDark || d.competitionLogoLight;
      const a = type === 'athlete' ? d.athlete : null;
      let lineText = '';
      const shown = (params.get('display') || '').trim() || (a ? a.name : name);
      if (a) {
        lineText = [a.team, title].filter(Boolean).join('  ·  ');
        $('badge').append(a.team ? logoEl({ name: a.team, logo: a.logo }, 'l3__logo') : logoEl({ name: d.competition, logo: comp }, 'l3__logo'));
        if (!a.known) console.warn(`Lower third: ${a.name} isn't in the competition's athletes yet, so their team isn't known (add &team=)`);
        if (params.get('photo') === '1') { $('photo').src = a.photo || a.silhouette; $('photo').hidden = false; $('bar').classList.add('has-photo'); }
      } else {
        lineText = title;
        $('badge').append(logoEl({ name: d.competition, logo: comp }, 'l3__logo'));
      }
      $('tag').textContent = params.get('tag') || '';
      $('l3').hidden = false;
      document.fonts.ready.then(() => {
        fitText($('name'), shown, 0.7, 36);
        if (lineText) fitText($('line'), lineText, 0.8, 20);
        $('stage').classList.add('go');
        window.pageLog && window.pageLog('info', `Lower third: ${type} ${shown}${lineText ? ' / ' + lineText : ''}`);
      });
      const out = Number(params.get('out'));
      if (out > 0) setTimeout(() => { $('stage').classList.replace('go', 'away'); studioDone(600); }, out * 1000);
    }

    (async () => {
      if (!name) {
        $('message').textContent = type === 'guest' ? 'Lower third: type the guest\'s name (name=)' : 'Lower third: pick an athlete (name=)';
        $('message').hidden = false;
        console.warn('Lower third: no name given');
        return;
      }
      try {
        const q = new URLSearchParams({ type, name });
        if (params.get('team')) q.set('team', params.get('team'));
        const res = await fetch('/api/lowerthird?' + q, { cache: 'no-store' });
        const d = await res.json();
        if (d.error && res.status >= 400) throw new Error(d.error);
        show(d);
      } catch (err) {
        console.warn('Lower third unavailable:', err.message);
        show({ competition: '', athlete: type === 'athlete' ? { name, team: params.get('team') || '', known: true } : null });
      }
    })();
  </script>
</body>
</html>
