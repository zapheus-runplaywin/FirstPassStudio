<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round Fixture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<style>
  /* This page's own layout. What it shares with other graphics is in graphics.css. */
  /* Round fixture */
  .fixtures { width: 1500px; }
  .fixtures__header { text-align: center; padding: 28px 40px 18px; }
  .fixtures__round { margin: 14px 0 4px; font-size: 52px; font-weight: 800; text-transform: uppercase; color: var(--yellow); letter-spacing: 0.03em; }
  .fixtures__venue { font-size: 22px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .fixtures__list { padding: 0 32px 28px; }
  .fixture {
    /* The last column mirrors the time and court on the left, so VS sits on the card's centre line under the
       heading; the away team spans it, keeping its room. */
    display: grid; grid-template-columns: 150px 170px minmax(0, 1fr) 130px minmax(0, 1fr) 336px; align-items: center;
    gap: 16px; padding: 10px 18px; border-radius: 8px; font-size: 26px; font-weight: 700;
  }
  .fixture:nth-child(odd) { background: var(--purple-deep-alt); }
  .fixture--empty { display: block; text-align: center; color: var(--muted); }
  .fixture__time { color: var(--yellow); font-weight: 800; white-space: nowrap; }
  .fixture__time--same { visibility: hidden; }
  .fixture__where { display: flex; flex-direction: column; line-height: 1.15; }
  .fixture__court { font-size: 22px; text-transform: uppercase; white-space: nowrap; }
  .fixture__round { grid-column: 1 / -1; grid-row: 1; text-align: center; font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: -10px; }
  .fixture__division { font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .fixture__team { display: flex; align-items: center; gap: 14px; min-width: 0; text-transform: uppercase; }
  .fixture__team--home { flex-direction: row-reverse; text-align: right; }
  .fixture__team--away { grid-column: 5 / 7; }
  .fixture__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* "Winner minor semi final" wraps onto two lines rather than being cut off. */
  .fixture__name--tbd { color: var(--muted); font-style: italic; white-space: normal; font-size: 0.8em; line-height: 1.1; }
  .fixture__logo { width: 58px; height: 58px; object-fit: contain; flex: none; }
  .fixture__logo.logo-fallback { font-size: 18px; border-width: 3px; box-sizing: border-box; }
  .fixture__vs {
    justify-self: center; background: var(--pink); color: var(--text); border-radius: 999px; padding: 4px 16px;
    font-size: 22px; font-weight: 800; white-space: nowrap;
  }
  .fixture__vs--score { background: var(--yellow); color: var(--text-on-yellow); font-size: 24px; }
  .message { color: var(--text); background: var(--purple-deep); padding: 16px 24px; border-radius: 8px; font-size: 22px; }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="fit.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/fixtures.html
       Shows the current round of every division, sorted by time. When divisions are on different rounds
       (one on Round 10, another on Finals Round 1), each game shows its round under its division. Loads once: it gets the latest each time it comes on.
       Options: ?division=1 (one division only)  ?round=6 (round 6, or a name like ?round=Final)
       ?round=next (the round after this one)  ?round=prev (the one before)  ?round=+2 / ?round=-1 (count from this round)
       http://localhost:8080/results.html is the same page showing only finished games with scores. -->
  <main class="card fixtures" id="card" data-fit hidden>
    <header class="fixtures__header">
      <div class="tab" id="comp"></div>
      <h1 class="fixtures__round" id="round"></h1>
      <div class="fixtures__venue" id="venue"></div>
    </header>
    <div class="fixtures__list" id="list"></div>
  </main>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script type="module" src="fixtures.js"></script>
</body>
</html>
