<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top Shooters</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<style>
  /* This page's own layout. What it shares with other graphics is in graphics.css. */
  /* Top shooters */
  .shooters { --card-width: 1400px; text-align: center; }
  .shooters__table { width: calc(100% - 64px); margin: 14px 32px 20px; border-collapse: separate; border-spacing: 0 4px; font-size: 26px; font-weight: 700; }
  .shooters__table th { font-size: 18px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 0 12px 4px; }
  .shooters__table td { padding: 4px 12px; background: var(--purple-deep-alt); }
  .shooters__table td:first-child { border-radius: 8px 0 0 8px; }
  .shooters__table td:last-child { border-radius: 0 8px 8px 0; }
  .shooters__table .left { text-align: left; }
  .shooters__rank { color: var(--yellow); font-weight: 800; width: 50px; }
  .shooters__logo { width: 44px; height: 44px; object-fit: contain; display: block; }
  .shooters__logo.logo-fallback { font-size: 16px; box-sizing: border-box; border-width: 3px; }
  .shooters__name { text-transform: uppercase; line-height: 1.15; }
  .shooters__team { font-size: 16px; line-height: 1.15; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .shooters__points { color: var(--yellow); font-weight: 800; }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="fit.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/topshooters.html
       Season shooting leaders for the division of the game picked on the scoreboard, from PlayHQ's
       stats for every finished game.
       Loads once, each time it comes on.
       Options: ?division=1  ?sort=goals or ?sort=super (default is points: goals + 2 per super shot)  ?limit=8
       Presented by the next sponsor in rotation from Major and up (Sponsors page) in the footer: ?sponsor=0 leaves it off, ?sponsor=Golds%20Bakery always that one. -->
  <main class="card shooters" id="card" data-fit hidden>
    <header class="matchup__header">
      <div class="tab">Top shooters</div>
      <div class="matchup__division" id="division"></div>
    </header>
    <table class="shooters__table">
      <thead><tr><th>#</th><th></th><th class="left">Player</th><th>Goals</th><th class="super">Super</th><th>Points</th><th>Accuracy</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="card__foot"><footer class="card__footer" id="footer"></footer><div class="card__sponsor" id="sponsor" hidden></div></div>
  </main>
  <p class="message" id="message" hidden></p>
  <script src="sponsorspot.js"></script>
  <script>sponsorSpot.footer('stats');</script>
  <script src="teams.js"></script>
  <script src="season.js"></script>
  <script>
    const sort = new URLSearchParams(location.search).get('sort') || 'points';
    loadJson('/api/topshooters', d => {
      const supers = !d.rules || d.rules.superShots !== false; // the Super column, when the competition plays super shots
      if (!supers) document.querySelector('th.super').remove();
      const list = sort === 'goals' ? d.goals : /super/.test(sort) ? d.superGoals : d.points;
      if (!list.length) throw new Error(d.error || 'No shooting stats found in the finished games yet');
      document.getElementById('division').textContent = `${d.division}  ·  ${sort === 'goals' ? 'Most goals' : /super/.test(sort) ? 'Most super shots' : 'Most points'}`;
      const body = document.getElementById('rows');
      list.forEach((p, i) => {
        const tr = el('tr');
        const who = el('td', 'left');
        who.append(el('div', 'shooters__name', p.name), el('div', 'shooters__team', p.team));
        const made = p.goals + p.superGoals, tried = p.shots;
        const logo = el('td'); logo.append(logoEl({ name: p.team, logo: p.logo }, 'shooters__logo'));
        tr.append(...[el('td', 'shooters__rank', i + 1), logo, who, el('td', '', p.goals), supers && el('td', '', p.superGoals),
          el('td', 'shooters__points', p.points), el('td', '', tried ? `${Math.round(made / tried * 100)}%` : '–')].filter(Boolean));
        body.append(tr);
      });
      document.getElementById('footer').textContent = `From ${d.gamesRead} of ${d.gamesFinished} finished games`;
      document.getElementById('card').hidden = false;
    });
  </script>
</body>
</html>
