<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score Ticker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<script src="log.js"></script>
</head>
<body class="lower">
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/ticker.html
       Scrolling scores from the other games in this round (leaves out the game on the scoreboard).
       Like the scoreboard, it updates its scores itself every 30 seconds.
       Speed: set on the control page (Ticker speed) or the Stream Deck (/deck/ticker/faster, slower);
       a change shows within a few seconds, carrying on from where the scroll is.
       Options: ?refresh=60 (seconds; 0 = load once)  ?speed=120 (pixels per second; fixes the speed for this link only) -->
  <div class="ticker" id="ticker" hidden>
    <div class="ticker__label">Around the courts</div>
    <div class="ticker__window"><div class="ticker__track" id="track"></div></div>
  </div>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script src="season.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const refresh = params.has('refresh') ? Number(params.get('refresh')) : 30;
    const fixedSpeed = Number(params.get('speed')) > 0 ? Number(params.get('speed')) : null; // ?speed= wins over the control page
    let speed = fixedSpeed || 120;
    const track = document.getElementById('track');
    let pending = null, half = 0;

    const duration = () => Math.max(1, half / speed);
    // Change the speed mid-scroll, carrying on from the same place instead of jumping.
    function setSpeed(next, why) {
      if (!(next > 0) || next === speed) return;
      const anim = track.getAnimations()[0], before = duration() * 1000;
      const at = anim && anim.currentTime !== null ? (anim.currentTime % before) / before : 0;
      speed = next;
      track.style.animationDuration = `${duration()}s`;
      getComputedStyle(track).animationDuration; // apply the new length before moving to the same place in it
      if (anim) anim.currentTime = at * duration() * 1000;
      if (window.pageLog) pageLog('info', `Ticker speed ${speed} pixels per second (${why})`);
    }

    function items(games) {
      const frag = document.createDocumentFragment();
      if (!games.length) frag.append(el('span', 'ticker__item', 'Scores from the other courts will appear here'));
      for (const g of games) {
        const it = el('span', 'ticker__item');
        it.append(el('span', 'ticker__div', g.division.replace(/division/i, 'Div')),
          el('span', 'ticker__team', g.home.name), el('span', 'ticker__score', `${g.home.score ?? 0} – ${g.away.score ?? 0}`),
          el('span', 'ticker__team', g.away.name), el('span', 'ticker__state' + (g.live ? ' is-live' : ''), g.live ? 'Live' : g.finished ? 'FT' : ''));
        frag.append(it);
      }
      return frag;
    }
    function show(games) {
      // Two copies side by side so the scroll loops without a gap.
      track.replaceChildren(items(games), items(games));
      half = track.scrollWidth / 2;
      track.style.setProperty('--shift', `-${half}px`);
      track.style.animationDuration = `${duration()}s`;
    }
    track.addEventListener('animationiteration', () => { if (pending) { show(pending); pending = null; } });
    async function load(first) {
      try {
        const d = await (await fetch('/api/ticker', { cache: 'no-store' })).json();
        if (d.error) throw new Error(d.error);
        if (first) {
          if (!fixedSpeed && d.speed > 0) speed = d.speed;
          // Unhide first: a hidden ticker has no width, which left the scroll distance at 0.
          document.getElementById('ticker').hidden = false;
          show(d.games);
          document.fonts.ready.then(() => show(d.games)); // re-measure once the font has loaded
        } else pending = d.games;
      } catch (err) { console.warn('Ticker unavailable:', err.message); }
    }
    load(true);
    if (refresh > 0) setInterval(load, Math.max(10, refresh) * 1000);
    // Follow the control page's speed (asks the helper only; PlayHQ is not asked). ?speed= turns this off.
    if (!fixedSpeed) setInterval(async () => {
      try { setSpeed((await (await fetch('/api/ticker/speed', { cache: 'no-store' })).json()).speed, 'control page'); } catch { /* helper restarting */ }
    }, 3000);
  </script>
</body>
</html>
