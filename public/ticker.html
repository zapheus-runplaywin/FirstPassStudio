<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score Ticker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<style>
  /* This page's own layout. What it shares with other graphics is in graphics.css. */
  /* Score ticker */
  .ticker {
    display: flex; width: 1920px; height: 48px; background: var(--purple-deep); border-top: 4px solid var(--pink);
    font-size: 19px; font-weight: 700; text-transform: uppercase; overflow: hidden;
  }
  body.lower:has(.ticker) { padding-bottom: 0; }
  .ticker__label {
    flex: none; display: flex; align-items: center; padding: 0 22px; background: var(--yellow); color: var(--text-on-yellow);
    font-weight: 800; letter-spacing: .06em; z-index: 1; box-shadow: 8px 0 16px rgba(0,0,0,.35);
  }
  .ticker__window { flex: 1; overflow: hidden; display: flex; align-items: center; }
  .ticker__track { display: flex; white-space: nowrap; animation: ticker linear infinite; will-change: transform; }
  .ticker__item { display: inline-flex; align-items: center; gap: 10px; padding: 0 30px; border-right: 2px solid var(--purple); }
  .ticker__div { font-size: 14px; color: var(--muted); letter-spacing: .08em; }
  .ticker__score { color: var(--yellow); font-weight: 800; }
  .ticker__state { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--purple); }
  .ticker__state:empty { display: none; }
  .ticker__state.is-live { background: var(--pink); }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(var(--shift)); } }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
</head>
<body class="lower">
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/ticker.html
       Scrolling scores from the other games in this round (leaves out the game on the scoreboard).
       Like the scoreboard, it updates its scores itself every 30 seconds.
       Speed: set on the control page (Ticker speed) or the Stream Deck (/deck/ticker/faster, slower);
       a change shows within a few seconds, carrying on from where the scroll is.
       Options: ?refresh=60 (seconds; 0 = load once)  ?speed=120 (pixels per second; fixes the speed for this link only)
       A sponsor slot goes round with the scores: the next sponsor in rotation from Partner and up (Sponsors page),
       a new one each time the scores update. ?sponsor=0 leaves it out, ?sponsor=Golds%20Bakery always that one. -->
  <div class="ticker" id="ticker" hidden>
    <div class="ticker__label">Around the courts</div>
    <div class="ticker__window"><div class="ticker__track" id="track"></div></div>
  </div>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script src="season.js"></script>
  <script src="sponsorspot.js"></script>
  <script type="module" src="ticker.js"></script>
</body>
</html>
