<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commentators</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="lowerthird.css">
<style>
  /* Laid out for 1920 x 1080 at 1x, on whole pixels. Two looks for the people on the mic:
     the line (default): a thin single-line lower third, the label in a pink tab and the names beside it on one line.
       Its left edge lines up with the scoreboard's (293px, like the person lower third) and its bottom sits 8px above
       the scoreboard's PlayHQ Live tab (top 930px).
     the box (?style=box): an upper third, a box with the label and each name on a line of its own. By default it sits
       in the top right corner beside the competition logo (branding.html puts it 1280px from the left, centred 95px from
       the top), smaller than under the title and centred on the logo's height, with clear space between the two (it
       starts 60px past the widest the logo usually is, about 1400px) and 80px to spare on the right. ?position=under-left and under-right line it up
       with the scoreboard's edges just under the title banner and the logos (their bottom edges are at about 162px), and
       center centres it there; away from the competition logo the box shows it in a badge of its own.
     the lower thirds (?style=lowerthirds): the person lower third's bar (lowerthird.css) for each commentator, side by
       side across the scoreboard's width (293px from the left, 292px from the right): one person gets the full 900px bar
       on the left, two get 660px bars on the left and right (the right one mirrored), like two lowerthird.html sources,
       and three share the width equally. They sit low, 80px from the bottom, for when the scoreboard is off;
       ?position=above puts them 8px above the scoreboard's PlayHQ Live tab. */
  :root { --left: 293px; --right: 292px; --bottom: 158px; --top: 190px; --corner: 80px; --corner-top: 36px; }
  html, body { margin: 0; background: transparent; }
  body { font-family: var(--font); color: var(--text); width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  [hidden] { display: none !important; }
  body.bottom, body.bottom-center { --bottom: 80px; }

  /* The line. */
  .line { position: absolute; left: var(--left); bottom: var(--bottom); display: flex; align-items: stretch; height: 56px; max-width: 1335px;
    border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  body.center .line, body.bottom-center .line { left: 50%; transform: translateX(-50%); transform: translateX(round(-50%, 1px)); }
  .line__label { flex: none; display: flex; align-items: center; background: var(--pink); color: var(--text); padding: 0 22px;
    font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .line__label:empty { display: none; }
  .line__names { display: flex; align-items: center; min-width: 0; background: var(--purple-deep); padding: 0 28px;
    font-size: 30px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; overflow: hidden; }
  .line__names span, .box__name span { display: inline-block; transform-origin: left center; flex: none; }
  .and { color: var(--yellow); font-weight: 600; }

  /* The box. */
  .box { position: absolute; top: var(--corner-top); right: var(--corner); width: 380px; display: flex; flex-direction: column;
    border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45); background: var(--purple-deep); border-bottom: 5px solid var(--pink); }
  body.under-left .box, body.under-right .box, body.center .box { top: var(--top); width: 560px; }
  body.under-left .box { right: auto; left: var(--left); }
  body.under-right .box { right: var(--right); }
  body.center .box { right: auto; left: 50%; transform: translateX(-50%); transform: translateX(round(-50%, 1px)); }
  /* In the corner it is smaller, so it sits beside the logo rather than outweighing it. */
  body.corner .box { border-radius: 12px; border-bottom-width: 4px; }
  body.corner .box__label { padding: 7px 18px; font-size: 15px; }
  body.corner .box__body { padding: 12px 18px 14px; }
  body.corner .box__names { gap: 2px; }
  body.corner .box__name { font-size: 26px; line-height: 32px; }
  .box__label span { display: inline-block; transform-origin: left center; }
  .box__label { background: var(--pink); padding: 10px 24px; font-size: 20px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .box__label:empty { display: none; }
  .box__body { display: flex; align-items: center; gap: 22px; padding: 20px 26px 22px; }
  .box__badge { flex: none; width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, var(--purple) 0%, var(--purple-dark) 80%); }
  .box__badge:empty { display: none; }
  .box__logo { width: 76px; height: 76px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
  .box__logo.logo-fallback { box-sizing: border-box; font-size: 22px; }
  .box__names { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  /* Long names keep one size and are squeezed narrower to fit (fitText below), like the person lower third. */
  .box__name { font-size: 36px; line-height: 44px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; }

  /* In: the line opens out from its label and the names come up; the box drops in and its names follow.
     Out (?out=) fades it away. */
  .go .line { animation: open .5s cubic-bezier(.2,.9,.2,1) both; }
  .go .line__names > span { animation: up .4s ease-out .35s both; }
  .go .box { animation: drop .5s cubic-bezier(.2,.9,.2,1) both; }
  .go .box__badge { animation: pop .45s cubic-bezier(.3,1.5,.5,1) .25s both; }
  .go .box__name { animation: up .4s ease-out both; }
  .go .box__name:nth-child(1) { animation-delay: .35s; } .go .box__name:nth-child(2) { animation-delay: .47s; }
  .go .box__name:nth-child(3) { animation-delay: .59s; } .go .box__name:nth-child(4) { animation-delay: .71s; }
  .away .line, .away .box, .away .thirds { animation: leave .5s ease-in both; }
  body.box-style:not(.under-left):not(.center) .away .box { animation-name: leave-right; }
  @keyframes open { from { clip-path: inset(0 100% 0 0 round 10px); } to { clip-path: inset(0 0 0 0 round 10px); } }
  @keyframes drop { from { opacity: 0; translate: 0 -40px; } to { opacity: 1; translate: 0 0; } }
  @keyframes pop { from { scale: .4; opacity: 0; } to { scale: 1; opacity: 1; } }
  @keyframes up { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
  @keyframes leave { to { opacity: 0; translate: -60px 0; } }
  @keyframes leave-right { to { opacity: 0; translate: 60px 0; } }
  /* The lower thirds. */
  body.lowerthirds-style { --bottom: 80px; }
  body.lowerthirds-style.above { --bottom: 158px; }
  .thirds { position: absolute; left: var(--left); right: var(--right); bottom: var(--bottom); display: flex; gap: 15px; align-items: flex-end; }
  .thirds.two { justify-content: space-between; --width: 660px; }
  .thirds.two .l3__name { font-size: 44px; }
  .thirds.three { --width: 435px; --height: 110px; }
  .thirds.three .l3__name { font-size: 34px; line-height: 42px; }
  .thirds.three .l3__line { font-size: 19px; line-height: 26px; }
  .thirds.three .l3__text { padding: 0 20px 0 22px; }
  .thirds.three .l3__logo { width: 84px; height: 84px; }
  .thirds.three .l3__tag { font-size: 16px; padding: 5px 14px; margin-left: 130px; }

  .message { position: absolute; left: var(--left); bottom: var(--bottom); color: var(--text); background: var(--purple-deep); padding: 16px 24px; border-radius: 8px; font-size: 22px; }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="done.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page, naming the commentators:
       http://localhost:8080/commentators.html?label=Special%20guest%20commentators&name=Honey%20Harrington&name2=Will%20Linter
         a thin single-line lower third: SPECIAL GUEST COMMENTATORS  Honey Harrington and Will Linter
       http://localhost:8080/commentators.html?style=box&name=Honey%20Harrington&name2=Will%20Linter
         an upper third: a box in the top right corner beside the competition logo, with the label and a line per name
       http://localhost:8080/commentators.html?style=lowerthirds&photo=1
         a person lower third for each commentator, side by side, with their headshots from the Production Planner
       Options: &name= &name2= &name3= &name4=  up to four people (empty ones are left out). With none, the people the
                                Production Planner (planner.html) has on the mic for the game on the scoreboard
                &label=Commentators   the words in the pink tab (default Commentators, Commentator for one name, or Special
                                guest commentators when every planned name is a special guest; 0 leaves it off). In the
                                lower thirds it is the tab over every bar; without it, a special guest from the Production
                                Planner gets a Special guest tab
                &position=center | bottom | bottom-center   for the line (default: left, lined up with the scoreboard, just above it)
                &position=under-left | under-right | center   for the box (default: the top right corner, beside the
                                competition logo; these put it just under the title, with the competition logo in it)
                &position=above for the lower thirds (default: low, for when the scoreboard is off; this puts them
                                just above the scoreboard)
                &title=Commentator  the yellow line under each name in the lower thirds (default Commentator; 0 leaves it off)
                &photo=1        each commentator's headshot from the Production Planner in their lower third, in place of
                                the competition logo (anyone without one keeps the logo)
                &logo=1 | 0     the competition logo in the box, or not (default: only away from the corner)
                &mode=light     the light mode competition logo (default dark, for the dark box)
                &out=8          animates away after 8 seconds
       Loads once, each time it comes on. -->
  <div id="stage">
    <div class="line" id="line" hidden>
      <div class="line__label" id="lineLabel"></div>
      <div class="line__names" id="lineNames"></div>
    </div>
    <div class="thirds" id="thirds" hidden></div>
    <div class="box" id="box" hidden>
      <div class="box__label" id="boxLabel"></div>
      <div class="box__body">
        <div class="box__badge" id="badge"></div>
        <div class="box__names" id="boxNames"></div>
      </div>
    </div>
  </div>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    const style = ['box', 'lowerthirds'].includes(params.get('style')) ? params.get('style') : 'line';
    document.body.classList.add(style + '-style');
    // The names typed in its options, else whoever the Production Planner has on the mic for the game on the
    // scoreboard (see the start, below).
    let names = ['name', 'name2', 'name3', 'name4'].map(k => (params.get(k) || '').trim()).filter(Boolean);
    // The same people as { name, guest, headshot }: only the Production Planner knows who is a guest and has their headshot.
    let people = names.map(name => ({ name }));
    const rawLabel = params.get('label');
    let label = '';
    // The label typed in, else Commentator(s), or Special guest commentator(s) when every planned name is a special guest.
    const labelFor = guest => rawLabel === '0' ? '' : (rawLabel || '').trim()
      || `${guest ? 'Special guest commentator' : 'Commentator'}${names.length === 1 ? '' : 's'}`;
    const position = params.get('position');
    const places = { box: ['under-left', 'under-right', 'center'], lowerthirds: ['above'] }[style] || ['center', 'bottom', 'bottom-center'];
    if (places.includes(position)) document.body.classList.add(position);
    else if (style === 'box') document.body.classList.add('corner');

    // Squeezes the words in el narrower to fit its width (down to `squeeze`, 0.7 is 70% of their width), and only
    // then makes their font smaller, never below `smallest` px. el holds one span (the words).
    function fitText(el, squeeze, smallest) {
      const span = el.firstElementChild;
      const room = el.clientWidth - parseFloat(getComputedStyle(el).paddingLeft) - parseFloat(getComputedStyle(el).paddingRight);
      let size = parseInt(getComputedStyle(el).fontSize, 10);
      while (span.offsetWidth * squeeze > room && size > smallest) { size -= 2; el.style.fontSize = size + 'px'; }
      const fit = Math.min(1, room / span.offsetWidth);
      if (fit < 1) span.style.scale = `${Math.floor(fit * 1000) / 1000} 1`;
      if (fit < 1 || size < smallest + 1) window.pageLog && window.pageLog('info', `Commentators: "${span.textContent}" squeezed to ${Math.round(fit * 100)}% width at ${size}px to fit`);
    }

    // "Honey Harrington and Will Linter", "A, B and C", with the "and" in yellow.
    function joined(list) {
      const span = document.createElement('span');
      list.forEach((n, i) => {
        if (i) {
          const and = span.appendChild(document.createElement('span'));
          and.className = 'and';
          and.textContent = i === list.length - 1 ? ' and ' : ', ';
          and.style.whiteSpace = 'pre';
        }
        span.append(n);
      });
      return span;
    }

    // A lower third for each person (up to three), side by side: the full bar for one, half width left and right for two,
    // a third each for three. The pink tab is the label typed in, else Special guest for a planned special guest; the
    // yellow line is ?title= (Commentator); with ?photo=1 a headshot takes the logo's place.
    function showThirds(comp, competition) {
      const shown = people.slice(0, 3);
      if (people.length > 3) console.warn(`Commentators: the lower thirds fit three people, so ${people.slice(3).map(x => x.name).join(', ')} is left out`);
      const tab = rawLabel === '0' ? null : (rawLabel || '').trim();
      const rawTitle = params.get('title');
      const title = rawTitle === '0' ? '' : (rawTitle || '').trim() || 'Commentator';
      const photos = params.get('photo') === '1';
      $('thirds').classList.add(['one', 'two', 'three'][shown.length - 1]);
      shown.forEach((x, i) => {
        const l3 = $('thirds').appendChild(document.createElement('div'));
        l3.className = 'l3' + (shown.length === 2 && i === 1 ? ' l3--right' : '');
        l3.style.setProperty('--delay', (i * 0.2) + 's');
        l3.innerHTML = '<div class="l3__tag"></div><div class="l3__bar"><div class="l3__badge"></div><div class="l3__text"><div class="l3__name"></div><div class="l3__line"></div></div></div>';
        l3.querySelector('.l3__tag').textContent = tab === null ? '' : tab || (x.guest ? 'Special guest' : '');
        const badge = l3.querySelector('.l3__badge');
        if (photos && x.headshot) {
          const img = document.createElement('img');
          img.className = 'l3__photo';
          img.alt = '';
          img.src = x.headshot;
          badge.replaceWith(img);
        } else badge.append(logoEl({ name: competition, logo: comp }, 'l3__logo'));
        l3.querySelector('.l3__name').appendChild(document.createElement('span')).textContent = x.name;
        if (title) l3.querySelector('.l3__line').appendChild(document.createElement('span')).textContent = title;
      });
      $('thirds').hidden = false;
    }

    function show(d) {
      const comp = params.get('mode') === 'light' ? d.competitionLogoLight || d.competitionLogoDark : d.competitionLogoDark || d.competitionLogoLight;
      if (style === 'lowerthirds') showThirds(comp, d.competition);
      else if (style === 'line') {
        $('lineLabel').textContent = label;
        $('lineNames').append(joined(names));
        $('line').hidden = false;
      } else {
        if (label) $('boxLabel').appendChild(document.createElement('span')).textContent = label;
        // In the corner the competition logo is right beside the box, so the box doesn't repeat it unless asked to.
        const withLogo = params.get('logo') ? params.get('logo') !== '0' : places.includes(position);
        if (withLogo) {
          if (comp || d.competition) $('badge').append(logoEl({ name: d.competition, logo: comp }, 'box__logo'));
        }
        for (const n of names) {
          const row = $('boxNames').appendChild(document.createElement('div'));
          row.className = 'box__name';
          row.appendChild(document.createElement('span')).textContent = n;
        }
        $('box').hidden = false;
      }
      document.fonts.ready.then(() => {
        if (style === 'lowerthirds') {
          document.querySelectorAll('.l3__name').forEach(el => fitText(el, 0.7, Math.round(parseInt(getComputedStyle(el).fontSize, 10) * 0.75)));
          document.querySelectorAll('.l3__line:not(:empty)').forEach(el => fitText(el, 0.8, 16));
        } else if (style === 'line') fitText($('lineNames'), 0.75, 24);
        else document.querySelectorAll('.box__name, .box__label:not(:empty)').forEach(el => fitText(el, 0.7, el.classList.contains('box__label') ? 12 : 20));
        $('stage').classList.add('go');
        window.pageLog && window.pageLog('info', `Commentators (${style}): ${label ? label + ': ' : ''}${names.join(', ')}`);
      });
      const out = Number(params.get('out'));
      if (out > 0) setTimeout(() => { $('stage').classList.replace('go', 'away'); studioDone(600); }, out * 1000);
    }

    (async () => {
      let guest = false;
      if (!names.length) {
        try {
          const on = await (await fetch('/api/planner/onair', { cache: 'no-store' })).json();
          people = (on.people || []).slice(0, 4);
          names = people.map(x => x.name);
          guest = !!on.guest;
          if (names.length) window.pageLog && window.pageLog('info', `Commentators: from the Production Planner for ${on.game}`);
        } catch (err) { console.warn('Commentators: the Production Planner is unavailable:', err.message); }
      }
      label = labelFor(guest);
      if (!names.length) {
        $('message').textContent = 'Commentators: nobody is planned on the mic for this game in the Production Planner. Plan them there, or type their names (name=, name2=)';
        $('message').hidden = false;
        console.warn('Commentators: no names given');
        return;
      }
      if (style === 'line') return show({});
      try {
        const res = await fetch('/api/lowerthird?type=guest', { cache: 'no-store' });
        const d = await res.json();
        if (d.error && res.status >= 400) throw new Error(d.error);
        show(d);
      } catch (err) {
        console.warn('Commentators: competition logo unavailable:', err.message);
        show({ competition: '' });
      }
    })();
  </script>
</body>
</html>
