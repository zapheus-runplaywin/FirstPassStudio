<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commentary Roster</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<style>
  /* This page's own layout. What it shares with other graphics is in graphics.css. */
  /* The commentary roster: the whole 1920 x 1080 frame, for a monitor backstage or at the commentary desk rather than
     the stream. A slim header with the night, then a tile per game on the planned court, filling the frame: 1 to 2
     side by side, 3 in a row, 4 as 2 x 2, 5 to 6 as 3 x 2, 7 to 8 as 4 x 2. Each tile has the time and its state, the
     teams with the score between them, and who is on the mic. --s sizes everything in a tile: it starts from the count
     and is made smaller until every tile fits (long names, three commentators). */
  body { padding: 40px 56px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 24px;
    background: radial-gradient(circle at 50% 25%, var(--purple-dark-light, #3b1a52), var(--purple-dark, #1e0b2b) 75%); }
  body.see-through { background: transparent; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .head__left { display: flex; align-items: center; gap: 24px; min-width: 0; }
  .head__title { margin: 0; font-size: 52px; font-weight: 800; line-height: 1; text-transform: uppercase; color: var(--yellow); letter-spacing: .02em; white-space: nowrap; }
  .head__when { text-align: right; font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; line-height: 1.2; white-space: nowrap; }
  .head__when small { display: block; font-size: 20px; color: var(--muted); letter-spacing: .1em; }
  .tiles { --s: 1; flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(0, 1fr); gap: calc(24px * var(--s)); }
  .tile { min-width: 0; min-height: 0; overflow: hidden; background: var(--purple-deep); border-radius: calc(20px * var(--s)); border: calc(4px * var(--s)) solid transparent;
    padding: calc(26px * var(--s)) calc(32px * var(--s)); display: flex; flex-direction: column; gap: calc(14px * var(--s)); box-sizing: border-box; container-type: size; }
  .tile.now { border-color: var(--pink); background: var(--purple-deep-alt); box-shadow: 0 0 0 calc(4px * var(--s)) rgba(230,0,126,.35), 0 0 calc(48px * var(--s)) rgba(230,0,126,.45); }
  /* Done: greyed, but the winner keeps its yellow so the result still reads. */
  .tile.done { background: rgba(255,255,255,.06); }
  .tile.done > *:not(.match), .tile.done .match > *:not(.win) { filter: grayscale(1); opacity: .5; }
  .tile.done .win .logo, .tile.done .win .logo-fallback { filter: grayscale(1); opacity: .5; }
  .tile__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .time { font-size: calc(44px * var(--s)); font-weight: 800; color: var(--yellow); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .time small { font-size: calc(22px * var(--s)); margin-left: calc(6px * var(--s)); color: var(--muted); }
  .badge { font-size: calc(22px * var(--s)); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: calc(8px * var(--s)) calc(18px * var(--s));
    border-radius: 999px; background: rgba(255,255,255,.12); white-space: nowrap; }
  .now .badge { background: var(--pink); }
  .badge.live::before { content: ''; display: inline-block; width: .65em; height: .65em; border-radius: 50%; background: var(--text); margin-right: .45em; vertical-align: .05em; }
  .match { margin-top: auto; display: grid; grid-template-columns: minmax(min-content, 1fr) auto minmax(min-content, 1fr); align-items: center; gap: calc(16px * var(--s)); }
  .team { display: flex; flex-direction: column; align-items: center; gap: calc(12px * var(--s)); text-align: center; min-width: 0; }
  .team .logo { width: calc(130px * var(--s)); height: calc(130px * var(--s)); object-fit: contain; }
  .team .logo.logo-fallback { font-size: calc(52px * var(--s)); border-width: calc(4px * var(--s)); box-sizing: border-box; }
  .team b { font-size: calc(34px * var(--s)); text-transform: uppercase; line-height: 1.05; overflow-wrap: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .team.win b, .team.win small { color: var(--yellow); }
  .team small { font-size: calc(18px * var(--s)); font-weight: 800; letter-spacing: .16em; text-transform: uppercase; margin-top: calc(-6px * var(--s)); }
  .score { font-size: calc(96px * var(--s)); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; text-align: center; white-space: nowrap; }
  .score small { display: block; font-size: calc(22px * var(--s)); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: calc(8px * var(--s)); }
  /* A tile taller than it is wide (3 or more across) puts the score under the teams, so it doesn't squeeze them. */
  @container (aspect-ratio < 1.1) {
    .match { grid-template-columns: minmax(min-content, 1fr) minmax(min-content, 1fr); row-gap: calc(10px * var(--s)); }
    .match .score { grid-row: 2; grid-column: 1 / -1; }
    .match .vs { display: none; }
  }
  .vs { font-size: calc(40px * var(--s)); font-weight: 800; color: var(--pink); }
  .meta { text-align: center; font-size: calc(20px * var(--s)); font-weight: 700; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .mic { margin-bottom: auto; display: flex; flex-wrap: wrap; gap: calc(12px * var(--s)); justify-content: center; }
  .person { background: rgba(255,255,255,.12); border-radius: 999px; padding: calc(10px * var(--s)) calc(24px * var(--s)); font-size: calc(32px * var(--s)); font-weight: 800; white-space: nowrap; }
  .person.guest { background: var(--pink); }
  .person.guest::after { content: 'Guest'; margin-left: .3em; font-size: .5em; letter-spacing: .12em; text-transform: uppercase; vertical-align: .3em; }
  .nobody { color: var(--muted); font-size: calc(24px * var(--s)); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: calc(10px * var(--s)) 0; }
  .message { color: var(--text); background: var(--purple-deep); padding: 16px 24px; border-radius: 8px; font-size: 26px; align-self: flex-start; }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="sceneevents.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page, for a monitor backstage or at the commentary desk (not the stream): fills the
       whole frame with the night's commentary team from the Production Planner (planner.html).
       http://localhost:8080/roster.html
       Tonight is the game night picked on Scoreboard control, else today, else the next game night. A tile per game on
       the night's planned court: the time, the teams, and who is on the mic (special guests marked), up to 8. The game on
       the scoreboard is lit up: LIVE with its score and quarter once it has started, FULL TIME with the result. When the
       scoreboard moves on, the game before it greys out with its final score and the winner in yellow; games before that
       drop off. It follows the scoreboard live, and reads the plan again every minute so a swap in the Planner shows
       (from Studio only, never PlayHQ).
       Options: ?date=2026-11-04 (another night)  ?title=Tonight's%20commentators (the heading)  ?bg=0 (see-through)
                ?refresh=0 (loads once) -->
  <header class="head" id="head" hidden>
    <div class="head__left">
      <div class="tab" id="comp"></div>
      <h1 class="head__title" id="title"></h1>
    </div>
    <div class="head__when" id="when"></div>
  </header>
  <div class="tiles" id="tiles"></div>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    if (params.get('bg') === '0') document.body.classList.add('see-through');
    const refresh = params.get('refresh') !== '0';
    const MAX = 8;
    // Columns for each number of tiles, and how big a tile's contents are.
    const COLS = [1, 1, 2, 3, 2, 3, 3, 4, 4];
    const SIZE = [1, 1.8, 1.5, 1.15, 1.1, 0.9, 0.9, 0.75, 0.75];

    function clock(time) {
      const [h, m] = String(time || '').split(':').map(Number);
      return Number.isFinite(h) ? `${(h % 12) || 12}:${String(m || 0).padStart(2, '0')}` : (time || 'TBC');
    }
    const ampm = time => (Number(String(time).split(':')[0]) < 12 ? 'AM' : 'PM');

    // The tiles shown: one game at most from before the one on the scoreboard (the last one done), then up to 8.
    function shown(slots) {
      let first = 0;
      slots.forEach((s, i) => { if (s.state === 'done') first = i; });
      if (!slots.some(s => s.state === 'done')) first = 0;
      return slots.slice(first, first + MAX);
    }

    function badge(s, next) {
      if (s.state === 'done') return ['Full time', ''];
      if (s.state === 'now') return s.final ? ['Full time', ''] : s.live ? ['Live', 'live'] : ['On next', ''];
      return [s === next ? 'Up next' : 'Later', ''];
    }

    function tile(s, next) {
      const t = el('div', `tile ${s.state}`);
      t.dataset.id = s.id;
      const top = t.appendChild(el('div', 'tile__top'));
      const time = top.appendChild(el('div', 'time', clock(s.time)));
      time.append(el('small', '', ampm(s.time)));
      const [text, cls] = badge(s, next);
      top.append(el('div', `badge ${cls}`.trim(), text));
      const match = t.appendChild(el('div', 'match'));
      const team = (side) => {
        const d = el('div', `team${s.winner === side ? ' win' : ''}`);
        d.append(logoEl(s[side], 'logo'), el('b', '', s[side].name));
        if (s.winner === side) d.append(el('small', '', 'Win'));
        return d;
      };
      match.append(team('home'));
      if (s.score) {
        const sc = el('div', 'score', `${s.score.home}\u2013${s.score.away}`);
        sc.append(el('small', '', s.live ? s.period || 'Live' : s.winner === 'draw' ? 'Draw' : 'Final'));
        match.append(sc);
      } else match.append(el('div', 'vs', 'v'));
      match.append(team('away'));
      t.append(el('div', 'meta', [s.division, s.round].filter(Boolean).join('  ·  ')));
      const mic = t.appendChild(el('div', 'mic'));
      if (s.people.length) for (const p of s.people) mic.append(el('span', `person${p.guest ? ' guest' : ''}`, p.name));
      else mic.append(el('span', 'nobody', 'Nobody planned'));
      return t;
    }

    function draw(d) {
      $('comp').textContent = d.competition || '';
      $('title').textContent = params.get('title') || (d.today ? "Tonight's commentators" : 'Commentators');
      const day = new Date(`${d.date}T00:00:00`);
      $('when').replaceChildren(day.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' }),
        el('small', '', [d.court, d.venue].filter(Boolean).join('  ·  ')));
      $('head').hidden = false;
      const list = shown(d.slots);
      const next = list.find(s => s.state === 'next');
      const tiles = $('tiles');
      const n = Math.max(1, list.length);
      tiles.style.gridTemplateColumns = `repeat(${COLS[n]}, minmax(0, 1fr))`;
      tiles.style.setProperty('--s', SIZE[n]);
      tiles.replaceChildren(...list.map(s => tile(s, next)));
      if (!list.length) tiles.append(el('p', 'message', `No games on ${d.court} that night.`));
      // Smaller until nothing in a tile is cut off or squeezed.
      const over = () => [...tiles.children].some(t => t.scrollHeight > t.clientHeight + 1 || [...t.querySelectorAll('.match, .tile__top')].some(m => m.scrollWidth > m.clientWidth + 1));
      for (let size = SIZE[n]; size > 0.4 && over(); size -= 0.05) tiles.style.setProperty('--s', size.toFixed(2));
    }

    let last = '';
    async function load() {
      try {
        const q = new URLSearchParams();
        if (params.get('date')) q.set('date', params.get('date'));
        const d = await (await fetch(`/api/planner/roster?${q}`, { cache: 'no-store' })).json();
        if (d.error && !d.court) throw new Error(d.error);
        $('message').hidden = true;
        const json = JSON.stringify(d);
        if (json === last) return;
        last = json;
        draw(d);
        window.pageLog && window.pageLog('info', `Commentary roster: ${d.date} on ${d.court}, ${d.slots.length} games`);
      } catch (err) {
        console.warn('Commentary roster unavailable:', err.message);
        $('message').textContent = `Commentary roster: ${err.message}`;
        $('message').hidden = false;
      }
    }

    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
      load();
      if (!refresh) return;
      // The scoreboard moves on through the night: a new game, a goal or a new quarter shows straight away
      // (a goal at most once a second).
      let key, timer;
      sceneEvents(null, { board: b => {
        const k = `${b.gameId}|${b.home && b.home.score}|${b.away && b.away.score}|${b.period}|${!!(b.clock && b.clock.running)}`;
        if (key !== undefined && k !== key && !timer) timer = setTimeout(() => { timer = null; load(); }, 1000);
        key = k;
      } });
      setInterval(load, 60000);
    });
  </script>
</body>
</html>
