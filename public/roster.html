<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commentary Roster</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<style>
  /* This page's own layout. What it shares with other graphics is in graphics.css. */
  /* The commentary roster: the whole 1920 x 1080 frame, for a monitor backstage or at the commentary desk rather than
     the stream. A header with the night, then a row per game on the planned court: the time, the teams, and who is on
     the mic. The game on the scoreboard now is lit up; games before it are dimmed. */
  body { padding: 48px 72px; display: flex; flex-direction: column; gap: 28px;
    background: radial-gradient(circle at 50% 25%, var(--purple-dark-light, #3b1a52), var(--purple-dark, #1e0b2b) 75%); }
  body.see-through { background: transparent; }
  .head, .rows { align-self: stretch; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
  .head__title { margin: 12px 0 0; font-size: 64px; font-weight: 800; line-height: 1; text-transform: uppercase; color: var(--yellow); letter-spacing: .02em; }
  .head__when { text-align: right; font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; line-height: 1.25; }
  .head__when small { display: block; font-size: 22px; color: var(--muted); letter-spacing: .1em; }
  .rows { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; transform-origin: top center; }
  .row { display: grid; grid-template-columns: 170px minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 28px;
    background: var(--purple-deep); border-radius: 16px; padding: 18px 28px; border-left: 10px solid transparent; }
  .row.past { opacity: .45; }
  .row.now { border-left-color: var(--pink); background: var(--purple-deep-alt); box-shadow: 0 0 0 3px var(--pink), 0 12px 32px rgba(0,0,0,.4); }
  .row__time { font-size: 40px; font-weight: 800; color: var(--yellow); white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1; }
  .row__time small { display: block; margin-top: 8px; font-size: 16px; color: var(--muted); letter-spacing: .12em; }
  .row.now .row__time small { text-transform: uppercase; color: var(--text); background: var(--pink); border-radius: 999px; padding: 4px 12px; width: max-content; }
  .row__game { display: flex; align-items: center; gap: 14px; min-width: 0; font-size: 30px; font-weight: 800; text-transform: uppercase; }
  .row__game .logo { width: 64px; height: 64px; object-fit: contain; flex: none; }
  .row__game .logo.logo-fallback { font-size: 20px; border-width: 3px; box-sizing: border-box; }
  .row__teams { min-width: 0; line-height: 1.15; }
  .row__teams span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row__teams .v { display: inline; color: var(--pink); font-size: 22px; }
  .row__teams small { display: block; font-size: 16px; color: var(--muted); letter-spacing: .1em; margin-top: 4px; }
  .row__mic { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
  .person { background: rgba(255,255,255,.1); border-radius: 999px; padding: 8px 20px; font-size: 28px; font-weight: 800; white-space: nowrap; }
  .person.guest { background: var(--pink); }
  .person.guest::after { content: 'Guest'; margin-left: 10px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; vertical-align: 4px; }
  .nobody { color: var(--muted); font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .message { color: var(--text); background: var(--purple-deep); padding: 16px 24px; border-radius: 8px; font-size: 26px; align-self: flex-start; }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="sceneevents.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page, for a monitor backstage or at the commentary desk (not the stream): fills the
       whole frame with the night's commentary team from the Production Planner (planner.html).
       http://localhost:8080/roster.html
       Tonight is the game night picked on Scoreboard control, else today, else the next game night. A row per game on the
       night's planned court: the time, the teams, and who is on the mic (special guests marked). The game on the scoreboard
       is lit up, ON NOW, and the games before it dimmed; it follows the scoreboard live, and reads the plan again every
       minute so a swap in the Planner shows (from Studio only, never PlayHQ).
       Options: ?date=2026-11-04 (another night)  ?title=Tonight's%20commentators (the heading)  ?bg=0 (see-through)
                ?refresh=0 (loads once) -->
  <header class="head" id="head" hidden>
    <div>
      <div class="tab" id="comp"></div>
      <h1 class="head__title" id="title"></h1>
    </div>
    <div class="head__when" id="when"></div>
  </header>
  <div class="rows" id="rows"></div>
  <p class="message" id="message" hidden></p>
  <script src="teams.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    if (params.get('bg') === '0') document.body.classList.add('see-through');
    const refresh = params.get('refresh') !== '0';

    function clock(time) {
      const [h, m] = String(time || '').split(':').map(Number);
      return Number.isFinite(h) ? `${(h % 12) || 12}:${String(m || 0).padStart(2, '0')}` : (time || 'TBC');
    }
    const ampm = time => (Number(String(time).split(':')[0]) < 12 ? 'AM' : 'PM');

    function draw(d) {
      $('comp').textContent = d.competition || '';
      $('title').textContent = params.get('title') || (d.today ? "Tonight's commentators" : 'Commentators');
      const day = new Date(`${d.date}T00:00:00`);
      $('when').replaceChildren(day.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' }),
        el('small', '', [d.court, d.venue].filter(Boolean).join('  ·  ')));
      $('head').hidden = false;
      const now = d.slots.findIndex(s => s.onAir);
      $('rows').replaceChildren(...d.slots.map((s, i) => {
        const row = el('div', `row${i === now ? ' now' : now >= 0 && i < now ? ' past' : ''}`);
        const t = row.appendChild(el('div', 'row__time', clock(s.time)));
        t.append(el('small', '', i === now ? 'On now' : ampm(s.time)));
        const game = row.appendChild(el('div', 'row__game'));
        const teams = el('div', 'row__teams');
        const vs = el('span');
        vs.append(s.home.name, ' ', el('span', 'v', 'v'), ' ', s.away.name);
        teams.append(vs, el('small', '', [s.division, s.round].filter(Boolean).join('  ·  ')));
        game.append(logoEl(s.home, 'logo'), logoEl(s.away, 'logo'), teams);
        const mic = row.appendChild(el('div', 'row__mic'));
        if (s.people.length) for (const p of s.people) mic.append(el('span', `person${p.guest ? ' guest' : ''}`, p.name));
        else mic.append(el('span', 'nobody', 'Nobody planned'));
        return row;
      }));
      if (!d.slots.length) $('rows').append(el('p', 'message', `No games on ${d.court} that night.`));
      // A long night is made smaller to fit the frame, never bigger.
      const rows = $('rows');
      rows.style.scale = '';
      const room = rows.clientHeight, need = rows.scrollHeight;
      if (need > room) rows.style.scale = String(Math.floor(room / need * 1000) / 1000);
    }

    let last = '';
    async function load() {
      try {
        const q = new URLSearchParams();
        if (params.get('date')) q.set('date', params.get('date'));
        const d = await (await fetch(`/api/planner/roster?${q}`, { cache: 'no-store' })).json();
        if (d.error && !d.court) throw new Error(d.error);
        $('message').hidden = true;
        const json = JSON.stringify(d);
        if (json === last) return;
        last = json;
        draw(d);
        window.pageLog && window.pageLog('info', `Commentary roster: ${d.date} on ${d.court}, ${d.slots.length} games`);
      } catch (err) {
        console.warn('Commentary roster unavailable:', err.message);
        $('message').textContent = `Commentary roster: ${err.message}`;
        $('message').hidden = false;
      }
    }

    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
      load();
      if (!refresh) return;
      // The game on the scoreboard moves on through the night: light up the new one straight away.
      let game;
      sceneEvents(null, { board: b => { if (game !== undefined && b.gameId !== game) load(); game = b.gameId; } });
      setInterval(load, 60000);
    });
  </script>
</body>
</html>
