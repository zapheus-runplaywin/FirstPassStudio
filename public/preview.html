<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene View · FirstPass Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="studio/favicon.png">
<!--
  The Output page's preview in its own window (Pop out on the Output page), to resize it, put it
  on another screen or watch it full screen while testing. It shows the scene on a checkerboard,
  scaled to fit the window, silent like the preview on the Output page (an output's sound plays where its
  Sound goes to says; that preview turns off while this window is open, so the scene only runs once more).
  Closing this window puts the preview back on the Output page.
  A floating Sources panel shows or hides each source while you watch (its – button tucks it away, kept per
  browser), and follows the Output page and the Stream Deck live.
  ?output=<id>: one of the outputs besides the primary, as picked on the Output page: its sources.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1E293B; }
  #box { position: absolute; overflow: hidden; background: repeating-conic-gradient(#E2E8F0 0 25%, #F8FAFC 0 50%) 0 0 / 24px 24px; }
  #box iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  #panel { position: fixed; top: 10px; right: 10px; width: 240px; max-height: calc(100vh - 20px); overflow: auto; border-radius: 10px;
           background: rgba(15, 23, 42, .88); color: #fff; font: 600 13px system-ui, sans-serif; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
  #panel header { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 8px 7px 12px; }
  #panel h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #94A3B8; }
  #panel ul { list-style: none; margin: 0; padding: 0 6px 6px; }
  #panel li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  #panel li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel button { font: inherit; border: 0; border-radius: 6px; padding: 4px 9px; cursor: pointer; background: #334155; color: #CBD5E1; }
  #panel button:hover { background: #475569; }
  #panel .eye { min-width: 44px; }
  #panel .eye.on { background: #F97316; color: #0F172A; }
  #panel .scenes { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 6px 8px; }
  #panel .scenes:empty { display: none; }
  #panel .scenes button { position: relative; padding: 4px 9px 7px; overflow: hidden; }
  #panel .scenes button::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--band, #3b82f6); }
  #panel .scenes button.cur { background: #F97316; color: #0F172A; }
  #panel .scenes button.cur.changed::before { content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: #FACC15; box-shadow: 0 0 0 1px #0F172A; }
  #panel.min ul, #panel.min #hideAll, #panel.min .scenes { display: none; }
  #panel.min { width: auto; }
</style>
<script src="log.js"></script>
<script src="sceneevents.js"></script>
</head>
<body>
<div id="box"><iframe id="frame" title="Scene View" src="/scene.html?mute=1"></iframe></div>
<div id="panel">
  <header><h2>Sources</h2><span><button id="hideAll" title="Hide every source">Hide all</button> <button id="fold" title="Hide or show this list">–</button></span></header>
  <div class="scenes" id="scenes"></div>
  <ul id="sources"></ul>
</div>
<script type="module" src="preview.js"></script>
</body>
</html>
