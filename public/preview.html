<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene View · FirstPass Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="studio/favicon.png">
<!--
  The Output page's preview in its own window (Pop out on the Output page), to resize it, put it
  on another screen or watch it full screen while testing. It shows the scene on a checkerboard,
  scaled to fit the window, and plays the scene's sound while Video output is off, exactly as
  the preview on the Output page does (that one turns off while this window is open, so the scene
  only runs once more). Closing this window puts the preview back on the Output page.
  A floating Sources panel shows or hides each source while you watch (its – button tucks it away, kept per
  browser), and follows the Output page and the Stream Deck live.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1E293B; }
  #box { position: absolute; overflow: hidden; background: repeating-conic-gradient(#E2E8F0 0 25%, #F8FAFC 0 50%) 0 0 / 24px 24px; }
  #box iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  #note { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100vw - 24px); padding: 6px 12px; border-radius: 8px;
          background: rgba(15, 23, 42, .85); color: #fff; font: 600 13px system-ui, sans-serif; text-align: center; pointer-events: none; }
  #note:empty { display: none; }
  #panel { position: fixed; top: 10px; right: 10px; width: 240px; max-height: calc(100vh - 20px); overflow: auto; border-radius: 10px;
           background: rgba(15, 23, 42, .88); color: #fff; font: 600 13px system-ui, sans-serif; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
  #panel header { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 8px 7px 12px; }
  #panel h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #94A3B8; }
  #panel ul { list-style: none; margin: 0; padding: 0 6px 6px; }
  #panel li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  #panel li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel button { font: inherit; border: 0; border-radius: 6px; padding: 4px 9px; cursor: pointer; background: #334155; color: #CBD5E1; }
  #panel button:hover { background: #475569; }
  #panel .eye { min-width: 44px; }
  #panel .eye.on { background: #F97316; color: #0F172A; }
  #panel .scenes { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 6px 8px; }
  #panel .scenes:empty { display: none; }
  #panel .scenes button { position: relative; padding: 4px 9px 7px; overflow: hidden; }
  #panel .scenes button::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--band, #3b82f6); }
  #panel .scenes button.cur { background: #F97316; color: #0F172A; }
  #panel .scenes button.cur.changed::before { content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: #FACC15; box-shadow: 0 0 0 1px #0F172A; }
  #panel.min ul, #panel.min #hideAll, #panel.min .scenes { display: none; }
  #panel.min { width: auto; }
</style>
<script src="log.js"></script>
<script src="sceneevents.js"></script>
</head>
<body>
<div id="box"><iframe id="frame" title="Scene View" src="/scene.html?mute=1"></iframe></div>
<div id="note"></div>
<div id="panel">
  <header><h2>Sources</h2><span><button id="hideAll" title="Hide every source">Hide all</button> <button id="fold" title="Hide or show this list">–</button></span></header>
  <div class="scenes" id="scenes"></div>
  <ul id="sources"></ul>
</div>
<script>
  const $ = id => document.getElementById(id);
  const frame = $('frame');
  const scene = () => { try { return frame.contentWindow; } catch { return null; } };

  // Scale the 1920 x 1080 frame to fit the window, centred, with the window's colour around it.
  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    Object.assign($('box').style, { width: 1920 * k + 'px', height: 1080 * k + 'px', left: (innerWidth - 1920 * k) / 2 + 'px', top: (innerHeight - 1080 * k) / 2 + 'px' });
    frame.style.transform = `scale(${k})`;
  }
  addEventListener('resize', fit);
  fit();

  // The Scene View's sound, the same way as the Output page's Scene View: only while no video output is on
  // (with one on, the output carries the sound), ask the helper for it, check in every few seconds, let go on closing.
  // Opening the window takes the sound, since the Output page's own preview has just turned off.
  const listenId = 'popout-' + Math.random().toString(36).slice(2);
  let wanted = false, sound = false, note = '';
  async function listen(take = false) {
    try {
      const o = await (await fetch('/api/outputs')).json();
      wanted = !!o.previewSound;
      const r = await fetch('/api/outputs/listen', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: listenId, on: wanted, take }) });
      sound = !!(await r.json()).sound;
      showNote(o);
    } catch { sound = false; showNote(null); }
  }
  function showNote(o) {
    const s = scene();
    try { s?.setSilent?.(!sound); } catch {}
    let st = null;
    try { st = s?.soundState?.(); } catch {}
    // The same line here ("here") and under the Output page's preview ("in the Scene View window").
    const line = (here, there) => !o ? ''
      : !wanted ? 'Silent: a video output is on, so the output plays the sound.'
      : !sound ? `Silent: another Output page is playing the sound. Click ${here ? 'here' : 'the Scene View window'} to bring it ${here ? 'to this window' : 'there'}.`
      : st && st.blocked ? `Blocked by this browser until you click: click ${here ? 'here' : 'the Scene View window'} to hear it.`
      : st && !st.videos && !st.pages ? `Sound plays ${there} once a video with Sound ticked, or an animation with sound, is on.`
      : `Sound plays ${there}, through this Mac's sound output.`;
    note = line(false, 'in the Scene View window');
    // Only the reasons it's silent show over the picture; the Output page shows every line.
    $('note').textContent = wanted && (!sound || (st && st.blocked)) ? line(true, 'here') : '';
    tell();
  }
  frame.addEventListener('load', () => listen(true));
  setInterval(() => listen(), 5000);
  // A click brings the sound here, and is what a browser needs before it plays sound
  // (Safari: unmute during the click itself, then take the sound properly).
  addEventListener('click', () => {
    if (!wanted) return;
    try { scene()?.unlockSound?.(); } catch {}
    listen(true);
  });

  // Sources: show or hide each one from here, following the scene live (the Output page, the Stream Deck).
  const act = action => fetch('/api/scene', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(action) })
    .catch(err => console.warn('Scene change failed', action.type, err.message));
  function showSources(scn) {
    const ul = $('sources');
    ul.innerHTML = scn.sources.length ? '' : '<li><span style="color:#94A3B8">No sources yet</span></li>';
    for (const src of scn.sources) {
      const li = document.createElement('li');
      li.innerHTML = '<button class="eye"></button><span></span>';
      const eye = li.querySelector('button');
      eye.textContent = src.visible ? 'On' : 'Off';
      eye.classList.toggle('on', src.visible);
      eye.title = src.visible ? 'Showing: click to fade it out' : 'Hidden: click to fade it in';
      eye.onclick = () => act({ type: 'toggle', id: src.id });
      li.querySelector('span').textContent = src.name;
      ul.append(li);
    }
  }
  // Scenes: go to one from here. The current one is orange, with a dot when something's changed since.
  const BANDS = { blue: '#3b82f6', green: '#22c55e', grey: '#a1a1aa', yellow: '#facc15', purple: '#a855f7' };
  function showScenes(scn) {
    const box = $('scenes');
    box.innerHTML = '';
    for (const sc of scn.scenes || []) {
      const b = document.createElement('button');
      b.textContent = sc.name;
      b.style.setProperty('--band', BANDS[sc.colour] || BANDS.blue);
      const cur = sc.id === scn.current, changed = cur && (scn.changed || []).length > 0;
      b.className = (cur ? 'cur' : '') + (changed ? ' changed' : '');
      b.title = cur ? (changed ? `Back to ${sc.name} as saved` : `${sc.name} is on now`) : `Go to ${sc.name}`;
      b.onclick = () => act({ type: 'sceneGo', scene: sc.id });
      box.append(b);
    }
  }
  sceneEvents(scn => { showScenes(scn); showSources(scn); });
  $('hideAll').onclick = () => act({ type: 'hideAll' });
  const fold = min => {
    $('panel').classList.toggle('min', min);
    $('fold').textContent = min ? 'Show' : '–';
    try { localStorage.setItem('previewPanel', min ? 'min' : ''); } catch {}
  };
  $('fold').onclick = () => fold(!$('panel').classList.contains('min'));
  try { fold(localStorage.getItem('previewPanel') === 'min'); } catch {}

  // The Output page knows this window is open (and turns its own preview off) through this channel.
  // It also hears from it every couple of seconds: the Mac app's window can close without the
  // goodbye below ever arriving, and then the Output page puts its own preview back by itself.
  const channel = new BroadcastChannel('studio-preview');
  let closing = false;
  const tell = (open = true) => { if (!closing || !open) channel.postMessage({ open, note }); };
  const goodbye = () => {
    if (closing) return;
    tell(false);
    closing = true;
    navigator.sendBeacon('/api/outputs/listen', JSON.stringify({ id: listenId, on: false }));
  };
  channel.onmessage = e => {
    if (e.data === 'ask') listen(); // and says it's open once it knows the sound
    if (e.data === 'focus') { focus(); tell(); }
    // Say goodbye before closing, not as the window goes, so the Output page always hears it.
    if (e.data === 'close') { goodbye(); setTimeout(close, 50); }
  };
  addEventListener('pagehide', goodbye);
  setInterval(() => tell(), 2000);
  tell();
</script>
</body>
</html>
