openapi: 3.0.3
info:
  title: FirstPass Studio links
  version: "1.0"
  description: |
    Every Stream Deck link Studio answers, plus the status reads behind them. Each control is a plain GET request,
    made for a Stream Deck "Website" action with "GET request in background" ticked. Studio must be on air.
    Score links switch the scoreboard to Manual; clock links stop the clock following the PlayHQ scorer.
servers:
  - url: /
    description: The Studio this page was opened from
  - url: http://localhost:8080
    description: Studio on this computer

tags:
  - name: Game
  - name: Scores
    description: Any score change (and resetting the scores) switches the scoreboard to Manual, so it stops taking the score and the clock from PlayHQ. The super shot and streak animations leave the score alone.
  - name: Scoring mode
  - name: Clock
    description: Start, stop, toggle, reset, set and adjust stop the clock following the PlayHQ scorer's clock. The score keeps following PlayHQ.
  - name: Quarter
  - name: Ticker
  - name: Status
  - name: Scene
    description: Studio's scene, built on the Output page. Sources are named by the name given on the Output page, lower case with dashes for spaces ("Up Next" is `up-next`).
  - name: Switcher
    description: The Blackmagic ATEM switcher set up on the Output page (Switcher card). Studio sends a link's command straight away, or refuses it with 409 when no switcher is set up or it isn't answering (nothing is saved up for later). Keys and macros count from 1, as on the switcher; a link for a key the switcher doesn't have (a second downstream key on an ATEM Mini Pro) answers 404 with what it does have.

paths:
  /deck/{side}/{change}:
    get:
      tags: [Scores]
      summary: Change a team's score
      description: |
        `add2` / `minus2` are for super shots; `add2` also plays the super shot animation
        (supershot.html) in a division that plays super shots (set on the competition setup page). Any score change switches the scoreboard to manual scoring.

        Examples: `/deck/home/add1`, `/deck/away/add2`, `/deck/home/minus1`.
      operationId: changeScore
      parameters:
        - name: side
          in: path
          required: true
          schema: { type: string, enum: [home, away] }
        - name: change
          in: path
          required: true
          schema: { type: string, enum: [add1, add2, minus1, minus2] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/{side}/supershot:
    get:
      tags: [Scores]
      summary: Play the super shot animation for a team
      description: |
        Plays supershot.html (the source that watches the scoreboard) for that team without
        changing the score, e.g. to test it or after a super shot the scoring missed. Only in a
        division that plays super shots (set on the competition setup page).
      operationId: playSuperShot
      parameters:
        - name: side
          in: path
          required: true
          schema: { type: string, enum: [home, away] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /deck/streak/{kind}/{side}:
    get:
      tags: [Scores]
      summary: Play a hot streak or game moment animation
      description: |
        Plays streak.html (the source that watches the scoreboard) without changing the score, e.g. to
        test it. `heating` is "<team> is heating up" (3 goals in a row), `fire` is "<team> is on fire"
        (5 in a row) and `goalforgoal` is "goal for goal intensity" (10 goals one each way, both teams;
        the side is who scored first and can be left out, `/deck/streak/goalforgoal`). Game moments:
        `lead` "<team> hits the front", `level` "all square" (both teams, side left out), `comeback`
        "<team> is coming back", `siren` "<team> on the siren!" and `backtoback` "<team> back to back super shots".
        They also play by themselves from the goals on the scoreboard.
      operationId: playStreak
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [heating, fire, goalforgoal, lead, level, comeback, siren, backtoback] }
        - name: side
          in: path
          required: true
          schema: { type: string, enum: [home, away] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/scores/reset:
    get:
      tags: [Scores]
      summary: Set both scores back to 0
      description: Also switches the scoreboard to manual scoring. Team names, quarter and clock are kept.
      operationId: resetScores
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /deck/source/{mode}:
    get:
      tags: [Scoring mode]
      summary: Follow PlayHQ or score manually
      description: |
        `playhq` takes scores from PlayHQ every 5 seconds, or as set on the control page (only works once a
        game has been picked on the control page, and only if the game is
        live-scored in PlayHQ). `manual` uses the score buttons. `toggle` swaps
        between the two. Following the PlayHQ scorer's clock is switched on or off to match
        (`/deck/clock/playhq/...` changes it again afterwards).
      operationId: setSource
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [playhq, manual, toggle] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/clock/{action}:
    get:
      tags: [Clock]
      summary: Start, stop, toggle or reset the clock
      description: |
        `toggle` starts a stopped clock and stops a running one.
        `reset` stops the clock and puts it back to a full quarter (10:00 unless
        the length on the competition setup page or `/deck/clock/length` says otherwise).
      operationId: clockControl
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, stop, toggle, reset] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/clock/set/{time}:
    get:
      tags: [Clock]
      summary: Set the time left on the clock
      description: |
        Use it to match the venue clock. `m:ss` or whole minutes, e.g. `/deck/clock/set/7:30`
        or `/deck/clock/set/10`. Keeps running if the clock was running. A time longer
        than the quarter is allowed; the next reset goes back to the normal length.
      operationId: clockSet
      parameters:
        - name: time
          in: path
          required: true
          schema: { type: string, pattern: '^\d{1,2}([:.]\d{1,2})?$', example: '10:00' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/clock/adjust/{amount}:
    get:
      tags: [Clock]
      summary: Add time to or take time off the clock
      description: |
        A positive amount adds time, a negative one takes it off. End with `m` for
        minutes or `s` for seconds; a bare number is seconds.

        Examples: `1m`, `-1m`, `10s`, `-10s`, `1s`, `-1s`, `90`.
      operationId: clockAdjust
      parameters:
        - name: amount
          in: path
          required: true
          schema: { type: string, pattern: '^[+-]?\d+(\.\d+)?[msMS]?$', example: '-10s' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/clock/adjust:
    get:
      tags: [Clock]
      summary: Add or take off minutes and seconds together
      description: 'Example: `/deck/clock/adjust?minutes=-1&seconds=-15` takes 1:15 off.'
      operationId: clockAdjustQuery
      parameters:
        - name: minutes
          in: query
          schema: { type: number, example: 1 }
        - name: seconds
          in: query
          schema: { type: number, example: -15 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/clock/length/{minutes}:
    get:
      tags: [Clock]
      summary: Change the quarter length
      description: Sets how long a quarter is; time already run is kept (reset the clock for a full quarter). At least 1 minute. Lasts until the scoreboard is cleared or Studio is set up again.
      operationId: clockLength
      parameters:
        - name: minutes
          in: path
          required: true
          schema: { type: number, minimum: 1, example: 10 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/clock/playhq/{mode}:
    get:
      tags: [Clock]
      summary: Follow the PlayHQ scorer's clock
      description: |
        `on` makes the clock follow the game clock the PlayHQ scorer runs (while the score follows PlayHQ),
        `off` stops it, `toggle` switches. Any other clock button also turns it off. Switching scores
        between Follow PlayHQ and Manual (including by a score button) sets this to match, so it is on
        whenever scores follow PlayHQ unless changed after that.
      operationId: clockFollowPlayhq
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [on, off, toggle] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/auto/{mode}:
    get:
      tags: [Game]
      summary: Turn automatic game selection on or off
      description: |
        With it on, the scoreboard shows today's game on the chosen court, switching to the next
        game when its electronic scoring starts (10 minutes before by default, set on the competition setup page) (finals stay on until PlayHQ marks them finished).
        Picking a game by hand on the control page turns it off.
      operationId: autoSelect
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [on, off, toggle] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/court/{court}:
    get:
      tags: [Game]
      summary: Choose the court for automatic game selection
      description: The court's name as PlayHQ shows it (`Indoor%2001`) or just its number (`2`). Choosing a court also turns automatic game selection on.
      operationId: autoCourt
      parameters:
        - name: court
          in: path
          required: true
          schema: { type: string, example: '2' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/quarter/{quarter}:
    get:
      tags: [Quarter]
      summary: Change the quarter
      description: |
        `1` to `4`, `5` for extra time (shown as ET), or `next` / `prev`.
        Doesn't touch the clock: also call `/deck/clock/reset` when a new quarter starts
        (a Stream Deck Multi Action can do both). `/deck/period/{quarter}` does the same.
      operationId: setQuarter
      parameters:
        - name: quarter
          in: path
          required: true
          schema: { type: string, enum: ['1', '2', '3', '4', '5', next, prev] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/ticker/{change}:
    get:
      tags: [Ticker]
      summary: Make the score ticker scroll faster or slower
      description: |
        `faster` and `slower` change it by 20 pixels a second (from 20 to 600),
        `normal` puts it back to 120. The ticker changes speed within a few seconds,
        carrying on from where it is. A ticker link with `?speed=` keeps its own speed.
      operationId: tickerChange
      parameters:
        - name: change
          in: path
          required: true
          schema: { type: string, enum: [faster, slower, normal] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/ticker/speed/{pixels}:
    get:
      tags: [Ticker]
      summary: Set the score ticker's speed
      description: 'Pixels a second, 20 to 600 (120 is normal). Example: `/deck/ticker/speed/80` for slower.'
      operationId: tickerSpeed
      parameters:
        - name: pixels
          in: path
          required: true
          schema: { type: integer, minimum: 20, maximum: 600, example: 80 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /api/scoreboard:
    get:
      tags: [Status]
      summary: Read the full scoreboard
      description: Everything the overlay shows. Useful for a Stream Deck plugin that displays the score or clock on a key.
      operationId: getScoreboard
      responses:
        '200':
          description: Current scoreboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scoreboard' }

  /api/stats:
    get:
      tags: [Status]
      summary: Read the game stats
      description: >-
        What gamestats.html shows. Points per quarter are worked out by Studio from the score on the board as the game
        goes (whatever the score goes up by is put on the quarter that is on), and runs from the goal order goals.html uses.
        A quarter with sure false was only partly seen (the game was picked up part way, or a score jumped by more than 3
        at once) and isn't counted in quarters won or best quarter; home and away null means it wasn't seen at all.
      operationId: getStats
      responses:
        '200':
          description: The score by quarter and each team's stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  quarters:
                    type: array
                    items:
                      type: object
                      properties:
                        n: { type: integer }
                        label: { type: string, description: Q1 .. Q4, H1 and H2 for halves, ET for extra time }
                        home: { type: integer, nullable: true }
                        away: { type: integer, nullable: true }
                        sure: { type: boolean }
                  stats:
                    type: object
                    description: >-
                      quartersWon (home, away, drawn, of), bestQuarter (per team n, label, points), superShots,
                      runs3 and runs5 (runs of at least 3 or 5 goals in a row, a super goal counting as one goal) and
                      longestRun, each with home and away.
                  totalGoals: { type: integer }
                  gapInHistory: { type: boolean, description: Studio picked the game up part way, so runs only count from then }

  /api/worm:
    get:
      tags: [Status]
      summary: Read the score worm
      description: >-
        What worm.html shows: the margin (home minus away) after each goal, in the goal order goals.html uses. Time t
        is in periods (1.5 is half way through the first quarter), from the game clock when each goal came in; a quarter
        without clock times has its goals spread evenly. Each gap (the game picked up part way, a score typed in, or a
        score jumping by more than 3 at once) starts a new segment from the score after it, and is listed in gaps.
      operationId: getWorm
      responses:
        '200':
          description: The worm's lines, gaps and biggest leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  periods: { type: integer, description: Periods across the chart (4 quarters, 2 halves, more with extra time) }
                  segments:
                    type: array
                    description: Lines between gaps, each a list of points oldest first, ending at the game time now.
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          t: { type: number }
                          home: { type: integer }
                          away: { type: integer }
                          margin: { type: integer, description: Home minus away }
                          side: { type: string, enum: [home, away], description: Who scored (not on a line's first or last point) }
                          points: { type: integer }
                  gaps:
                    type: array
                    items: { type: object, properties: { from: { type: number }, to: { type: number } } }
                  end: { type: number, description: Game time now, in periods }
                  biggestLead:
                    type: object
                    description: home and away, each margin and t, or null when that team never led.
                  leadChanges: { type: integer }
                  superShot:
                    type: object
                    nullable: true
                    description: >-
                      Super shot divisions only: minutes, windows (n, from, to in periods: the last minutes of each quarter),
                      points (home and away scored in those windows, from goals with clock times) and timed (any goal had a clock time).
                  totalGoals: { type: integer }

  /api/goals:
    get:
      tags: [Status]
      summary: Read the last goals of the game
      description: >-
        What goals.html shows. The order is worked out by Studio from the score going up between PlayHQ readings
        and from score presses, since PlayHQ only gives running totals. Goals are oldest first; an item with gap true
        marks where the score jumped too far to list goal by goal.
      operationId: getGoals
      parameters:
        - name: count
          in: query
          required: false
          description: How many goals (3 to 30).
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: The last goals, each team's share of them and the current run
          content:
            application/json:
              schema:
                type: object
                properties:
                  goals:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        side: { type: string, enum: [home, away] }
                        points: { type: integer, description: 1 for a goal, 2 for a super goal }
                        period: { type: integer }
                        clockLeft: { type: integer, description: Seconds left on the scoreboard clock when it was seen }
                        how: { type: string, enum: [playhq, manual] }
                        gap: { type: boolean }
                  tally:
                    type: object
                    description: Goals and points each team scored among the goals shown
                  run:
                    type: object
                    nullable: true
                    properties:
                      side: { type: string, enum: [home, away] }
                      goals: { type: integer }
                      points: { type: integer }

  /deck/layer/{name}/{action}:
    get:
      tags: [Scene]
      summary: Show, hide, toggle or refresh a scene source
      description: |
        For the scene built on the Output page (`/output.html`). `on` fades the source in and `off` fades it out,
        each with the source's own fade time; `toggle` swaps between the two. `restart` reloads a page source or starts a video from the beginning.
        The source is found by its name as set on the Output page, which copies each source's links.
      operationId: layerAction
      parameters:
        - name: name
          in: path
          required: true
          description: The source's name, lower case with dashes for spaces, e.g. `scoreboard` or `up-next`
          schema: { type: string }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [on, off, toggle, restart] }
      responses:
        '200':
          description: Done. Returns the source's name and whether it's now showing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  visible: { type: boolean }
        '404': { description: No source by that name in the scene }

  /deck/layer/{name}/sound/{action}:
    get:
      tags: [Scene]
      summary: Turn a video source's sound on or off
      operationId: layerSound
      parameters:
        - name: name
          in: path
          required: true
          description: The video source's name, lower case with dashes for spaces
          schema: { type: string }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [on, off, toggle] }
      responses:
        '200':
          description: Done. Returns the source's name, whether it's showing and whether its sound is on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  visible: { type: boolean }
                  sound: { type: boolean }
        '404': { description: No source by that name, or it isn't a video }

  /deck/layers/off:
    get:
      tags: [Scene]
      summary: Fade every scene source out
      operationId: layersOff
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /deck/sponsor/ad:
    get:
      tags: [Scene]
      summary: Play the next sponsor ad
      description: |
        Plays the next ad from the Sponsors page (`/sponsors.html`) in the scene's Sponsor ad source, taking turns with
        the Sponsor ads steps in sequences: sponsors by their tier's share, never the same one twice running. A video plays
        to its end with its sound and goes off; a still stays for its seconds. A sequence that's playing carries on.
      operationId: sponsorAd
      responses:
        '200':
          description: The ad is on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sponsor: { type: string, description: The sponsor whose ad is playing }
                  source: { type: string, description: The scene source it plays in }
        '404':
          description: No sponsor of the competition in use has an ad to play.

  /deck/scene/{name}:
    get:
      tags: [Scene]
      summary: Go to a scene, the next or previous one, or back to the current one as saved
      description: |
        Scenes are saved looks made on the Output page (`/output.html`): each one sets sources on or off, or leaves them as they are.
        Going to a scene fades sources in and out to match, each with its own fade; a source that's already on stays on and isn't reloaded.
        `next` and `prev` go through the scenes in the Output page's order and stop at the ends (with no current scene, `next` goes to the
        first and `prev` to the last). `again` goes back to the current scene as saved, undoing sources turned on or off since.
      operationId: sceneGo
      parameters:
        - name: name
          in: path
          required: true
          description: The scene's name, lower case with dashes for spaces (e.g. `pre-game`), or `next`, `prev` or `again`
          schema: { type: string }
      responses:
        '200':
          description: Done. Returns the current scene's name and how many sources differ from it (0 straight after going to it).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scene: { type: string, nullable: true }
                  changed: { type: integer }
        '404': { description: No scene by that name, no scenes at all, or no current scene to go back to }

  /deck/sequence/{name}:
    get:
      tags: [Scene]
      summary: Play a sequence, or act on the one playing
      description: |
        Sequences are made on the Output page (`/output.html`) and belong to the competition in use. Each plays the scene's sources one after
        another, each step for a set time, until it finishes, or until Next. One plays at a time: playing one stops another without its Then.
        With a sequence's name this plays it from the first step. These names act on whatever is playing instead:
        `next` ends the step now, `advance` ends it only if it waits for Next (Until I press Next) and otherwise does nothing (one key for every sequence), `pause` pauses or carries on, `resume` carries on, and `stop` stops it and does its Then (go to a scene, turn off what it turned on, or leave it all).
        A sequence set to start by itself (before the game, at a break, at full time) waits a few seconds after the siren first:
        then `now` starts it straight away and `cancel` stops it starting.
      operationId: sequence
      parameters:
        - name: name
          in: path
          required: true
          description: The sequence's name, lower case with dashes for spaces (e.g. `quarter-break`), or `next`, `advance`, `pause`, `resume`, `stop`, `now` or `cancel`
          schema: { type: string }
      responses:
        '200':
          description: Done. Returns what's playing now, its step (from 1) and whether it's paused.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  playing: { type: string, nullable: true }
                  step: { type: integer, nullable: true }
                  paused: { type: boolean }
        '404': { description: No sequence by that name }
        '409': { description: Next or pause with no sequence playing, or now with none about to start }

  /deck/sequence/auto/{state}:
    get:
      tags: [Scene]
      summary: Turn automatic sequences on or off
      description: |
        With it off, no sequence starts by itself (before the game, at a break or at full time), and one about to start is cancelled.
        Every sequence still plays by hand. Remembered when Studio opens again.
      operationId: sequenceAuto
      parameters:
        - name: state
          in: path
          required: true
          schema: { type: string, enum: [on, off, toggle] }
      responses:
        '200':
          description: Done. Returns whether it's on now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  auto: { type: boolean }

  /deck/sequence/{name}/{action}:
    get:
      tags: [Scene]
      summary: Play, toggle or stop one sequence
      description: |
        `play` (or `start`) plays it from the first step. `toggle` plays it, or stops it (doing its Then) if it's the one playing.
        `stop` stops it if it's the one playing, and does nothing otherwise.
      operationId: sequenceAction
      parameters:
        - name: name
          in: path
          required: true
          description: The sequence's name, lower case with dashes for spaces (e.g. `quarter-break`)
          schema: { type: string }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [play, start, toggle, stop] }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  playing: { type: string, nullable: true }
                  step: { type: integer, nullable: true }
                  paused: { type: boolean }
        '404': { description: No sequence by that name }

  /deck/music/{action}:
    get:
      tags: [Scene]
      summary: Play, pause, stop or skip the music
      description: |
        The Output page's Music player. `toggle` plays or pauses, `play` plays the loaded song from the start, `pause` and `resume`,
        `stop`, `fade` (fade out and stop), `next` and `prev` (the playlist's next or previous song).
      operationId: music
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [toggle, play, pause, resume, stop, fade, next, prev] }
        - name: fade
          in: query
          description: Seconds to fade over (0 cuts). Without it, the player's fade in time (play, resume, duck off) or fade out time (stop, pause, fade, duck on).
          schema: { type: number }
      responses:
        '200':
          description: Done. Returns the song and whether it's playing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  track: { type: string, nullable: true }
                  status: { type: string, enum: [playing, paused, stopped] }
                  muted: { type: boolean }
                  ducked: { type: boolean }
        '409': { description: Nothing loaded to play, or nothing playing to pause }

  /deck/music/{what}/{name}:
    get:
      tags: [Scene]
      summary: Load a song or playlist, or mute or duck the music
      description: |
        `load/<song>` loads a song from the media folder (named lower case with dashes for spaces, without its ending), ready to play;
        `playlist/<name>` loads a playlist. Add `?play` to start it straight away. `mute/on|off|toggle` silences the music and
        `duck/on|off|toggle` dips it low, both keeping it running.
      operationId: musicLoad
      parameters:
        - name: what
          in: path
          required: true
          schema: { type: string, enum: [load, playlist, mute, duck] }
        - name: name
          in: path
          required: true
          description: The song or playlist, or on, off or toggle for mute and duck
          schema: { type: string }
        - name: play
          in: query
          description: Start the song or playlist straight away
          schema: { type: string }
        - name: fade
          in: query
          description: Seconds to fade in over when it plays (0 cuts)
          schema: { type: number }
      responses:
        '200': { description: Done. }
        '404': { description: No song or playlist by that name }

  /deck/output/{action}:
    get:
      tags: [Scene]
      summary: Show or blank the scene on the Mac's displays, Blackmagic device or NDI (Output page, Video output)
      description: Mac app only. Turns the video output on or off without changing its setup on the Output page (chroma, fill and key on two displays, a Blackmagic device, or NDI).
      operationId: output
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [on, off, toggle] }
      responses:
        '200':
          description: Done. Returns whether the output is on and its mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  on: { type: boolean }
                  mode: { type: string, enum: [off, chroma, fillkey, decklink, ndi] }
        '404': { $ref: '#/components/responses/UnknownLink' }

  /deck/switcher/{action}:
    get:
      tags: [Switcher]
      summary: Cut, auto, stinger or fade to black
      description: "`cut` takes the preview input to program at once, `auto` with the switcher's transition, `stinger` plays the scene's Stinger page on Output 1 and cuts underneath it (in the middle of its cover, moved by the line-up; an auto when the scene has no stinger), `ftb` fades to black (or back from it). A stinger answers once the cut is done, about 1.5 s later."
      operationId: switcherTake
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [cut, auto, stinger, ftb] }
      responses:
        '200':
          description: Done. Returns the switcher's program and preview inputs and its keys after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitcherDone' }
        '404': { description: No such input or key on this switcher, or not one of the links listed here }
        '409': { description: No switcher is set up, or it isn't answering; nothing was sent }

  /deck/switcher/stinger/{input}:
    get:
      tags: [Switcher]
      summary: Stinger to an input
      description: Puts the input on preview, then plays the stinger and cuts to it underneath, as `/deck/switcher/stinger`. The input by its number or its name.
      operationId: switcherStinger
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Done. Returns the switcher's program and preview inputs and its keys after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitcherDone' }
        '404': { description: No such input or key on this switcher, or not one of the links listed here }
        '409': { description: No switcher is set up, or it isn't answering; nothing was sent }

  /deck/switcher/preview/{input}:
    get:
      tags: [Switcher]
      summary: Put an input on preview
      description: The input by its number on the switcher, or its name as set in ATEM Software Control (`Camera%202`, or `camera-2`).
      operationId: switcherPreview
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Done. Returns the switcher's program and preview inputs and its keys after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitcherDone' }
        '404': { description: No such input or key on this switcher, or not one of the links listed here }
        '409': { description: No switcher is set up, or it isn't answering; nothing was sent }

  /deck/switcher/program/{input}:
    get:
      tags: [Switcher]
      summary: Cut an input straight to program
      description: The input by its number or name, as for preview.
      operationId: switcherProgram
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Done. Returns the switcher's program and preview inputs and its keys after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitcherDone' }
        '404': { description: No such input or key on this switcher, or not one of the links listed here }
        '409': { description: No switcher is set up, or it isn't answering; nothing was sent }

  /deck/switcher/usk/{key}/{action}:
    get:
      tags: [Switcher]
      summary: An upstream key on or off
      description: Upstream key 1 to 4 on an ATEM Mini Extreme, 1 on an ATEM Mini or Mini Pro. On and off are cuts.
      operationId: switcherUpstreamKey
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [on, off, toggle] }
      responses:
        '200':
          description: Done. Returns the switcher's program and preview inputs and its keys after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitcherDone' }
        '404': { description: No such input or key on this switcher, or not one of the links listed here }
        '409': { description: No switcher is set up, or it isn't answering; nothing was sent }

  /deck/switcher/dsk/{key}/{action}:
    get:
      tags: [Switcher]
      summary: A downstream key on or off
      description: Downstream key 1 or 2 on an ATEM Mini Extreme, 1 on an ATEM Mini or Mini Pro. On, off and toggle are cuts; auto takes it on or off at the key's own rate.
      operationId: switcherDownstreamKey
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [on, off, toggle, auto] }
      responses:
        '200':
          description: Done. Returns the switcher's program and preview inputs and its keys after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitcherDone' }
        '404': { description: No such input or key on this switcher, or not one of the links listed here }
        '409': { description: No switcher is set up, or it isn't answering; nothing was sent }

  /deck/switcher/macro/{macro}:
    get:
      tags: [Switcher]
      summary: Run a macro saved on the switcher
      description: Numbered from 1, as in ATEM Software Control. For anything Studio has no link for.
      operationId: switcherMacro
      parameters:
        - name: macro
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Done. Returns the switcher's program and preview inputs and its keys after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitcherDone' }
        '404': { description: No such input or key on this switcher, or not one of the links listed here }
        '409': { description: No switcher is set up, or it isn't answering; nothing was sent }

  /api/scene/media:
    get:
      tags: [Scene]
      summary: List the media folder
      description: >-
        Every song, video and image in the media folder (the Output page's Media folder list). With `?uses=1` each one
        also lists where it's used.
      operationId: listMedia
      parameters:
        - name: uses
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: The media folder
          content:
            application/json:
              schema:
                type: object
                properties:
                  media: { type: array, items: { $ref: '#/components/schemas/MediaFile' } }
                  canConvert: { type: boolean, description: There is an ffmpeg to convert a .mov with }
    delete:
      tags: [Scene]
      summary: Remove a file from the media folder
      description: >-
        Deletes the file for good (a levelled song's original too). A file that's used somewhere answers 409 with its
        uses unless `force=1` is added; one on air now (a source showing it, the song playing) or still converting
        answers 409 even then. Removing it takes it out of the playlists, the super shot song and sponsors' ads;
        sources, page themes and sequence music keep its name and show it as missing.
      operationId: removeMedia
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, example: Pre-game bed.m4a }
        - name: force
          in: query
          required: false
          schema: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: string }
                  uses: { type: array, items: { $ref: '#/components/schemas/MediaUse' } }
                  media: { type: array, items: { $ref: '#/components/schemas/MediaFile' } }
        '404': { description: No such file in the media folder, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409':
          description: Used (without force), on air, or still converting
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  uses: { type: array, items: { $ref: '#/components/schemas/MediaUse' } }

components:
  responses:
    Ok:
      description: Done. Returns a short summary of the scoreboard after the change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DeckResult' }
    UnknownLink:
      description: The link isn't one of the ones listed here.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    SwitcherDone:
      type: object
      properties:
        ok: { type: boolean }
        done: { type: string, description: 'What was done, as the log says it ("cut to Camera 2")' }
        program: { type: integer, description: The input on program }
        preview: { type: integer, description: The input on preview }
        usk: { type: array, items: { type: boolean }, description: Each upstream key, on air or not }
        dsk: { type: array, items: { type: boolean }, description: Each downstream key, on air or not }
    MediaFile:
      type: object
      properties:
        name: { type: string, example: Pre-game bed.m4a }
        kind: { type: string, enum: [audio, video, image] }
        size: { type: integer, description: Bytes }
        duration: { type: number, nullable: true, description: Seconds, for songs and videos once measured }
        converting: { type: boolean }
        converted: { type: string, description: The WebM a .mov was converted to }
        uses: { type: array, items: { $ref: '#/components/schemas/MediaUse' }, description: 'With ?uses=1' }
    MediaUse:
      type: object
      properties:
        type: { type: string, enum: [source, theme, sequence, playlist, superShot, player, sponsor] }
        name: { type: string, description: 'The source, sequence, playlist or sponsor' }
        competition: { type: string, description: The competition a sequence belongs to }
        onAir: { type: boolean, description: On screen or playing now }
    DeckResult:
      type: object
      properties:
        ok: { type: boolean, example: true }
        home: { type: integer, description: Home score, example: 12 }
        away: { type: integer, description: Away score, example: 9 }
        source: { type: string, enum: [playhq, manual] }
        clockRunning: { type: boolean }
    Error:
      type: object
      properties:
        error: { type: string, example: 'Unknown Stream Deck link /deck/clock/adjust/abc. See the Stream Deck page, /api.html.' }
    Team:
      type: object
      properties:
        name: { type: string, example: "Travis' Disciples" }
        score: { type: integer, example: 12 }
    Scoreboard:
      type: object
      properties:
        source: { type: string, enum: [playhq, manual] }
        gameId: { type: string, nullable: true }
        competition: { type: string, example: Thunder League }
        division: { type: string, example: Division 1 }
        court: { type: string, example: Court 1 }
        home: { $ref: '#/components/schemas/Team' }
        away: { $ref: '#/components/schemas/Team' }
        period: { type: integer, description: 'Quarter, 1 to 4, or 5 for extra time', example: 2 }
        showClock: { type: boolean }
        tickerSpeed: { type: integer, description: 'How fast ticker.html scrolls, in pixels a second', example: 120 }
        clock:
          type: object
          properties:
            lengthSec: { type: integer, description: Quarter length in seconds, example: 600 }
            running: { type: boolean }
        clockElapsedMs: { type: integer, description: 'Time gone in this quarter, in milliseconds, at serverNow' }
        serverNow: { type: integer, description: Server time in milliseconds since 1970 }
