<!doctype html>
<html lang="en" data-chroma-alpha="#stage">
<head>
<meta charset="utf-8">
<title>Scene · FirstPass Studio</title>
<!--
  The scene built on the Output page (output.html): every source drawn as a layer on one
  1920 x 1080 transparent frame, top layer first, shown and hidden with each source's fade.
  It follows the helper's scene straight away (server-sent events), so a Stream Deck press
  shows at once. ?mute=1 silences every video and the music (the Output page's preview). The
  other pages still work on their own at their own links.
  The Mac app's display outputs (desktop/outputs.ts) open it full screen with ?fit=1 (scales the
  frame to the window), ?bg=<hex> (a background colour: black for fill, the chroma colour for chroma)
  and ?key=1 (the key signal: white wherever the scene isn't see-through, grey where it's partly
  see-through, on black). The chroma outputs add ?chromaKey=true (chroma.js): every source drawn
  chroma key safe, with nothing half see-through, and sources cut instead of fading.
  ?canvas=1 is another program's copy of an output (the canvas links on the Devices tab): it shows what the Output
  page's preview of that output shows, silent unless ?sound=1. In a 3840 x 2160 window it's drawn at 2x (zoom.js), and
  the pages inside at twice the density, so it goes sharp over a 4K recording (with 4K replay).
  ?output=<id> draws one of the outputs besides the primary (outputs.js): the sources turned on for that
  output, with their sound. The music and the mics are Output 1's (music.ts, mics.ts): the primary's window plays
  them, and the other outputs' windows play without them.
  Output 1's own window in the app (?fit=1, not muted, not the key) also mixes in the mics plugged into the
  Mac (mics.ts), so they go out with the rest of its sound; a Scene View never plays them.
  ?copy=1&sink=<device> is an output's sound copy (desktop/soundcopy.ts, a named device in the Output page's "Sound
  goes to"): a hidden window playing that output's sound to that one sound output of the Mac (its mixers' setSinkId), such as
  the commentators' mixer, with only the Mac's mics in ?mics=<id,id> (none without it; ?mics=all for every one, on
  Output 1's main destination). It says nothing to Studio (videos ending, the music ending, the mics' meters): the
  output's own window does that, unless ?main=1 says it is the output's main destination, when it reports the mics'
  meters (the own window may be muted). It plays nothing until it has found the device, so none of it is heard on
  the Mac's own speakers.
  Every window that plays sound (an output's own window, a sound copy) tells Studio how loud it is and what its device
  plays at, for the status board's Sound out (see "How loud this window plays" below).
-->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .layer { position: absolute; transform-origin: 0 0; opacity: 0; transition-property: opacity; transition-timing-function: linear; pointer-events: none; }
  .layer.on { opacity: 1; }
  .layer iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
  .layer img, .layer video { display: block; }
  /* Key output: every pixel of a layer turns white, keeping its transparency, so on black it reads as the alpha. */
  body.key .layer { filter: brightness(0) invert(1); }
  body.fit { cursor: none; }
  /* Chroma key safe (chroma.js, ?chromaKey=true): a fade would be half see-through over the key colour, so sources cut. */
  html.chroma-safe .layer { transition-duration: 0s !important; }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="sceneevents.js"></script>
<script src="autoreload.js"></script>
<script src="sfx.js"></script>
</head>
<body>
<div id="stage"></div>
<script type="module" src="scene.js"></script>
</body>
</html>
