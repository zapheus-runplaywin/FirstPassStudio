<!doctype html>
<html lang="en" data-chroma-alpha="#stage">
<head>
<meta charset="utf-8">
<title>Scene · FirstPass Studio</title>
<!--
  The scene built on the Output page (output.html): every source drawn as a layer on one
  1920 x 1080 transparent frame, top layer first, shown and hidden with each source's fade.
  It follows the helper's scene straight away (server-sent events), so a Stream Deck press
  shows at once. ?mute=1 silences every video and the music (the Output page's preview). The
  other pages still work on their own at their own links.
  The Mac app's display outputs (desktop/outputs.js) open it full screen with ?fit=1 (scales the
  frame to the window), ?bg=<hex> (a background colour: black for fill, the chroma colour for chroma)
  and ?key=1 (the key signal: white wherever the scene isn't see-through, grey where it's partly
  see-through, on black). The chroma outputs add ?chromaKey=true (chroma.js): every source drawn
  chroma key safe, with nothing half see-through, and sources cut instead of fading.
-->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .layer { position: absolute; transform-origin: 0 0; opacity: 0; transition-property: opacity; transition-timing-function: linear; pointer-events: none; }
  .layer.on { opacity: 1; }
  .layer iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
  .layer img, .layer video { display: block; }
  /* Key output: every pixel of a layer turns white, keeping its transparency, so on black it reads as the alpha. */
  body.key .layer { filter: brightness(0) invert(1); }
  body.fit { cursor: none; }
  /* Chroma key safe (chroma.js, ?chromaKey=true): a fade would be half see-through over the key colour, so sources cut. */
  html.chroma-safe .layer { transition-duration: 0s !important; }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="sceneevents.js"></script>
<script src="autoreload.js"></script>
<script src="sfx.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  const layers = new Map(); // source id -> { el, src, token, shown, loaded }
  const LOAD_WAIT_MS = 2500; // longest a page waits to finish loading before it fades in anyway
  let first = true;
  const params = new URLSearchParams(location.search);
  let silent = params.get('mute') === '1'; // the Output page's preview and the key output play no sound
  // The Output page turns its preview's sound on and off with this (it plays only while no video output is on), without a reload.
  // A browser that won't play sound until the page is clicked pauses a video as it's unmuted (or
  // refuses to play it): it then plays muted, and soundState() says so.
  let blocked = false;
  window.setSilent = on => {
    silent = !!on;
    for (const L of layers.values()) {
      const v = L.el.querySelector('video');
      if (!v || !L.src) continue;
      const wasMuted = v.muted;
      v.muted = !L.src.sound || silent;
      if (!wasMuted || v.muted || !L.src.visible) continue;
      blocked = false;
      const fallBack = () => { blocked = true; v.muted = true; v.play().catch(() => {}); };
      if (v.paused) v.play().catch(err => { if (err.name === 'NotAllowedError') fallBack(); });
      setTimeout(() => { if (L.src.visible && v.paused && !v.ended) fallBack(); }, 300);
    }
    renderMusic(music);
    pageSoundLevel();
  };
  // Called by the Output page during a click: Safari lets a video play sound later only if it was played
  // during a click, so start and stop the hidden ones too (muted as they are, so nothing is heard).
  window.unlockSound = () => {
    for (const L of layers.values()) {
      const v = L.el.querySelector('video');
      if (v && L.src && !L.src.visible && v.paused) { v.play().then(() => v.pause()).catch(() => {}); }
    }
    if (audio.paused) audio.play().then(() => { if (!music || music.status !== 'playing') audio.pause(); }).catch(() => {});
    if (sfxCtx && sfxCtx.state === 'suspended') sfxCtx.resume().catch(() => {});
    window.setSilent(false);
  };
  // For the Output page: how many shown videos play sound here, and whether the browser blocks it.
  window.soundState = () => {
    let videos = 0;
    for (const L of layers.values()) if (L.src && L.src.type === 'video' && L.src.visible && L.src.sound) videos++;
    const pages = [...layers.values()].filter(L => L.sound && L.src.visible).length;
    return { videos, pages, blocked: blocked || (pages > 0 && !!sfxCtx && sfxCtx.state === 'suspended'), music: !!music && music.status === 'playing' };
  };
  if (/^[0-9a-f]{6}$/i.test(params.get('bg') || '')) document.documentElement.style.background = document.body.style.background = '#' + params.get('bg');
  if (params.get('key') === '1') { document.body.classList.add('key'); document.documentElement.style.background = document.body.style.background = '#000'; }
  // Full screen on a display: scale the 1920 x 1080 frame to fit the window, centred.
  if (params.get('fit') === '1') {
    document.body.classList.add('fit');
    const fit = () => {
      const k = Math.min(innerWidth / 1920, innerHeight / 1080);
      Object.assign(document.documentElement.style, { width: '100vw', height: '100vh' });
      Object.assign(document.body.style, { width: '100vw', height: '100vh' });
      Object.assign(stage.style, { transformOrigin: '0 0', transform: `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})` });
    };
    addEventListener('resize', fit);
    fit();
  }

  // Runs fn on the next frame, so a layer fades in rather than just appearing. A window that's hidden or
  // covered (the popped-out Scene View behind the Output page) gets no frames, so a timer stands in:
  // otherwise it would show nothing new until it was looked at again.
  const nextFrame = fn => {
    let done = false;
    const once = () => { if (!done) { done = true; fn(); } };
    requestAnimationFrame(once);
    setTimeout(once, 100);
  };

  const addressOf = s => /^https?:\/\//i.test(s.url) ? s.url : '/' + s.url;

  // A video finished, or a page animated away: the helper switches the source off (once, however many
  // scene windows say so). showSeq names the time it came on, so a late word can't turn off a new showing.
  function tellDone(src, showSeq) {
    fetch('/api/scene', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type: 'ended', id: src.id, loadSeq: src.loadSeq, showSeq }) }).catch(() => {});
  }
  // Pages that animate away say so with done.js (postMessage { studio: 'done' }); pages with sound (the intro and
  // outro) send their plan with pagesound.js (postMessage { studio: 'sound', plan }).
  addEventListener('message', e => {
    if (!e.data || (e.data.studio !== 'done' && e.data.studio !== 'sound')) return;
    for (const L of layers.values()) {
      const f = L.el.querySelector('iframe');
      if (!f || f.contentWindow !== e.source) continue;
      if (e.data.studio === 'sound') { if (L.src.visible) playPageSound(L, e.data.plan); continue; }
      // A page loaded fresh each time it's shown names that showing; one kept loaded names this one.
      if (L.src.visible && L.shown) tellDone(L.src, L.src.reloadOnShow ? L.pageShow : L.src.showSeq);
    }
  });
  // Page sound (sfx.js): every scene window plays it, and a silent one (the preview, the key output) at no volume, so
  // the Output page can turn its preview's sound on part way through. It stops when the source goes off.
  let sfxCtx = null, sfxOut = null;
  function pageSoundLevel() {
    if (!sfxOut) return;
    const t = sfxCtx.currentTime;
    sfxOut.gain.cancelScheduledValues(t);
    sfxOut.gain.setTargetAtTime(silent ? 0 : 1, t, .05);
  }
  function playPageSound(L, plan) {
    if (typeof StudioSfx === 'undefined' || !plan) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!sfxCtx) {
      sfxCtx = new Ctx();
      sfxOut = sfxCtx.createGain();
      sfxOut.gain.value = silent ? 0 : 1;
      sfxOut.connect(sfxCtx.destination);
    }
    if (sfxCtx.state === 'suspended') sfxCtx.resume().catch(() => {});
    stopPageSound(L, .1);
    L.sound = StudioSfx.run(sfxCtx, sfxOut, { ...plan, onBlocked: () => { blocked = true; } });
  }
  function stopPageSound(L, fade = .4) {
    if (L.sound) { L.sound.stop(fade); L.sound = null; }
  }

  function create(s) {
    const el = document.createElement('div');
    el.className = 'layer';
    el.dataset.id = s.id;
    if (s.type === 'browser') {
      const f = document.createElement('iframe');
      f.setAttribute('allowtransparency', 'true');
      f.setAttribute('scrolling', 'no');
      f.allow = 'autoplay';
      f.title = s.name;
      el.appendChild(f);
    } else if (s.type === 'video') {
      const v = document.createElement('video');
      v.playsInline = true;
      v.preload = 'auto';
      v.muted = true;
      // Tell the helper when a video ends, so one set to hide when done fades out everywhere, and a
      // sequence waiting for it moves on.
      v.addEventListener('ended', () => {
        const L = layers.get(s.id), src = L && L.src;
        if (src && src.visible && !src.loop) tellDone(src, L.playShow);
      });
      el.appendChild(v);
    } else {
      el.appendChild(document.createElement('img'));
    }
    stage.appendChild(el);
    return { el, src: {}, token: 0, shown: false, loaded: '' };
  }

  // Loads (or reloads) a browser source's page; resolves when it has loaded, or after LOAD_WAIT_MS.
  function loadPage(L, s) {
    const f = L.el.querySelector('iframe');
    const want = `${addressOf(s)}#${s.loadSeq}`;
    L.loaded = want;
    L.pageShow = s.showSeq;
    stopPageSound(L, .1);
    return new Promise(resolve => {
      const done = () => { clearTimeout(t); f.removeEventListener('load', done); resolve(); };
      const t = setTimeout(done, LOAD_WAIT_MS);
      f.addEventListener('load', done);
      f.src = addressOf(s);
    });
  }
  function unloadPage(L) {
    const f = L.el.querySelector('iframe');
    if (f && L.loaded) { f.src = 'about:blank'; L.loaded = ''; }
  }

  async function update(L, s, z) {
    const old = L.src;
    L.src = s;
    const el = L.el;
    el.style.zIndex = z;
    el.style.left = s.x + 'px';
    el.style.top = s.y + 'px';
    el.style.transform = `scale(${s.scale / 100})`;
    el.style.transitionDuration = (first ? 0 : s.fadeMs) + 'ms';
    if (s.type === 'browser') {
      el.style.width = s.width + 'px';
      el.style.height = s.height + 'px';
    } else {
      const media = el.querySelector('img, video');
      const want = '/media/' + encodeURIComponent(s.file);
      if (media.getAttribute('src') !== want) media.src = want;
    }
    if (s.type === 'video') return updateVideo(L, s, old);

    const token = ++L.token;
    const pageKey = s.type === 'browser' ? `${addressOf(s)}#${s.loadSeq}` : '';
    if (s.visible) {
      // A page loads when it's shown (fresh each time),
      // or once and kept running with reloadOnShow off. Restart reloads it either way.
      const needsLoad = s.type === 'browser' && (L.loaded !== pageKey || (s.reloadOnShow && !L.shown));
      if (needsLoad) await loadPage(L, s);
      if (token !== L.token) return; // changed again while loading
      L.shown = true;
      nextFrame(() => { if (token === L.token) el.classList.add('on'); });
    } else {
      el.classList.remove('on');
      L.shown = false;
      stopPageSound(L, Math.max(.1, (first ? 0 : s.fadeMs) / 1000));
      if (s.type === 'browser') {
        if (!s.reloadOnShow && L.loaded !== pageKey) loadPage(L, s); // keep it ready to show at once
        else if (s.reloadOnShow) setTimeout(() => { if (token === L.token) unloadPage(L); }, first ? 0 : s.fadeMs + 50);
      }
    }
  }

  // Videos play while shown and pause once faded out. They start from the top each time
  // they're shown (unless restartOnShow is off) and on Restart; sound follows the source.
  function updateVideo(L, s, old) {
    const v = L.el.querySelector('video'), el = L.el;
    const token = ++L.token;
    v.loop = s.loop;
    v.muted = !s.sound || silent;
    v.volume = s.volume / 100;
    const restarted = old.loadSeq !== undefined && old.loadSeq !== s.loadSeq;
    if (s.visible) {
      if (restarted || (!L.shown && s.restartOnShow)) { try { v.currentTime = 0; } catch {} }
      if (!L.shown) L.playShow = s.showSeq;
      if (v.paused || v.ended) v.play().catch(err => {
        // A browser that won't autoplay with sound still plays it muted.
        if (err.name === 'NotAllowedError' && !v.muted) { v.muted = true; blocked = true; v.play().catch(() => {}); console.warn(`Video "${s.name}" is playing muted: this browser blocks sound until the page is clicked`); }
        else console.warn(`Video "${s.name}" would not play: ${err.message}`);
      });
      L.shown = true;
      nextFrame(() => { if (token === L.token) el.classList.add('on'); });
    } else {
      el.classList.remove('on');
      L.shown = false;
      setTimeout(() => { if (token === L.token) v.pause(); }, first ? 0 : s.fadeMs + 50);
    }
  }

  // ─── Music (music.js) ───────────────────────────────────────────────────
  // Studio keeps the player: the track, where it is (pos: sec at time at), and its fade (gain: from, to,
  // at, ms). Each scene window plays it, unless it's silent, so music goes wherever video sound goes.
  const audio = new Audio();
  audio.preload = 'auto';
  let music = null, musicPlayId = -1, level = 0;
  const musicPos = m => m.status === 'playing' ? m.pos.sec + (Date.now() - m.pos.at) / 1000 : m.pos.sec;
  // Fades ease in and out (no sudden start or stop) and follow how loud they sound: a straight line in
  // volume sounds like nothing much happens and then the music drops away at the end.
  const ease = x => x * x * (3 - 2 * x);
  const along = (e, t) => !e.ms || t >= e.at + e.ms ? e.to : e.from + (e.to - e.from) * ease(Math.max(0, (t - e.at) / e.ms));
  const heard = x => x * x * x; // 0..1 along the fade to volume, close to even steps in loudness
  function musicGain(m) {
    if (!m || m.status === 'stopped') return 0;
    const t = Date.now();
    // The duck fades too, over the fade out or in time (duck: 0 up, 1 down at duckTo), evenly in loudness between
    // the two levels; a Studio without it just switches.
    const down = m.duck ? along(m.duck, t) : m.ducked ? 1 : 0;
    const low = Math.max(m.duckTo / 100, 0.01);
    const duck = down >= 1 ? m.duckTo / 100 : Math.pow(low, down);
    return heard(along(m.gain, t)) * (m.volume / 100) * (m.level / 100) * duck * (m.muted ? 0 : 1);
  }
  // The volume follows the fade, easing mute and the video lowering in and out.
  setInterval(() => {
    const target = silent ? 0 : musicGain(music);
    level += (target - level) * 0.25;
    if (Math.abs(target - level) < 0.001) level = target;
    audio.volume = Math.max(0, Math.min(1, level));
  }, 25);
  function seek(sec) {
    if (audio.readyState >= 1) { try { audio.currentTime = sec; } catch {} return; }
    audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = music ? musicPos(music) : sec; } catch {} }, { once: true });
  }
  function renderMusic(m) {
    music = m || null;
    if (!music || !music.track || music.status === 'stopped' || silent) { if (!audio.paused) audio.pause(); if (!music || !music.track) audio.removeAttribute('src'); return; }
    const want = '/media/' + encodeURIComponent(music.track);
    if (audio.getAttribute('src') !== want) audio.src = want;
    const pos = musicPos(music);
    if (music.playId !== musicPlayId || Math.abs(audio.currentTime - pos) > 1.5) seek(pos);
    musicPlayId = music.playId;
    if (music.status === 'playing' && audio.paused) audio.play().catch(err => {
      if (err.name === 'NotAllowedError') { blocked = true; console.warn('Music is waiting: this browser blocks sound until the page is clicked'); }
      else console.warn(`Music would not play: ${err.message}`);
    });
    if (music.status === 'paused' && !audio.paused) audio.pause();
  }
  // Studio moves on when the track's length is up; this covers a track whose length it couldn't measure.
  audio.addEventListener('ended', () => {
    if (music && music.status === 'playing') fetch('/api/scene', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type: 'musicEnded', playId: music.playId }) }).catch(() => {});
  });

  function render(scene) {
    const seen = new Set();
    scene.sources.forEach((s, i) => {
      seen.add(s.id);
      let L = layers.get(s.id);
      if (L && L.src.type !== s.type) { L.el.remove(); L = null; }
      if (!L) { L = create(s); layers.set(s.id, L); }
      update(L, s, scene.sources.length - i);
    });
    for (const [id, L] of layers) if (!seen.has(id)) { stopPageSound(L, .1); L.el.remove(); layers.delete(id); }
    renderMusic(scene.music);
    first = false;
  }

  sceneEvents(render);
</script>
</body>
</html>
