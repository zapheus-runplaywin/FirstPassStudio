<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Competition logo animation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="log.js"></script>
<style>
  /* The competition logo from the active setup, animated in the middle of the frame for about 5 seconds.
     Two styles: fun (the default: swoops in, slams down, rockets out) and pro (a clean wipe, line and shine).
     Colours and font come from the competition setup (theme.css). Transparent apart from the animation. */
  :root { --size: 640px; --speed: 1; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--font); }
  .stage { position: absolute; inset: 0; visibility: hidden; }
  .stage.go { visibility: visible; }
  .centre { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
  /* translate (not transform) centres each layer, so the spins and scales below turn about its middle */
  .centre > * { position: absolute; left: 0; top: 0; translate: -50% -50%; }
  .logo { display: block; height: var(--size); max-width: calc(var(--size) * 1.8); object-fit: contain; }
  .logo-box { position: relative; line-height: 0; }
  .stage[data-style="fun"] .pro-only, .stage[data-style="pro"] .fun-only { display: none; }

  /* ---------- Fun ---------- */
  /* One big logo that swoops in around the screen with a motion trail, slams down in the middle (shockwave, flash,
     shake, starburst and confetti), holds there making a statement, then winds up and rockets out through the camera.
     Times are in seconds at ?speed=1: swoop 0 to 1.3, landing 1.3, hold to 4.2, exit 4.2 to 4.9. */
  .flyer { opacity: 0; }
  .flyer .logo { filter: drop-shadow(0 14px 36px rgba(0,0,0,.55)); }
  .go .flyer { animation: swoop calc(1.3s / var(--speed)) linear calc(var(--lag, 0s) / var(--speed)) forwards; }
  .go.out .flyer { animation: zoomOut calc(.7s / var(--speed)) cubic-bezier(.5,0,.9,.5) calc(var(--lag, 0s) / var(--speed)) forwards; }
  @keyframes swoop {
    0%   { opacity: 1; transform: translate(-1350px, 760px) rotate(-70deg) scale(.18); animation-timing-function: cubic-bezier(.3,.6,.6,1); }
    30%  { transform: translate(-560px, -330px) rotate(-25deg) scale(.38); animation-timing-function: cubic-bezier(.4,0,.6,1); }
    55%  { transform: translate(620px, -260px) rotate(28deg) scale(.55); animation-timing-function: cubic-bezier(.4,0,.6,1); }
    78%  { transform: translate(180px, 120px) rotate(8deg) scale(1.45); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    90%  { transform: translate(0, 0) rotate(-3deg) scale(.9); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes zoomOut {
    0%   { opacity: 1; transform: none; }
    28%  { opacity: 1; transform: scale(.86) rotate(-5deg); }
    100% { opacity: 0; transform: scale(3.6) rotate(14deg); }
  }
  /* Ghost copies a moment behind the logo make the motion trail; they hide while it holds still. */
  .trail .logo { filter: none; }
  .trail--1 { --lag: .05s; } .trail--2 { --lag: .1s; } .trail--3 { --lag: .15s; }
  .trail--1 .logo-box { opacity: .5; } .trail--2 .logo-box { opacity: .3; } .trail--3 .logo-box { opacity: .15; }
  .go .trail .logo-box { animation: trailHide calc(.15s / var(--speed)) linear calc(1.3s / var(--speed)) forwards; }
  .go.out .trail .logo-box { animation: none; }
  @keyframes trailHide { to { opacity: 0; } }
  /* The landing: a squash, then a slow push in while it holds */
  .go .hero .logo-box { animation: squash calc(.4s / var(--speed)) cubic-bezier(.3,1.6,.5,1) calc(1.3s / var(--speed)),
                                   push calc(2.5s / var(--speed)) ease-out calc(1.7s / var(--speed)) forwards; }
  @keyframes squash { 0% { transform: scale(1.12, .84); } 100% { transform: none; } }
  @keyframes push { from { transform: scale(1); } to { transform: scale(1.07); } }
  .go .centre { animation: shake calc(.45s / var(--speed)) linear calc(1.3s / var(--speed)); }
  @keyframes shake { 0%, 100% { transform: none; } 15% { transform: translate(-14px, 9px); } 30% { transform: translate(12px, -11px); }
                     45% { transform: translate(-9px, -6px); } 60% { transform: translate(7px, 8px); } 80% { transform: translate(-3px, 2px); } }

  /* Shockwave rings from the landing */
  .ring { width: calc(var(--size) * .5); height: calc(var(--size) * .5); border-radius: 50%; opacity: 0; box-sizing: border-box; }
  .ring--1 { border: 30px solid var(--purple); }
  .ring--2 { border: 18px solid var(--yellow); }
  .ring--3 { border: 10px solid var(--pink); }
  .go .ring--1 { animation: ring calc(.8s / var(--speed)) cubic-bezier(.1,.7,.3,1) calc(1.3s / var(--speed)); }
  .go .ring--2 { animation: ring calc(.85s / var(--speed)) cubic-bezier(.1,.7,.3,1) calc(1.4s / var(--speed)); }
  .go .ring--3 { animation: ring calc(.9s / var(--speed)) cubic-bezier(.1,.7,.3,1) calc(1.5s / var(--speed)); }
  @keyframes ring { 0% { opacity: 1; transform: scale(.3); } 70% { opacity: .9; } 100% { opacity: 0; transform: scale(5); } }

  /* Spinning starburst behind the logo while it holds, fading out at its edge */
  .burst { width: calc(var(--size) * 2.1); height: calc(var(--size) * 2.1); border-radius: 50%; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(var(--purple-rgb), .85) 0 9deg, rgba(var(--yellow-rgb), .75) 9deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.6) 42%, transparent 70%);
            mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.6) 42%, transparent 70%); }
  .go .burst { animation: burstIn calc(.5s / var(--speed)) cubic-bezier(.2,1.4,.4,1) calc(1.3s / var(--speed)) forwards,
                          spin calc(9s / var(--speed)) linear calc(1.3s / var(--speed)) infinite; }
  .go.out .burst { animation: burstOut calc(.5s / var(--speed)) cubic-bezier(.6,0,.9,.4) forwards; }
  @keyframes burstIn { 0% { opacity: 0; scale: .2; } 100% { opacity: 1; scale: 1; } }
  @keyframes spin { from { rotate: 0deg; } to { rotate: 360deg; } }
  @keyframes burstOut { from { opacity: 1; scale: 1; } to { opacity: 0; scale: .1; rotate: 200deg; } }

  /* Flash as the logo lands */
  .flash { width: calc(var(--size) * 1.8); height: calc(var(--size) * 1.8); border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(var(--yellow-rgb), .5) 35%, transparent 65%); }
  .go .flash { animation: flash calc(.5s / var(--speed)) ease-out calc(1.25s / var(--speed)); }
  @keyframes flash { 0% { opacity: 0; scale: .4; } 25% { opacity: 1; } 100% { opacity: 0; scale: 1.3; } }

  /* Confetti (pieces are made by the script) */
  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .bit { position: absolute; left: 960px; top: 540px; translate: -50% -50%; width: 18px; height: 10px; border-radius: 2px; opacity: 0; }
  .bit.dot { width: 13px; height: 13px; border-radius: 50%; }
  .go .bit { animation: fly var(--t) cubic-bezier(.15,.8,.35,1) var(--d) forwards; }
  @keyframes fly {
    0%   { opacity: 1; transform: rotate(0) scale(.6); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1); }
  }

  /* ---------- Pro ---------- */
  /* A soft glow of the main colour behind the logo */
  .glow { width: calc(var(--size) * 2.4); height: calc(var(--size) * 1.5); border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(var(--purple-rgb), .55), rgba(var(--purple-rgb), .2) 55%, transparent); }
  .go .glow { animation: fadeIn calc(1.2s / var(--speed)) ease-out forwards; }
  .go.out .glow { animation: fadeOut calc(.7s / var(--speed)) ease-in forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  /* Highlight lines that draw out from the middle, above and below the logo */
  .line { height: 4px; width: calc(var(--size) * 2); background: linear-gradient(90deg, transparent, var(--yellow) 18%, var(--yellow) 82%, transparent);
    transform: scaleX(0); }
  .line--top { top: calc(var(--size) * -.62); }
  .line--bottom { top: calc(var(--size) * .62); }
  .go .line { animation: lineIn calc(.7s / var(--speed)) cubic-bezier(.7,0,.2,1) calc(.1s / var(--speed)) forwards; }
  .go .line--bottom { animation-delay: calc(.2s / var(--speed)); }
  .go.out .line { animation: lineOut calc(.6s / var(--speed)) cubic-bezier(.7,0,.2,1) forwards; }
  @keyframes lineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes lineOut { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* The logo wipes up into place, settles, catches a light sweep, then fades away */
  .pro-logo { opacity: 0; }
  .pro-logo .logo { filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); }
  .go .pro-logo { animation: revealIn calc(1s / var(--speed)) cubic-bezier(.2,.8,.2,1) calc(.45s / var(--speed)) forwards; }
  .go .pro-logo .logo-box { animation: settle calc(3.5s / var(--speed)) ease-out calc(.45s / var(--speed)) forwards; }
  .go.out .pro-logo { animation: revealOut calc(.7s / var(--speed)) cubic-bezier(.6,0,.8,.4) forwards; }
  @keyframes revealIn {
    0%   { opacity: 0; clip-path: inset(100% -20% -20% -20%); transform: translateY(40px); filter: blur(6px); }
    100% { opacity: 1; clip-path: inset(-20% -20% -20% -20%); transform: none; filter: blur(0); }
  }
  @keyframes settle { from { transform: scale(1.06); } to { transform: scale(1); } }
  @keyframes revealOut { from { opacity: 1; transform: scale(1); filter: blur(0); }
                         to { opacity: 0; transform: scale(.96); filter: blur(6px); } }
  .shine { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%) no-repeat;
    background-size: 250% 100%; background-position: 160% 0;
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center; }
  .go .shine { animation: shine calc(1.1s / var(--speed)) ease-in-out calc(1.7s / var(--speed)) forwards; }
  @keyframes shine { from { background-position: 160% 0; } to { background-position: -60% 0; } }
</style>
</head>
<body>
  <!-- Add to OBS as a Browser source, 1920 x 1080:
       http://localhost:8080/logo.html            (fun: swoops in, slams down, rockets out)
       http://localhost:8080/logo.html?style=pro  (professional: clean wipe, lines and a light sweep)
       The competition logo comes from the competition setup page. Plays once when the page loads (about 5 seconds)
       and leaves the frame transparent; tick "Refresh browser when scene becomes active" in OBS to play it each time.
       Options: ?mode=light (the default) or ?mode=dark picks the setup's light or dark mode competition logo
                (a competition with only one logo uses it for both);
                ?out=0 keeps the logo on screen at the end instead of animating it away;
                ?size=640 is the logo's height in pixels; ?speed=1.5 plays it faster (0.5 slower). -->
  <div class="stage" id="stage" data-style="fun">
    <div class="confetti fun-only" id="confetti"></div>
    <div class="centre">
      <div class="burst fun-only"></div>
      <div class="glow pro-only"></div>
      <div class="ring ring--1 fun-only"></div>
      <div class="ring ring--2 fun-only"></div>
      <div class="ring ring--3 fun-only"></div>
      <div class="flash fun-only"></div>
      <div class="line line--top pro-only"></div>
      <div class="line line--bottom pro-only"></div>
      <div class="flyer trail trail--3 fun-only"><div class="logo-box"><img class="logo" alt=""></div></div>
      <div class="flyer trail trail--2 fun-only"><div class="logo-box"><img class="logo" alt=""></div></div>
      <div class="flyer trail trail--1 fun-only"><div class="logo-box"><img class="logo" alt=""></div></div>
      <div class="flyer hero fun-only"><div class="logo-box"><img class="logo" id="funLogo" alt=""></div></div>
      <div class="pro-logo pro-only"><div class="logo-box"><img class="logo" id="proLogo" alt=""><div class="shine" id="shine"></div></div></div>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const $ = id => document.getElementById(id);
      const stage = $('stage');
      const style = (params.get('style') || 'fun').toLowerCase() === 'pro' ? 'pro' : 'fun';
      stage.dataset.style = style;
      const dark = (params.get('mode') || params.get('theme') || 'light').toLowerCase() === 'dark';
      const num = k => { const v = parseFloat(params.get(k)); return Number.isFinite(v) && v > 0 ? v : null; };
      const speed = num('speed') || 1;
      if (num('size')) document.documentElement.style.setProperty('--size', num('size') + 'px');
      document.documentElement.style.setProperty('--speed', speed);

      // Confetti in the competition's colours, flying out from the middle as the logo lands.
      function confetti() {
        const box = $('confetti');
        const colours = ['var(--purple)', 'var(--yellow)', 'var(--pink)', '#ffffff', 'var(--purple-light)'];
        for (let i = 0; i < 110; i++) {
          const b = document.createElement('div');
          b.className = 'bit' + (i % 3 === 0 ? ' dot' : '');
          const angle = Math.random() * Math.PI * 2, dist = 380 + Math.random() * 760;
          b.style.background = colours[i % colours.length];
          b.style.setProperty('--x', Math.cos(angle) * dist * 1.3 + 'px');
          b.style.setProperty('--y', Math.sin(angle) * dist * .8 + 'px');
          b.style.setProperty('--r', (Math.random() * 1080 - 540) + 'deg');
          b.style.setProperty('--t', (1.4 + Math.random() * 1.4) / speed + 's');
          b.style.setProperty('--d', ((i < 70 ? 1.3 : 2.5) + Math.random() * .15) / speed + 's');
          box.appendChild(b);
        }
      }

      function play() {
        if (style === 'fun') confetti();
        stage.classList.add('go');
        if (params.get('out') !== '0') setTimeout(() => stage.classList.add('out'), (style === 'pro' ? 4400 : 4200) / speed);
      }

      async function load() {
        try {
          const res = await fetch('/api/scoreboard?board=' + encodeURIComponent(params.get('board') || '1'), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const rules = (await res.json()).rules || {};
          const logo = (dark ? rules.competitionLogoDark : rules.competitionLogoLight) || rules.competitionLogo;
          if (!logo) { console.warn('Logo animation: the competition setup has no competition logo'); return; }
          const img = $(style === 'pro' ? 'proLogo' : 'funLogo');
          // The light sweep only covers the logo's own shape.
          $('shine').style.webkitMaskImage = $('shine').style.maskImage = `url("${logo}")`;
          // Starts once the logo has loaded, so it never animates an empty box.
          let started = false;
          const start = () => { if (!started) { started = true; play(); } };
          img.onload = start;
          img.onerror = () => console.warn('Logo animation: could not load the competition logo', logo);
          img.src = logo;
          document.querySelectorAll('.trail .logo').forEach(t => { t.src = logo; });
          setTimeout(() => { if (!started && img.complete && img.naturalWidth) start(); }, 3000);
        } catch (err) { console.warn('Logo animation: competition logo unavailable:', err.message); }
      }
      load();
    })();
  </script>
</body>
</html>
