<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Competition logo animation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="logo-templates.css">
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="done.js"></script>
<script src="backdrop.js"></script>
<script src="fit.js"></script>
<style>
  /* The competition logo from the active setup, animated in the middle of the frame for about 5 seconds.
     Seventeen templates, picked with ?template=: fun (the default: swoops in, slams down, rockets out) and pro (a clean wipe,
     line and shine) are here; the other fifteen are in logo-templates.css and built by the script below.
     Colours and font come from the competition setup (theme.css). Transparent apart from the animation. */
  :root { --size: 640px; --speed: 1; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--font); }
  .stage { position: absolute; inset: 0; visibility: hidden; }
  .stage.go { visibility: visible; }
  .centre { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
  /* translate (not transform) centres each layer, so the spins and scales below turn about its middle */
  .centre > * { position: absolute; left: 0; top: 0; translate: -50% -50%; translate: round(-50%, 1px) round(-50%, 1px); }
  .logo { display: block; height: var(--size); max-width: calc(var(--size) * 1.8); object-fit: contain; }
  .logo-box { position: relative; line-height: 0; }
  .stage[data-style="fun"] .pro-only, .stage[data-style="pro"] .fun-only { display: none; }

  /* Optional full-frame background (?bg= gradient or colour, ?bgimage= picture). Off by default: the page is transparent.
     It fades in as the animation starts and out with the exit, so the frame is clear again at the end. */
  .backdrop { position: absolute; inset: 0; opacity: 0; background-size: cover; background-position: center; }
  .backdrop[hidden] { display: none; }
  /* The backdrop sits outside the stage so it stays full screen when fit.js fits the stage between the title and the scoreboard. */
  body:has(.stage.go) .backdrop { animation: fadeIn calc(.3s / var(--speed)) ease-out forwards; }
  body:has(.stage.go.out) .backdrop { animation: fadeOut calc(.5s / var(--speed)) ease-in calc(.2s / var(--speed)) both; }

  /* ---------- Fun ---------- */
  /* One big logo that swoops in around the screen with a motion trail, slams down in the middle (shockwave, flash,
     shake, starburst and confetti), holds there making a statement, then winds up and rockets out through the camera.
     Times are in seconds at ?speed=1: swoop 0 to 1.3, landing 1.3, hold to 4.2, exit 4.2 to 4.9. */
  .flyer { opacity: 0; }
  .flyer .logo { filter: drop-shadow(0 14px 36px rgba(0,0,0,.55)); }
  .go .flyer { animation: swoop calc(1.3s / var(--speed)) linear calc(var(--lag, 0s) / var(--speed)) forwards; }
  .go.out .flyer { animation: zoomOut calc(.7s / var(--speed)) cubic-bezier(.5,0,.9,.5) calc(var(--lag, 0s) / var(--speed)) forwards; }
  @keyframes swoop {
    0%   { opacity: 1; transform: translate(-1350px, 760px) rotate(-70deg) scale(.18); animation-timing-function: cubic-bezier(.3,.6,.6,1); }
    30%  { transform: translate(-560px, -330px) rotate(-25deg) scale(.38); animation-timing-function: cubic-bezier(.4,0,.6,1); }
    55%  { transform: translate(620px, -260px) rotate(28deg) scale(.55); animation-timing-function: cubic-bezier(.4,0,.6,1); }
    78%  { transform: translate(180px, 120px) rotate(8deg) scale(1.45); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    90%  { transform: translate(0, 0) rotate(-3deg) scale(.9); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes zoomOut {
    0%   { opacity: 1; transform: none; }
    28%  { opacity: 1; transform: scale(.86) rotate(-5deg); }
    100% { opacity: 0; transform: scale(3.6) rotate(14deg); }
  }
  /* Ghost copies a moment behind the logo make the motion trail; they hide while it holds still. */
  .trail .logo { filter: none; }
  .trail--1 { --lag: .05s; } .trail--2 { --lag: .1s; } .trail--3 { --lag: .15s; }
  .trail--1 .logo-box { opacity: .5; } .trail--2 .logo-box { opacity: .3; } .trail--3 .logo-box { opacity: .15; }
  .go .trail .logo-box { animation: trailHide calc(.15s / var(--speed)) linear calc(1.3s / var(--speed)) forwards; }
  .go.out .trail .logo-box { animation: none; }
  @keyframes trailHide { to { opacity: 0; } }
  /* Chroma key safe (chroma.js): see-through ghosts would key as solid copies, so there's no trail. */
  html.chroma-safe .trail { display: none; }
  /* The landing: a squash, then a slow push in while it holds */
  .go .hero .logo-box { animation: squash calc(.4s / var(--speed)) cubic-bezier(.3,1.6,.5,1) calc(1.3s / var(--speed)),
                                   push calc(2.5s / var(--speed)) ease-out calc(1.7s / var(--speed)) forwards; }
  @keyframes squash { 0% { transform: scale(1.12, .84); } 100% { transform: none; } }
  @keyframes push { from { transform: scale(1); } to { transform: scale(1.07); } }
  .go .centre { animation: shake calc(.45s / var(--speed)) linear calc(1.3s / var(--speed)); }
  @keyframes shake { 0%, 100% { transform: none; } 15% { transform: translate(-14px, 9px); } 30% { transform: translate(12px, -11px); }
                     45% { transform: translate(-9px, -6px); } 60% { transform: translate(7px, 8px); } 80% { transform: translate(-3px, 2px); } }

  /* Shockwave rings from the landing */
  .ring { width: calc(var(--size) * .5); height: calc(var(--size) * .5); border-radius: 50%; opacity: 0; box-sizing: border-box; }
  .ring--1 { border: 30px solid var(--purple); }
  .ring--2 { border: 18px solid var(--yellow); }
  .ring--3 { border: 10px solid var(--pink); }
  .go .ring--1 { animation: ring calc(.8s / var(--speed)) cubic-bezier(.1,.7,.3,1) calc(1.3s / var(--speed)); }
  .go .ring--2 { animation: ring calc(.85s / var(--speed)) cubic-bezier(.1,.7,.3,1) calc(1.4s / var(--speed)); }
  .go .ring--3 { animation: ring calc(.9s / var(--speed)) cubic-bezier(.1,.7,.3,1) calc(1.5s / var(--speed)); }
  @keyframes ring { 0% { opacity: 1; transform: scale(.3); } 70% { opacity: .9; } 100% { opacity: 0; transform: scale(5); } }

  /* Spinning starburst behind the logo while it holds, fading out at its edge */
  .burst { width: calc(var(--size) * 2.1); height: calc(var(--size) * 2.1); border-radius: 50%; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(var(--purple-rgb), .85) 0 9deg, rgba(var(--yellow-rgb), .75) 9deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.6) 42%, transparent 70%);
            mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.6) 42%, transparent 70%); }
  .go .burst { animation: burstIn calc(.5s / var(--speed)) cubic-bezier(.2,1.4,.4,1) calc(1.3s / var(--speed)) forwards,
                          spin calc(9s / var(--speed)) linear calc(1.3s / var(--speed)) infinite; }
  .go.out .burst { animation: burstOut calc(.5s / var(--speed)) cubic-bezier(.6,0,.9,.4) forwards; }
  @keyframes burstIn { 0% { opacity: 0; scale: .2; } 100% { opacity: 1; scale: 1; } }
  @keyframes spin { from { rotate: 0deg; } to { rotate: 360deg; } }
  @keyframes burstOut { from { opacity: 1; scale: 1; } to { opacity: 0; scale: .1; rotate: 200deg; } }

  /* Flash as the logo lands */
  .flash { width: calc(var(--size) * 1.8); height: calc(var(--size) * 1.8); border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(var(--yellow-rgb), .5) 35%, transparent 65%); }
  .go .flash { animation: flash calc(.5s / var(--speed)) ease-out calc(1.25s / var(--speed)); }
  @keyframes flash { 0% { opacity: 0; scale: .4; } 25% { opacity: 1; } 100% { opacity: 0; scale: 1.3; } }

  /* Confetti (pieces are made by the script) */
  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .bit { position: absolute; left: 960px; top: 540px; translate: -50% -50%; width: 18px; height: 10px; border-radius: 2px; opacity: 0; }
  .bit.dot { width: 13px; height: 13px; border-radius: 50%; }
  .go .bit { animation: fly var(--t) cubic-bezier(.15,.8,.35,1) var(--d) forwards; }
  @keyframes fly {
    0%   { opacity: 1; transform: rotate(0) scale(.6); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1); }
  }

  /* ---------- Pro ---------- */
  /* A soft glow of the main colour behind the logo */
  .glow { width: calc(var(--size) * 2.4); height: calc(var(--size) * 1.5); border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(var(--purple-rgb), .55), rgba(var(--purple-rgb), .2) 55%, transparent); }
  .go .glow { animation: fadeIn calc(1.2s / var(--speed)) ease-out forwards; }
  .go.out .glow { animation: fadeOut calc(.7s / var(--speed)) ease-in forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  /* Highlight lines that draw out from the middle, above and below the logo */
  .line { height: 4px; width: calc(var(--size) * 2); background: linear-gradient(90deg, transparent, var(--yellow) 18%, var(--yellow) 82%, transparent);
    transform: scaleX(0); }
  .line--top { top: calc(var(--size) * -.62); }
  .line--bottom { top: calc(var(--size) * .62); }
  .go .line { animation: lineIn calc(.7s / var(--speed)) cubic-bezier(.7,0,.2,1) calc(.1s / var(--speed)) forwards; }
  .go .line--bottom { animation-delay: calc(.2s / var(--speed)); }
  .go.out .line { animation: lineOut calc(.6s / var(--speed)) cubic-bezier(.7,0,.2,1) forwards; }
  @keyframes lineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes lineOut { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* The logo wipes up into place, settles, catches a light sweep, then fades away */
  .pro-logo { opacity: 0; }
  .pro-logo .logo { filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); }
  .go .pro-logo { animation: revealIn calc(1s / var(--speed)) cubic-bezier(.2,.8,.2,1) calc(.45s / var(--speed)) forwards; }
  .go .pro-logo .logo-box { animation: settle calc(3.5s / var(--speed)) ease-out calc(.45s / var(--speed)) forwards; }
  .go.out .pro-logo { animation: revealOut calc(.7s / var(--speed)) cubic-bezier(.6,0,.8,.4) forwards; }
  @keyframes revealIn {
    0%   { opacity: 0; clip-path: inset(100% -20% -20% -20%); transform: translateY(40px); filter: blur(6px); }
    100% { opacity: 1; clip-path: inset(-20% -20% -20% -20%); transform: none; filter: blur(0); }
  }
  @keyframes settle { from { transform: scale(1.06); } to { transform: scale(1); } }
  @keyframes revealOut { from { opacity: 1; transform: scale(1); filter: blur(0); }
                         to { opacity: 0; transform: scale(.96); filter: blur(6px); } }
  .shine { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%) no-repeat;
    background-size: 250% 100%; background-position: 160% 0;
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center; }
  .go .shine { animation: shine calc(1.1s / var(--speed)) ease-in-out calc(1.7s / var(--speed)) forwards; }
  @keyframes shine { from { background-position: 160% 0; } to { background-position: -60% 0; } }
</style>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/logo.html?template=fun  (fun, also the default with no template: swoops in, slams down, rockets out)
       http://localhost:8080/logo.html?template=pro  (professional: clean wipe, lines and a light sweep)
       ?template=coin, tiles, slices, glitch, badge, doors, bounce, lightning, rings or title, or the netball ones goal, court,
       bibs, pass or net, picks one of the others
       (listed in the script below), and ?template=random a different one each time.
       The competition logo comes from the competition setup page. Plays once when the page loads (about 5 seconds)
       and leaves the frame transparent, so it plays each time it comes on.
       Options: ?mode=light (the default) or ?mode=dark picks the setup's light or dark mode competition logo
                (a competition with only one logo uses it for both);
                ?out=0 keeps the logo on screen at the end instead of animating it away;
                ?size=640 is the logo's height in pixels; ?speed=1.5 plays it faster (0.5 slower);
                ?bg=gradient puts a dark radial gradient behind it, ?bg=7f4092 (or a colour name) a radial gradient from that
                colour to a darker shade (?bg2= sets the edge colour), ?bg=solid-7f4092 a flat colour, and
                ?bgimage=court.jpg a picture from the competition's brand folder (or a full link). The background fades in
                and out with the animation; without these the page is transparent. -->
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="stage" id="stage" data-style="fun" data-fit-box="220 860">
    <div class="confetti fun-only" id="confetti"></div>
    <div class="centre">
      <div class="burst fun-only"></div>
      <div class="glow pro-only"></div>
      <div class="ring ring--1 fun-only"></div>
      <div class="ring ring--2 fun-only"></div>
      <div class="ring ring--3 fun-only"></div>
      <div class="flash fun-only"></div>
      <div class="line line--top pro-only"></div>
      <div class="line line--bottom pro-only"></div>
      <div class="flyer trail trail--3 fun-only"><div class="logo-box"><img class="logo" alt=""></div></div>
      <div class="flyer trail trail--2 fun-only"><div class="logo-box"><img class="logo" alt=""></div></div>
      <div class="flyer trail trail--1 fun-only"><div class="logo-box"><img class="logo" alt=""></div></div>
      <div class="flyer hero fun-only"><div class="logo-box"><img class="logo" id="funLogo" alt=""></div></div>
      <div class="pro-logo pro-only"><div class="logo-box"><img class="logo" id="proLogo" alt=""><div class="shine" id="shine"></div></div></div>
    </div>
    <div id="tpl"></div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const $ = id => document.getElementById(id);
      const stage = $('stage');
      // ?template= picks the animation. fun and pro are the two
      // originals in this page; the rest are built by TEMPLATES below and styled in logo-templates.css.
      const NAMES = ['fun', 'pro', 'coin', 'tiles', 'slices', 'glitch', 'badge', 'doors', 'bounce', 'lightning', 'rings', 'title', 'goal', 'court', 'bibs', 'pass', 'net'];
      let template = (params.get('template') || 'fun').trim().toLowerCase();
      if (template === 'random') template = NAMES[Math.floor(Math.random() * NAMES.length)];
      if (!NAMES.includes(template)) { console.warn('Logo animation: no template called', template, '- using fun. Templates:', NAMES.join(', ')); template = 'fun'; }
      console.log('Logo animation: template', template);
      const style = template === 'pro' ? 'pro' : 'fun';
      const built = template !== 'fun' && template !== 'pro';
      stage.dataset.style = style;
      stage.dataset.template = template;
      if (built) stage.classList.add('tpl', 't-' + template);
      if (built && params.get('out') === '0') stage.classList.add('stay');
      const dark = (params.get('mode') || params.get('theme') || 'light').toLowerCase() === 'dark';
      const num = k => { const v = parseFloat(params.get(k)); return Number.isFinite(v) && v > 0 ? v : null; };
      const speed = num('speed') || 1;
      if (num('size')) document.documentElement.style.setProperty('--size', num('size') + 'px');
      // The part of the frame the logo uses (pro's lines reach .62 of the size above and below the middle),
      // so fit.js can put it between the title and the scoreboard.
      const reach = (num('size') || 640) * (style === 'pro' ? .66 : .5);
      stage.dataset.fitBox = `${540 - reach} ${540 + reach}`;
      if (window.fitBox) window.fitBox(stage);
      document.documentElement.style.setProperty('--speed', speed);

      // Confetti in the competition's colours, flying out from the middle as the logo lands.
      function confetti() {
        const box = $('confetti');
        const colours = ['var(--purple)', 'var(--yellow)', 'var(--pink)', '#ffffff', 'var(--purple-light)'];
        for (let i = 0; i < 110; i++) {
          const b = document.createElement('div');
          b.className = 'bit' + (i % 3 === 0 ? ' dot' : '');
          const angle = Math.random() * Math.PI * 2, dist = 380 + Math.random() * 760;
          b.style.background = colours[i % colours.length];
          b.style.setProperty('--x', Math.cos(angle) * dist * 1.3 + 'px');
          b.style.setProperty('--y', Math.sin(angle) * dist * .8 + 'px');
          b.style.setProperty('--r', (Math.random() * 1080 - 540) + 'deg');
          b.style.setProperty('--t', (1.4 + Math.random() * 1.4) / speed + 's');
          b.style.setProperty('--d', ((i < 70 ? 1.3 : 2.5) + Math.random() * .15) / speed + 's');
          box.appendChild(b);
        }
      }

      // The optional background (?bg=, ?bg2=, ?bgimage=; see backdrop.js).
      studioBackdrop($('backdrop'), params, 'Logo animation');

      // The ten built templates. Each returns the markup for its logo (url), with the page's logo size and a seeded random
      // (so it plays the same each time). Everything moves by CSS from the moment .go is added; nothing is timed in script.
      const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const logoTag = url => `<img class="logo" src="${esc(url)}" alt="">`;
      const COLOURS = ['var(--purple)', 'var(--yellow)', 'var(--pink)'];
      function seeded(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const TEMPLATES = {
        coin(url, { size, rand }) {
          let sparks = '';
          for (let i = 0; i < 10; i++) {
            const a = rand() * Math.PI * 2, r = .55 + rand() * .3;
            sparks += `<div class="spark" style="--x:${Math.round(Math.cos(a) * size * r * 1.2)}px;--y:${Math.round(Math.sin(a) * size * r * .8)}px;` +
              `--s:${Math.round(40 + rand() * 50)}px;--c:${i % 3 ? 'var(--yellow)' : '#ffffff'};--d:${(1.25 + i * .14).toFixed(2)}s"></div>`;
          }
          return `<div class="t-centre"><div class="coin"><div class="spinner"><div class="logo-box front">${logoTag(url)}<div class="t-shine"></div></div>` +
            `<div class="back"><div class="sil"></div></div></div></div>${sparks}</div>`;
        },
        tiles(url, { aspect, rand }) {
          const R = 5, C = Math.max(3, Math.min(9, Math.round(R * aspect)));
          let html = '';
          for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
            const p = v => (v * 100).toFixed(3) + '%';
            html += `<div class="logo-box tile" style="clip-path:inset(${p(r / R)} ${p((C - c - 1) / C)} ${p((R - r - 1) / R)} ${p(c / C)});` +
              `transform-origin:${p((c + .5) / C)} ${p((r + .5) / R)};--d:${(.1 + (c + r) * .07).toFixed(2)}s;--c:${COLOURS[(c + r) % 3]};` +
              `--e:${(rand() * .25).toFixed(2)}s;--fx:${Math.round(rand() * 400 - 200)}px;--fr:${Math.round(rand() * 120 - 60)}deg">` +
              `${logoTag(url)}<div class="face"></div></div>`;
          }
          return `<div class="t-centre">${html}</div>`;
        },
        slices(url) {
          const N = 8;
          let bars = '', strips = '';
          for (let i = 0; i < N; i++) {
            const left = i % 2 === 0, p = v => (v * 100).toFixed(3) + '%';
            bars += `<div class="sbar" style="--i:${i};--n:${N};--c:${COLOURS[i % 3]};--sweep:${left ? 'sweepRight' : 'sweepLeft'}"></div>`;
            strips += `<div class="logo-box strip" style="--i:${i};--in:${left ? 'fromLeft' : 'fromRight'};--away:${left ? 'toRight' : 'toLeft'};` +
              `clip-path:inset(${p(i / N)} 0 ${p((N - i - 1) / N)} 0)">${logoTag(url)}</div>`;
          }
          return `<div class="t-centre">${bars}${strips}</div>`;
        },
        glitch(url) {
          const bands = [['18%', '68%', 1], ['47%', '41%', -1.3], ['74%', '12%', .8]];
          const slices = bands.map(([t, b, k], i) => `<div class="g-slice" style="--band:inset(${t} -20% ${b} -20%);--k:${k};animation-delay:${i * .08}s,2.3s,3.35s,var(--out)">${logoTag(url)}</div>`).join('');
          return `<div class="t-centre"><div class="g-wrap"><div class="sil g-a"></div><div class="sil g-b"></div>` +
            `<div class="logo-box g-main">${logoTag(url)}</div>${slices}<div class="sil g-lines"></div></div></div>`;
        },
        badge(url, { name }) {
          const text = (name || '').toUpperCase().trim();
          const C = 2 * Math.PI * 405, unit = text ? text + '\u00a0\u00a0•\u00a0\u00a0' : ''; // (SVG would squash plain spaces)
          const reps = unit ? Math.max(1, Math.round(C / (unit.length * 46))) : 0;
          const ring = (cls, r) => `<circle class="${cls}" r="${r}" pathLength="1" transform="rotate(-90)"/>`;
          return `<div class="t-centre"><div class="badge">` +
            `<svg class="b-rings" viewBox="-500 -500 1000 1000">${ring('b-band', 405)}${ring('b-outer', 470)}${ring('b-inner', 340)}</svg>` +
            (reps ? `<div class="b-text"><svg viewBox="-500 -500 1000 1000"><path id="bPath" fill="none" d="M -405 0 a 405 405 0 1 1 810 0 a 405 405 0 1 1 -810 0"/>` +
              `<text dominant-baseline="central" textLength="${(C - 4).toFixed(0)}" lengthAdjust="spacing"><textPath href="#bPath">${esc(unit.repeat(reps))}</textPath></text></svg></div>` : '') +
            `<div class="logo-box">${logoTag(url)}</div></div></div>`;
        },
        doors(url) {
          return `<div class="slam"><div class="panel panel--left"></div><div class="panel panel--right"></div><div class="seam"></div>` +
            `<div class="t-centre"><div class="logo-box">${logoTag(url)}</div></div></div>`;
        },
        bounce(url, { size, rand }) {
          let dust = '';
          for (let i = 0; i < 10; i++) {
            const side = i % 2 ? 1 : -1;
            dust += `<div class="dust" style="--x:${Math.round(side * (size * .35 + rand() * size * .5))}px;--y:${Math.round(-20 - rand() * 120)}px;` +
              `--s:${Math.round(18 + rand() * 22)}px;--c:${COLOURS[i % 3]}"></div>`;
          }
          return `<div class="t-centre"><div class="shadow"></div>${dust}<div class="drop"><div class="squash"><div class="logo-box">${logoTag(url)}</div></div></div></div>`;
        },
        lightning(url, { size, rand }) {
          const top = 540 - size * .5 + 30;
          // A jagged line from one point to another, with an optional fork part way down
          const zigzag = (x0, y0, x1, y1, n, jag) => {
            let d = `M ${x0} ${y0}`;
            for (let i = 1; i < n; i++) {
              const f = i / n;
              d += ` L ${Math.round(x0 + (x1 - x0) * f + (rand() * 2 - 1) * jag)} ${Math.round(y0 + (y1 - y0) * f + (rand() * 2 - 1) * jag * .3)}`;
            }
            return d + ` L ${x1} ${y1}`;
          };
          const bolt = (d, delay, cls = 'bolt', length) =>
            `<g class="${cls}" style="--d:${delay}${length ? ';--t:' + length : ''}"><path class="edge" pathLength="1" d="${d}"/><path class="core" pathLength="1" d="${d}"/></g>`;
          let svg = '';
          [[640, 860, '.12s'], [1290, 1060, '.26s'], [930, 975, '.4s']].forEach(([x0, x1, d]) => {
            svg += bolt(zigzag(x0, -40, x1, top, 9, 55), d);
            const fx = x0 + (x1 - x0) * .45, fy = top * .45;
            svg += bolt(zigzag(fx, fy, fx + (x0 < 960 ? -150 : 150), fy + 220, 4, 35), d);
          });
          // Sparks crackling round the logo while it holds
          [1.6, 1.75, 2.3, 2.75, 2.85, 3.3, 3.75].forEach((t, i) => {
            const a = rand() * Math.PI * 2, cx = 960 + Math.cos(a) * size * .78, cy = 540 + Math.sin(a) * size * .5;
            const b = a + Math.PI / 2 + (rand() - .5);
            svg += bolt(zigzag(Math.round(cx - Math.cos(b) * 70), Math.round(cy - Math.sin(b) * 70), Math.round(cx + Math.cos(b) * 70), Math.round(cy + Math.sin(b) * 70), 4, 26), t + 's', 'bolt spark', '.3s');
          });
          svg += bolt(zigzag(1100, -40, 990, top, 9, 55), 'var(--out)');
          return `<div class="jolt"><div class="t-centre"><div class="logo-box">${logoTag(url)}</div></div></div>` +
            `<svg class="bolts" viewBox="0 0 1920 1080">${svg}</svg>`;
        },
        rings(url) {
          const rings = [
            { r: 470, w: 10, c: 'var(--yellow)', dash: '.06 .02', spin: '14s', dir: 'normal' },
            { r: 425, w: 30, c: 'var(--purple)', dash: '.3 .05 .1 .05', spin: '10s', dir: 'reverse' },
            { r: 384, w: 7, c: 'var(--pink)', dash: '.012 .014', spin: '8s', dir: 'normal' },
            { r: 352, w: 14, c: 'var(--yellow)', dash: '.42 .08', spin: '18s', dir: 'reverse' },
          ];
          let html = rings.map((g, i) => `<div class="rw" style="--d:${(i * .1).toFixed(1)}s;--e:${((3 - i) * .06).toFixed(2)}s;--spin:${g.spin};--dir:${g.dir}">` +
            `<svg viewBox="-500 -500 1000 1000"><circle r="${g.r}" pathLength="1" stroke="${g.c}" stroke-width="${g.w}" stroke-dasharray="${g.dash}"/></svg></div>`).join('');
          html += `<div class="rw" style="--d:.4s;--e:0s;--spin:4s;--dir:normal"><svg viewBox="-500 -500 1000 1000">` +
            [0, 120, 240].map((a, i) => `<circle r="14" cx="${Math.round(Math.cos(a * Math.PI / 180) * 510)}" cy="${Math.round(Math.sin(a * Math.PI / 180) * 510)}" fill="${COLOURS[i]}" style="fill:${COLOURS[i]}"/>`).join('') +
            '</svg></div>';
          return `<div class="t-centre">${html}<div class="logo-box">${logoTag(url)}</div></div>`;
        },
        title(url, { name, sub }) {
          return `<div class="t-centre"><div class="row"><div class="slide"><div class="logo-box">${logoTag(url)}</div></div>` +
            `<div class="words"><div class="name">${esc(name)}</div><div class="bar"></div><div class="sub">${esc(sub)}</div></div></div></div>`;
        },

        // ----- Netball templates -----
        goal(url, { size }) {
          // The ring is seen from the side as an ellipse: its back half is drawn behind the ball and its front half and net in front.
          const back = `<svg class="layer" viewBox="0 0 1920 1080"><g class="goalpost"><rect class="post" x="1052" y="410" width="18" height="700"/>` +
            `<path class="post" d="M 1030 416 L 1056 416 L 1056 426 L 1030 426 Z"/><path class="hoop" d="M 890 420 A 70 15 0 0 1 1030 420"/></g></svg>`;
          let net = '';
          for (let i = 0; i <= 6; i++) {
            const x0 = 890 + i * 140 / 6, x1 = 922 + i * 76 / 6;
            net += `<path d="M ${x0.toFixed(0)} 420 L ${x1.toFixed(0)} 540"/>`;
          }
          [460, 500, 540].forEach((y, i) => { const w = 70 - (i + 1) * 10; net += `<path d="M ${960 - w} ${y} Q 960 ${y + 10} ${960 + w} ${y}"/>`; });
          const front = `<svg class="layer" viewBox="0 0 1920 1080"><g class="goalpost"><g class="net">${net}</g>` +
            `<path class="hoop" d="M 890 420 A 70 15 0 0 0 1030 420"/></g></svg>`;
          return `${back}<div class="bx"><div class="by">${netball(84)}</div></div>${front}` +
            `<div class="t-centre"><div class="burst-ring"></div><div class="logo-box">${logoTag(url)}</div></div>`;
        },
        court(url) {
          // A netball court to scale (30.5 m by 15.25 m at 50 px a metre): outline, thirds, centre circle and goal circles.
          const lines = ['M 0 0 H 1525 V 762 H 0 Z', 'M 508 0 V 762', 'M 1017 0 V 762',
            'M 740 381 a 22.5 22.5 0 1 0 45 0 a 22.5 22.5 0 1 0 -45 0', 'M 0 136 A 245 245 0 0 1 0 626', 'M 1525 136 A 245 245 0 0 0 1525 626'];
          return `<div class="court"><svg viewBox="0 0 1525 762"><rect class="floor" width="1525" height="762"/><rect class="third" x="508" width="509" height="762"/>` +
            lines.map((d, i) => `<path class="cline" pathLength="1" style="--d:${(.25 + i * .12).toFixed(2)}s" d="${d}"/>`).join('') + '</svg></div>' +
            `<div class="t-centre"><div class="logo-box">${logoTag(url)}</div></div>`;
        },
        bibs(url, { size }) {
          const POS = ['GS', 'GA', 'WA', 'C', 'WD', 'GD', 'GK'];
          const bibs = POS.map((p, i) => {
            const a = -Math.PI / 2 + i * 2 * Math.PI / 7;
            return `<div class="bib" style="--x:${Math.round(Math.cos(a) * size * .95)}px;--y:${Math.round(Math.sin(a) * size * .62)}px;` +
              `--d:${(.5 + i * .12).toFixed(2)}s;--e:${(i * .05).toFixed(2)}s"><span>${p}</span></div>`;
          }).join('');
          return `<div class="t-centre">${bibs}<div class="logo-box">${logoTag(url)}</div></div>`;
        },
        pass(url) {
          // Down the court from GK to GS, one chest pass each, then the last pass goes to the middle and becomes the logo.
          const pts = [[-100, 840], [250, 300], [520, 800], [800, 270], [1100, 820], [1380, 290], [1640, 780], [1780, 330], [960, 540]];
          const POS = ['GK', 'GD', 'WD', 'C', 'WA', 'GA', 'GS'];
          const d = 'M ' + pts.map(p => p.join(' ')).join(' L ');
          const lens = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
          const total = lens.reduce((a, b) => a + b, 0);
          let run = 0;
          const players = POS.map((p, i) => {
            run += lens[i];
            const t = .15 + 1.8 * run / total; // when the ball reaches this player
            return `<div class="player" style="--x:${pts[i + 1][0]}px;--y:${pts[i + 1][1]}px;--d:${(t - .3).toFixed(2)}s;--e:${(i * .03).toFixed(2)}s">${p}</div>`;
          }).join('');
          return `<svg class="trail" viewBox="0 0 1920 1080"><path pathLength="1" d="${d}"/></svg>${players}` +
            `<div class="pball" style="--path:path('${d}')">${netball(76)}</div>` +
            `<div class="t-centre"><div class="burst-ring"></div><div class="logo-box">${logoTag(url)}</div></div>`;
        },
        net(url) {
          // A ring seen a little from above: its back half behind the logo, its front half and net in front, so the logo drops through it.
          let net = '';
          for (let i = 0; i <= 10; i++) {
            const x0 = 660 + i * 60, x1 = 780 + i * 36;
            net += `<path d="M ${x0} 300 L ${x1} 640"/>`;
          }
          [400, 500, 600].forEach((y, i) => { const w = 285 - (i + 1) * 40; net += `<path d="M ${960 - w} ${y} Q 960 ${y + 30} ${960 + w} ${y}"/>`; });
          return `<svg class="layer" viewBox="0 0 1920 1080"><g class="goalpost"><path class="hoop" d="M 660 300 A 300 55 0 0 1 1260 300"/></g></svg>` +
            `<div class="t-centre"><div class="logo-box">${logoTag(url)}</div></div>` +
            `<svg class="layer" viewBox="0 0 1920 1080"><g class="goalpost"><g class="net">${net}</g><path class="hoop" d="M 660 300 A 300 55 0 0 0 1260 300"/></g></svg>`;
        },
      };

      // A netball, d pixels across: plain white with a thin grey rim.
      function netball(d) {
        return `<svg class="netball" width="${d}" height="${d}" viewBox="-50 -50 100 100"><circle class="skin" r="48"/></svg>`;
      }

      function play() {
        if (template === 'fun') confetti();
        stage.classList.add('go');
        if (built) {
          // Built templates are timed in CSS at ?speed=1; other speeds play the whole timeline faster or slower.
          if (speed !== 1) stage.getAnimations({ subtree: true }).forEach(a => { a.playbackRate = speed; });
          if (params.get('out') !== '0') studioDone.afterAnimations();
          return;
        }
        if (params.get('out') !== '0') setTimeout(() => { stage.classList.add('out'); studioDone.afterAnimations(); }, (style === 'pro' ? 4400 : 4200) / speed);
      }

      // Builds a template once its logo has loaded, then starts it when the pictures and font are ready.
      async function build(logo, img, rules) {
        const size = num('size') || 640;
        const name = (params.get('text') ?? rules.competitionName ?? '').trim();
        const box = $('tpl');
        document.documentElement.style.setProperty('--logo', `url("${logo.replace(/"/g, '%22')}")`);
        box.innerHTML = TEMPLATES[template](logo, { size, name, sub: (params.get('sub') || '').trim(),
          aspect: img.naturalWidth / img.naturalHeight || 1, rand: seeded(20261014) });
        if (template === 'title' && !name) console.warn('Logo animation: no competition name for the title template; add ?text=');
        await Promise.all([...box.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
        if (document.fonts) await document.fonts.ready;
        if (template === 'title') {
          // The logo starts in the middle of the screen, then slides left to make room for the name.
          const row = box.querySelector('.row'), slide = box.querySelector('.slide');
          row.style.setProperty('--shift', (row.offsetWidth - slide.offsetWidth) / 2 + 'px');
        }
        play();
      }

      async function load() {
        try {
          const res = await fetch('/api/scoreboard', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const rules = (await res.json()).rules || {};
          const logo = (dark ? rules.competitionLogoDark : rules.competitionLogoLight) || rules.competitionLogo;
          if (!logo) { console.warn('Logo animation: the competition setup has no competition logo'); return; }
          if (built) {
            const img = new Image();
            img.onload = () => build(logo, img, rules);
            img.onerror = () => console.warn('Logo animation: could not load the competition logo', logo);
            img.src = logo;
            return;
          }
          const img = $(style === 'pro' ? 'proLogo' : 'funLogo');
          // The light sweep only covers the logo's own shape.
          $('shine').style.webkitMaskImage = $('shine').style.maskImage = `url("${logo}")`;
          // Starts once the logo has loaded, so it never animates an empty box.
          let started = false;
          const start = () => { if (!started) { started = true; play(); } };
          img.onload = start;
          img.onerror = () => console.warn('Logo animation: could not load the competition logo', logo);
          img.src = logo;
          document.querySelectorAll('.trail .logo').forEach(t => { t.src = logo; });
          setTimeout(() => { if (!started && img.complete && img.naturalWidth) start(); }, 3000);
        } catch (err) { console.warn('Logo animation: competition logo unavailable:', err.message); }
      }
      load();
    })();
  </script>
</body>
</html>
