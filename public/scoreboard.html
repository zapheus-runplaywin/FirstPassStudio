<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="scoreboard.css">
<script src="log.js"></script>
<script src="chroma.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/scoreboard.html
       Options: &position=above-ticker (default: bottom centre, just above ticker.html) | top-center | bottom-center | top-left | bottom-left
                &supershot=0 leaves off the "Super shot" tab (shown above the clock in the competition's super shot minutes)
                &sponsor=0 leaves off the "Presented by" tab above the court (the naming rights sponsor, from the Sponsors page) -->
  <div class="scorebug" id="bug" hidden>
    <div class="scorebug__tab scorebug__live" id="live" hidden>PlayHQ Live</div>
    <div class="scorebug__tab scorebug__sponsor" id="sponsor" hidden></div>
    <div class="scorebug__super" id="super" aria-hidden="true"><div class="scorebug__tab scorebug__super-tab"><span class="scorebug__super-dot"></span>Super shot</div></div>
    <div class="scorebug__main">
      <div class="court"><span class="court__name" id="court"></span></div>
      <div class="team team--home"><span class="team__name" id="homeName"></span></div>
      <div class="score" id="homeScore"></div>
      <div class="score" id="awayScore"></div>
      <div class="team team--away"><span class="team__name" id="awayName"></span></div>
      <div class="period"><span id="period"></span><span class="clock" id="clock"></span></div>
    </div>
  </div>
  <script src="sponsorspot.js"></script>
  <script src="scoreboard.js"></script>
  <script src="autoreload.js"></script>
</body>
</html>
