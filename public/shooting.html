<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shooting Stats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="graphics.css">
<style>
  /* This page's own layout. What it shares with other graphics is in graphics.css. */
  /* Shooting stats */
  .shooting__header { padding: 28px 40px 8px; text-align: center; }
  .shooting__score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 28px; margin-top: 18px; }
  .shooting__score .side { text-align: right; font-size: 34px; font-weight: 800; text-transform: uppercase; }
  .shooting__score .side--away { text-align: left; }
  .shooting__score .big {
    background: var(--yellow); color: var(--text-on-yellow); border-radius: 10px; padding: 6px 26px;
    font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .shooting__score .dash { margin: 0 14px; }
  .shooting { --card-width: 1680px; }
  .shooting__teams { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; padding: 20px 40px 32px; }
  .shooting__team-head { display: flex; align-items: center; gap: 18px; margin-bottom: 12px; }
  .shooting__team-head h2 { margin: 0; font-size: 30px; text-transform: uppercase; color: var(--yellow); }
  .shooting__logo { width: 96px; height: 96px; object-fit: contain; }
  .shooting__logo.logo-fallback { font-size: 30px; }
  .shooting table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .shooting th { color: var(--muted); font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; padding: 8px 10px; }
  .shooting td { font-size: 26px; padding: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
  .shooting tbody tr { animation: slide 0.4s ease-out both; }
  .shooting .n { text-align: center; }
  .shooting td.who { font-weight: 700; text-transform: uppercase; white-space: nowrap; font-size: 24px; }
  .shooting th.n, .shooting td.n { width: 1%; white-space: nowrap; padding: 10px 10px; }
  .shooting td.who { max-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .shooting td.who .pos {
    display: inline-block; min-width: 44px; margin-right: 12px; background: var(--yellow); color: var(--text-on-yellow);
    border-radius: 5px; text-align: center; font-size: 18px; padding: 2px 0;
  }
  .shooting tfoot td { background: var(--purple); font-weight: 800; color: var(--yellow); }

  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
<script src="fit.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page, for quarter breaks:
       http://localhost:8080/shooting.html
       Options: &title=Half%20time (otherwise it names the break from the quarter on the scoreboard)
       Presented by the next sponsor in rotation from Major and up (Sponsors page) in the footer: ?sponsor=0 leaves it off, ?sponsor=Golds%20Bakery always that one. -->
  <main class="card shooting" id="card" data-fit hidden>
    <header class="shooting__header">
      <div class="tab" id="title">Shooting stats</div>
      <div class="shooting__score">
        <div class="side"><span id="homeName"></span></div>
        <div class="big"><span id="homeGoals"></span><span class="dash">–</span><span id="awayGoals"></span></div>
        <div class="side side--away"><span id="awayName"></span></div>
      </div>
    </header>
    <div class="shooting__teams">
      <section class="shooting__team" id="home"></section>
      <section class="shooting__team" id="away"></section>
    </div>
    <div class="card__foot"><footer class="card__footer" id="footer"></footer><div class="card__sponsor" id="sponsor" hidden></div></div>
  </main>
  <script src="sponsorspot.js"></script>
  <script src="teams.js"></script>
  <script type="module" src="shooting.js"></script>
</body>
</html>
