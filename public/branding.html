<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Branding</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<style>
  /* Logos either side of the title banner: PIVT and FirstPass Studio on the left, the competition logo on the right.
     Each side sits the same distance in from its edge of the frame (--edge), so the two corners match however wide
     each side's logos are; ?gap= places them from the centre of the frame instead. The page is transparent; only the logos show. */
  :root {
    --edge: 100px;        /* from each edge of the frame to the outside edge of that side's logos */
    --gap: 320px;         /* with ?gap=: from the centre of the frame to the inner edge of each side instead */
    --mid: 95px;          /* height of the middle of the logos from the top of the frame */
    --pivt: 58px;         /* PIVT badge height */
    --studio: 200px;      /* FirstPass Studio width (the brand kit's minimum is 180px) */
    --comp: 110px;        /* competition logo height */
  }
  html, body { margin: 0; background: transparent; }
  body { width: 1920px; height: 1080px; position: relative; overflow: hidden; }
  .side { position: absolute; top: var(--mid); transform: translateY(-50%); transform: translateY(round(-50%, 1px)); display: flex; flex-direction: column; gap: 16px;
          animation: fade-in .5s ease-out both; }
  .side--left { left: var(--edge); align-items: center; }
  .side--right { right: var(--edge); align-items: center; }
  body.from-centre .side--left { left: auto; right: calc(960px + var(--gap)); }
  body.from-centre .side--right { right: auto; left: calc(960px + var(--gap)); }
  .side[hidden], img[hidden] { display: none; }
  .pivt, .comp { filter: drop-shadow(0 4px 12px rgba(0,0,0,.45)); }  /* none on FirstPass Studio: the brand kit says no shadows */
  .pivt { height: var(--pivt); }
  .studio { width: var(--studio); }
  .comp { height: var(--comp); max-width: 360px; object-fit: contain; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
</style>
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="zoom.js"></script>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page:
       http://localhost:8080/branding.html
       The competition logo comes from the competition setup page. Loads once.
       Options: ?pivt=0, ?studio=0 or ?comp=0 leave that logo off;
                ?edge=100 moves both sides in or out (pixels from each edge of the frame to the outside of its logos);
                ?gap=320 places them from the centre of the frame instead (pixels from the centre to the inside of each side);
                ?top=95 moves the logos up or down (pixels from the top to their middle);
                ?size=1.2 makes every logo bigger or smaller;
                ?mode=light (the default) uses the logos made for a light picture behind them (blue First, orange Pass,
                and the setup's light mode competition logo), ?mode=dark the ones made for a dark picture (white FirstPass,
                and the dark mode competition logo). A competition with only one logo uses it for both. -->
  <div class="side side--left" id="left">
    <img class="pivt" id="pivt" src="studio/pivt.svg" alt="PIVT Live Streaming">
    <img class="studio" id="studio" src="studio/firstpass-studio-light.svg" alt="FirstPass Studio">
  </div>
  <div class="side side--right" id="right" hidden>
    <img class="comp" id="comp" alt="">
  </div>
  <script type="module" src="branding.js"></script>
</body>
</html>
