<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hot streak</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="log.js"></script>
<script src="chroma.js"></script>
<script src="done.js"></script>
<script src="fit.js"></script>
<style>
  /* Hot streaks, about 3.6 seconds each, then they fade out and leave the frame clear. Transparent outside the graphics.
     By default it stays on and plays by itself when the helper sees a streak in the goals on the scoreboard:
       heating up    3 goals in a row by one team: "<team> is HEATING UP", embers rising, the words warming from the team's colour to fire
       on fire       5 goals in a row: "<team> is ON FIRE", the words slam in and burn, flames roar up behind them
       goal for goal 10 goals going one each way: "GOAL FOR GOAL INTENSITY", both crests, the words crackle, a dot per goal
     and game moments:
       lead          "<team> HITS THE FRONT", gold chevrons rising, the score
       level         "ALL SQUARE" late in a quarter, both crests sliding in either side, the score on a levelling beam
       comeback      "<team> is COMING BACK", chevrons sweeping forward, "from 6 down"
       siren         "<team> ON THE SIREN!", a spinning red beacon and a flash, the quarter and time left
       backToBack    "<team> BACK TO BACK SUPER SHOTS", two netballs dropping in
     ?play=heating|fire|goalforgoal|lead|level|comeback|siren|backtoback plays one once when the page loads instead (manual), with ?team=home|away.
     Each says who it's "brought to you by": the sponsor that owns that moment on the Sponsors page, or the Elite sponsors
     taking turns; ?sponsor=0 leaves it off, ?sponsor=Golds%20Bakery always that one.
     Laid out at full size and shrunk under the title like the super shot (fit.js). The CSS animations run from one start
     on the page's clock; the embers, flames and sparks are a canvas moved by elapsed time, so 50p and 60p look the same. */
  @font-face { font-family: "Montserrat"; font-style: italic; font-weight: 900; src: url("vendor/montserrat/montserrat-latin-900-italic.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-style: italic; font-weight: 800; src: url("vendor/montserrat/montserrat-latin-800-italic.woff2") format("woff2"); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .stage { position: absolute; inset: 0; visibility: hidden; font-family: var(--font, "Montserrat"), "Montserrat", sans-serif;
    --team-rgb: var(--purple-rgb, 127, 64, 146); --side-dark: var(--deep-rgb, 40, 16, 50); --side-text: #fff;
    --home-rgb: var(--purple-rgb, 127, 64, 146); --away-rgb: var(--pink-rgb, 230, 0, 126); --moment-at: 1.3s; }
  .stage.go { visibility: visible; animation: out .6s ease-in 3s forwards; }
  @keyframes out { to { opacity: 0; transform: scale(1.06); filter: blur(8px); } }
  .shaker { position: absolute; inset: 0; }
  canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .kind { display: none; position: absolute; inset: 0; }
  .k-heating .heating, .k-fire .fire, .k-gfg .gfg, .k-moment .moment { display: block; }
  .hot-glow { position: absolute; left: 360px; top: 300px; width: 1200px; height: 500px; border-radius: 50%; opacity: 0; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes pulse { 0% { opacity: .7; transform: scale(.96); } 100% { opacity: 1; transform: scale(1.05); } }

  /* The team: logo and name on a plate in their colour, dropping in at the top */
  .team { position: absolute; left: 0; right: 0; top: 300px; display: flex; justify-content: center; align-items: center; opacity: 0; }
  .go .team { animation: drop .45s cubic-bezier(.2,.9,.2,1) .1s forwards; }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-70px); } 100% { opacity: 1; transform: none; } }
  .crest { width: 150px; height: 150px; flex: none; position: relative; z-index: 1; }
  .team .crest { margin-right: -36px; }
  .logo { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .5)); }
  .logo-fallback { display: flex; align-items: center; justify-content: center; border-radius: 50%; box-sizing: border-box;
    background: rgb(var(--team-rgb)); border: 7px solid var(--yellow); color: var(--side-text); font-weight: 900; font-size: 52px; }
  .plate { padding: 10px 56px 10px 66px; max-width: 1200px; box-sizing: border-box; white-space: nowrap;
    background: linear-gradient(180deg, rgb(var(--team-rgb)), rgb(var(--side-dark))); border-bottom: 6px solid var(--yellow);
    clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); }
  .plate h2 { margin: 0; color: var(--side-text); font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 76px; line-height: 1.1; letter-spacing: 1px; }
  .plate h2 i { font-weight: 800; font-size: .62em; text-transform: none; opacity: .9; margin-left: .3em; }
  .plate h2 i:empty { display: none; }

  /* The big words, one span per letter so they can come in one after another */
  .big { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; font-style: italic; white-space: nowrap; line-height: 1; }
  .big .l { display: inline-block; opacity: 0; position: relative; }
  /* Each letter is two copies: a solid outline underneath (.o) and the fill on top (.f), because an outline drawn on a
     see-through gradient fill shows where the font's strokes overlap inside the letters */
  .big .o { position: absolute; left: 0; top: 0; color: #fff; -webkit-text-stroke: 9px #fff; }
  .big .f { position: relative; color: transparent; } /* each kind gives it a background, clipped to the text */
  .big .sp { display: inline-block; width: .3em; }

  /* "3 in a row": a ball for each goal, lighting up one after another */
  .row { position: absolute; left: 0; right: 0; top: 700px; display: flex; justify-content: center; align-items: center; gap: 18px; opacity: 0; }
  .go .row { animation: fadeIn .25s ease-out .85s forwards; }
  .row b { color: #fff; font-weight: 900; font-style: italic; font-size: 52px; text-transform: uppercase; letter-spacing: 2px; margin-right: 10px;
    filter: drop-shadow(4px 4px 0 rgba(0, 0, 0, .55)); }
  .pip { width: 54px; height: 54px; border-radius: 50%; box-sizing: border-box; border: 5px solid #fff; background: rgba(0, 0, 0, .35); flex: none; }
  .go .pip { animation: light .3s cubic-bezier(.3,1.6,.5,1) var(--d) forwards; }
  @keyframes light { 0% { transform: scale(.4); } 100% { transform: none; background: var(--pip); box-shadow: 0 0 26px var(--pip-glow); } }

  /* ── Heating up ── the words rise in and warm from the team's colour up to white hot, with a heat shimmer */
  .heating .hot-glow { background: radial-gradient(ellipse, rgba(255, 170, 40, .55), rgba(255, 90, 0, .3) 40%, rgba(255, 60, 0, 0) 70%); }
  .go .heating .hot-glow { animation: fadeIn .4s ease-out .2s forwards, pulse .6s ease-in-out .6s infinite alternate; }
  .heating .big { top: 478px; font-size: 196px; letter-spacing: 4px; }
  .heating .l { filter: drop-shadow(8px 8px 0 rgba(0, 0, 0, .5)) drop-shadow(0 0 30px rgba(255, 120, 0, .55)); }
  .heating .f { background: linear-gradient(0deg, rgb(var(--team-rgb)) 0 30%, #ff3d00 45%, #ff8a00 60%, #ffd23f 78%, #fff6d5 92%) 0 100% / 100% 340% no-repeat;
    -webkit-background-clip: text; background-clip: text; }
  .go .heating .l { animation: rise .45s cubic-bezier(.2,1.4,.5,1) var(--d) forwards; }
  .go .heating .f { animation: warm 1.3s ease-in-out calc(var(--d) + .25s) forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(110px) scale(.7); filter: blur(10px); } 100% { opacity: 1; transform: none; } }
  @keyframes warm { to { background-position: 0 12%; } } /* from the team's colour (bottom of the gradient) up to orange and yellow */
  .go .heating .big { animation: shimmer .16s ease-in-out 1.5s infinite alternate; }
  @keyframes shimmer { 0% { transform: skewX(-1.5deg) scaleY(1.01); } 100% { transform: skewX(1.5deg) scaleY(.99); } }
  .heating .pip { --pip: #ff8a00; --pip-glow: rgba(255, 140, 0, .9); }

  /* ── On fire ── a flash and a shake, ON FIRE slams in and burns, flames roar up behind */
  .go.k-fire .shaker { animation: shake .45s linear .42s; }
  @keyframes shake { 0%, 100% { transform: none; } 15% { transform: translate(-14px, 8px) rotate(-.4deg); } 30% { transform: translate(12px, -10px) rotate(.4deg); }
    45% { transform: translate(-9px, -5px); } 60% { transform: translate(7px, 6px); } 80% { transform: translate(-3px, 2px); } }
  .fire .hot-glow { background: radial-gradient(ellipse, rgba(255, 210, 60, .65), rgba(255, 60, 0, .45) 38%, rgba(200, 0, 0, 0) 70%); }
  .go .fire .hot-glow { animation: fadeIn .3s ease-out .4s forwards, pulse .35s ease-in-out .7s infinite alternate; }
  .fire .flash { position: absolute; left: 260px; top: -100px; width: 1400px; height: 1400px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(255, 200, 40, .6) 15%, rgba(255, 60, 0, .25) 34%, rgba(255, 60, 0, 0) 58%); }
  .go .fire .flash { animation: flash .7s ease-out .4s forwards; }
  @keyframes flash { 0% { opacity: 0; transform: scale(.2); } 15% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
  .fire .big { top: 462px; font-size: 236px; letter-spacing: 6px; }
  .fire .words { display: inline-block; opacity: 0; }
  .fire .l { opacity: 1; filter: drop-shadow(10px 10px 0 rgba(60, 0, 0, .6)) drop-shadow(0 0 40px rgba(255, 90, 0, .7)); }
  .fire .f { background: linear-gradient(0deg, #c41000, #ff3d00 20%, #ff8a00 40%, #ffd23f 55%, #ff8a00 72%, #ff3d00 88%, #c41000 100%) 0 0 / 100% 200% repeat-y;
    -webkit-background-clip: text; background-clip: text; }
  .go .fire .f { animation: burn .9s linear .4s infinite; }
  @keyframes burn { to { background-position: 0 -200%; } }
  .go .fire .words { animation: slam .4s cubic-bezier(.3,1.4,.5,1) .3s forwards; }
  @keyframes slam { 0% { opacity: 0; transform: scale(2.4); filter: blur(16px); } 100% { opacity: 1; transform: none; filter: none; } }
  .fire .pip { --pip: #ff3d00; --pip-glow: rgba(255, 70, 0, .95); }

  /* ── Goal for goal ── both crests close in, GOAL / FOR / GOAL from alternate sides, INTENSITY crackles, a dot per goal */
  .gfg .hot-glow { left: 260px; width: 1400px; background: radial-gradient(ellipse at 30% 50%, rgba(var(--home-rgb), .6), rgba(var(--home-rgb), 0) 55%),
    radial-gradient(ellipse at 70% 50%, rgba(var(--away-rgb), .6), rgba(var(--away-rgb), 0) 55%); }
  .go .gfg .hot-glow { animation: fadeIn .4s ease-out .2s forwards, pulse .22s ease-in-out .8s infinite alternate; }
  .gfg .top { top: 300px; font-size: 128px; letter-spacing: 4px; }
  .gfg .top .w { display: inline-block; opacity: 0; color: #fff; -webkit-text-stroke: 4px #fff; paint-order: stroke fill; margin: 0 .12em;
    filter: drop-shadow(7px 7px 0 rgba(0, 0, 0, .55)); }
  .gfg .top .w--h { color: rgb(var(--home-rgb)); }
  .gfg .top .w--a { color: rgb(var(--away-rgb)); }
  .go .gfg .w--h { animation: inL .35s cubic-bezier(.25,1.5,.5,1) .15s forwards; }
  .go .gfg .w--f { animation: drop .35s cubic-bezier(.25,1.5,.5,1) .32s forwards; }
  .go .gfg .w--a { animation: inR .35s cubic-bezier(.25,1.5,.5,1) .49s forwards; }
  @keyframes inL { 0% { opacity: 0; transform: translateX(-900px) skewX(-25deg); filter: blur(12px); } 100% { opacity: 1; transform: none; filter: none; } }
  @keyframes inR { 0% { opacity: 0; transform: translateX(900px) skewX(25deg); filter: blur(12px); } 100% { opacity: 1; transform: none; filter: none; } }
  .gfg .mid { top: 448px; display: flex; justify-content: center; align-items: center; gap: 60px; }
  .gfg .mid .crest { opacity: 0; width: 170px; height: 170px; }
  .go .gfg .crest--h { animation: inL .4s cubic-bezier(.25,1.4,.5,1) .55s forwards, knock .44s ease-in-out 1.1s infinite; }
  .go .gfg .crest--a { animation: inR .4s cubic-bezier(.25,1.4,.5,1) .55s forwards, knock .44s ease-in-out 1.32s infinite; }
  @keyframes knock { 0%, 100% { transform: none; } 30% { transform: scale(1.14) rotate(-4deg); } 60% { transform: scale(.98); } }
  .gfg .zap { position: relative; display: inline-block; font-size: 196px; letter-spacing: 6px; color: #fff; opacity: 0;
    -webkit-text-stroke: 5px var(--yellow); paint-order: stroke fill; filter: drop-shadow(0 0 26px rgba(150, 230, 255, .8)) drop-shadow(9px 9px 0 rgba(0, 0, 0, .5)); }
  .go .gfg .zap { animation: zapIn .3s steps(4) .7s forwards, jitter .12s steps(2) 1s infinite; }
  @keyframes zapIn { 0% { opacity: 0; transform: scale(1.3); } 50% { opacity: 1; } 75% { opacity: .2; } 100% { opacity: 1; transform: none; } }
  @keyframes jitter { 0% { transform: translate(2px, -1px); } 50% { transform: translate(-2px, 1px); } 100% { transform: none; } }
  /* Two copies in the team colours, split either way and flickering, like an electric charge */
  .zap::before, .zap::after { content: attr(data-text); position: absolute; inset: 0; -webkit-text-stroke: 0; opacity: .85; mix-blend-mode: screen; }
  .zap::before { color: rgb(var(--home-rgb)); }
  .zap::after { color: rgb(var(--away-rgb)); }
  .go .zap::before { animation: splitL .2s steps(3) 1s infinite; }
  .go .zap::after { animation: splitR .2s steps(3) 1s infinite; }
  @keyframes splitL { 0% { transform: translate(-8px, 0); clip-path: inset(0 0 60% 0); } 50% { transform: translate(-4px, 2px); clip-path: inset(40% 0 20% 0); } 100% { transform: translate(-10px, -2px); clip-path: inset(70% 0 0 0); } }
  @keyframes splitR { 0% { transform: translate(8px, 0); clip-path: inset(55% 0 0 0); } 50% { transform: translate(4px, -2px); clip-path: inset(0 0 50% 0); } 100% { transform: translate(10px, 2px); clip-path: inset(20% 0 45% 0); } }
  .gfg .dots { position: absolute; left: 0; right: 0; top: 692px; display: flex; justify-content: center; gap: 14px; }
  .gfg .dot { width: 50px; height: 50px; border-radius: 50%; box-sizing: border-box; border: 5px solid #fff; background: rgb(var(--c)); opacity: 0;
    box-shadow: 0 0 20px rgba(var(--c), .9); }
  .go .gfg .dot { animation: popDot .28s cubic-bezier(.3,1.7,.5,1) var(--d) forwards; }
  @keyframes popDot { 0% { opacity: 0; transform: translateY(-40px) scale(.3); } 100% { opacity: 1; transform: none; } }

  /* ── Game moments ── one layout: the team plate (or both crests), big words slamming in letter by letter, a line under them.
     Each moment adds its own touch and colours: m-lead, m-level, m-comeback, m-siren, m-b2b. */
  .moment .hot-glow { background: radial-gradient(ellipse, rgba(var(--yellow-rgb), .45), rgba(var(--team-rgb), .35) 40%, rgba(var(--team-rgb), 0) 70%); }
  .go .moment .hot-glow { animation: fadeIn .35s ease-out .25s forwards, pulse .5s ease-in-out .7s infinite alternate; }
  .moment .big { top: 480px; font-size: 180px; letter-spacing: 4px; }
  .moment .l { filter: drop-shadow(8px 8px 0 rgba(0, 0, 0, .5)); }
  .moment .f { background: linear-gradient(180deg, #ffffff 0 42%, var(--yellow) 100%); -webkit-background-clip: text; background-clip: text; }
  .go .moment .l { animation: punch .4s cubic-bezier(.3,1.5,.5,1) var(--d) forwards; }
  @keyframes punch { 0% { opacity: 0; transform: scale(1.9); filter: blur(12px); } 100% { opacity: 1; transform: none; } }
  .mrow { position: absolute; left: 0; right: 0; top: 700px; display: flex; justify-content: center; align-items: center; gap: 22px; opacity: 0;
    color: #fff; font-weight: 900; font-style: italic; font-size: 58px; text-transform: uppercase; letter-spacing: 2px; white-space: nowrap; }
  .mrow > * { filter: drop-shadow(4px 4px 0 rgba(0, 0, 0, .55)); }
  .go .mrow { animation: rise .4s cubic-bezier(.2,1.4,.5,1) 1s forwards; }
  .mrow .score { padding: 4px 34px; background: rgb(var(--team-rgb)); color: var(--side-text); clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); }
  .mrow .score b { color: var(--yellow); }
  .mcrest { position: absolute; top: 470px; width: 170px; height: 170px; opacity: 0; }
  .mcrest--h { left: 140px; } .mcrest--a { right: 140px; }
  .m-level .mcrest { display: block; } .mcrest { display: none; }
  .go.m-level .mcrest--h { animation: inL .45s cubic-bezier(.25,1.4,.5,1) .15s forwards; }
  .go.m-level .mcrest--a { animation: inR .45s cubic-bezier(.25,1.4,.5,1) .15s forwards; }
  /* Chevrons: rising for the lead, sweeping forward for a comeback */
  .chevrons { display: none; position: absolute; left: 0; right: 0; top: 260px; height: 560px; overflow: hidden; }
  .m-lead .chevrons, .m-comeback .chevrons { display: block; }
  .chev { position: absolute; width: 220px; height: 120px; left: var(--x); top: 560px; opacity: 0; background: rgba(var(--yellow-rgb), .55);
    clip-path: polygon(50% 0, 100% 70%, 100% 100%, 50% 30%, 0 100%, 0 70%); }
  .m-comeback .chev { background: rgba(var(--team-rgb), .7); top: var(--y); left: -240px; transform: rotate(90deg); }
  .go.m-lead .chev { animation: chevUp .9s cubic-bezier(.3,.6,.4,1) var(--d) 2 forwards; }
  .go.m-comeback .chev { animation: chevOn .8s cubic-bezier(.3,.6,.4,1) var(--d) 3 forwards; }
  @keyframes chevUp { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-640px); } }
  @keyframes chevOn { 0% { opacity: 0; transform: translateX(0) rotate(90deg); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(2200px) rotate(90deg); } }
  /* The siren: a red beacon turning behind the words, and the frame flashing red */
  .beacon { display: none; position: absolute; left: 60px; top: -360px; width: 1800px; height: 1800px; border-radius: 50%; opacity: 0;
    background: conic-gradient(from 0deg, rgba(255, 30, 30, .75) 0 20deg, transparent 50deg 160deg, rgba(255, 255, 255, .55) 180deg 196deg, transparent 230deg 340deg, rgba(255, 30, 30, .75) 360deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, .6) 18%, transparent 38%); mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, .6) 18%, transparent 38%); }
  .m-siren .beacon { display: block; }
  .go.m-siren .beacon { animation: fadeIn .2s ease-out .1s forwards, spin .7s linear .1s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .m-siren .hot-glow { background: radial-gradient(ellipse, rgba(255, 60, 60, .7), rgba(200, 0, 0, .35) 40%, rgba(200, 0, 0, 0) 70%); }
  .go.m-siren .hot-glow { animation: fadeIn .1s linear .1s forwards, alarm .35s steps(2) .1s infinite; }
  @keyframes alarm { 0% { opacity: 1; } 100% { opacity: .25; } }
  .m-siren .f { background: linear-gradient(180deg, #ffffff 0 40%, #ff3b3b 100%); -webkit-background-clip: text; background-clip: text; }
  .go.m-siren .shaker { animation: shake .45s linear .45s; }
  /* All square: the score sits on a beam that see-saws and comes level */
  .go.m-level .mrow { animation: rise .4s cubic-bezier(.2,1.4,.5,1) .9s forwards, seesaw 1.1s ease-out 1.1s; }
  @keyframes seesaw { 0% { rotate: -6deg; } 30% { rotate: 4deg; } 60% { rotate: -2deg; } 100% { rotate: 0deg; } }
  .m-level .mrow .score { background: linear-gradient(90deg, rgb(var(--home-rgb)) 50%, rgb(var(--away-rgb)) 50%); color: #fff; }
  .m-level .hot-glow { left: 260px; width: 1400px; background: radial-gradient(ellipse at 30% 50%, rgba(var(--home-rgb), .6), rgba(var(--home-rgb), 0) 55%),
    radial-gradient(ellipse at 70% 50%, rgba(var(--away-rgb), .6), rgba(var(--away-rgb), 0) 55%); }
  /* Back to back: two netballs drop into the line, one after the other */
  .mball { width: 92px; height: 92px; opacity: 0; }
  .mball svg { width: 100%; height: 100%; display: block; }
  .go .mball { animation: ballDrop .45s cubic-bezier(.3,1.6,.5,1) var(--d) forwards; }
  @keyframes ballDrop { 0% { opacity: 0; transform: translateY(-260px) rotate(-200deg) scale(.6); } 100% { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <!-- A 1920 x 1080 page for the Output page; leave it on:
       http://localhost:8080/streak.html                          (plays by itself: 3 in a row, 5 in a row, 10 goal for goal)
       http://localhost:8080/streak.html?goalforgoal=0            (?heating=0, ?fire=0 or ?goalforgoal=0 leaves that one out)
       Manual, plays once each time the source comes on (keep "Load the page fresh each time it's shown" ticked):
       http://localhost:8080/streak.html?play=heating&team=home   (?play=fire, ?play=goalforgoal; ?team=away) -->
  <div class="stage" id="stage" data-fit-box="290 790" data-fit-scale=".3" data-fit-place="under-title">
    <div class="shaker" id="shaker">
      <canvas id="fx" width="1920" height="1080"></canvas>
      <div class="kind heating">
        <div class="hot-glow"></div>
        <div class="big" id="heatWords"></div>
        <div class="row"><b id="heatCount">3 in a row</b><span class="pips" id="heatPips" style="display:contents"></span></div>
      </div>
      <div class="kind fire">
        <div class="hot-glow"></div><div class="flash"></div>
        <div class="big"><span class="words" id="fireWords"></span></div>
        <div class="row"><b id="fireCount">5 in a row</b><span class="pips" id="firePips" style="display:contents"></span></div>
      </div>
      <div class="kind gfg">
        <div class="hot-glow"></div>
        <div class="big top"><span class="w w--h">GOAL</span><span class="w w--f">FOR</span><span class="w w--a">GOAL</span></div>
        <div class="big mid"><div class="crest crest--h" id="crestH"></div><span class="zap" data-text="INTENSITY">INTENSITY</span><div class="crest crest--a" id="crestA"></div></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="kind moment">
        <div class="beacon"></div>
        <div class="hot-glow"></div>
        <div class="chevrons" id="chevrons"></div>
        <div class="mcrest mcrest--h" id="mcrestH"></div><div class="mcrest mcrest--a" id="mcrestA"></div>
        <div class="big" id="momWords"></div>
        <div class="mrow" id="momRow"></div>
      </div>
      <div class="team" id="team"><div class="crest" id="crest"></div><div class="plate"><h2><span id="name"></span><i id="nameAfter">is</i></h2></div></div>
    </div>
  </div>
  <template id="ballSvg">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="shade" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1f1f1"/><stop offset="1" stop-color="#b9b9b9"/></radialGradient></defs>
      <circle cx="50" cy="50" r="47" fill="url(#shade)" stroke="var(--purple-dark, #3a1f45)" stroke-width="2"/>
      <g fill="none" stroke="rgb(var(--team-rgb))" stroke-width="5" stroke-linecap="round">
        <path d="M50 3 C 28 26, 28 74, 50 97"/><path d="M50 3 C 72 26, 72 74, 50 97"/><path d="M4 44 C 32 34, 68 34, 96 44"/><path d="M6 66 C 34 58, 66 58, 94 66"/>
      </g>
    </svg>
  </template>
  <script src="teams.js"></script>
  <script src="sponsorspot.js"></script>
  <script>
    const opts = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const stage = $('stage');
    const KINDS = { heating: 'k-heating', fire: 'k-fire', goalForGoal: 'k-gfg', lead: 'k-moment m-lead', level: 'k-moment m-level', comeback: 'k-moment m-comeback',
      siren: 'k-moment m-siren', backToBack: 'k-moment m-b2b' };
    const NAMES = { heating: 'heating up', fire: 'on fire', goalForGoal: 'goal for goal', lead: 'hits the front', level: 'all square', comeback: 'coming back',
      siren: 'on the siren', backToBack: 'back to back super shots' };
    const GOALS = { heating: 3, fire: 5, goalForGoal: 10 };
    // The big words for each moment, and the little word after the team's name on the plate.
    const WORDS = { lead: ['HITS THE FRONT', ''], comeback: ['COMING BACK', 'is'], siren: ['ON THE SIREN!', ''], backToBack: ['BACK TO BACK', ''], level: ['ALL SQUARE', ''] };
    const kindOf = v => ({ heating: 'heating', heatingup: 'heating', fire: 'fire', onfire: 'fire', goalforgoal: 'goalForGoal', lead: 'lead', front: 'lead',
      level: 'level', square: 'level', allsquare: 'level', comeback: 'comeback', siren: 'siren', backtoback: 'backToBack' })[String(v || '').toLowerCase().replace(/[^a-z]/g, '')];
    const ALL_CLASSES = [...new Set(Object.values(KINDS).join(' ').split(' '))];

    // A club colour from the competition setup page, as on supershot.html; without one, the competition's main colour (home) or accent (away).
    function colourOf(hex, fallbackVar) {
      const ok = /^#[0-9a-f]{6}$/i.test(hex || '');
      const rgb = ok ? [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)) : (css(fallbackVar) || '127, 64, 146').split(',').map(Number);
      const lum = rgb.map(c => c / 255).map(c => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
      const light = 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2] > 0.4;
      return { rgb: rgb.join(', '), dark: rgb.map(c => Math.round(c * .5)).join(', '), text: light ? '#111111' : '#ffffff', list: rgb };
    }
    const sideColour = (s, side) => colourOf(s && s.teamColours && s.teamColours[side], side === 'away' ? '--pink-rgb' : '--purple-rgb');
    function fit(node, max, size, min) {
      node.style.fontSize = size + 'px';
      while (node.scrollWidth > max && size > min) node.style.fontSize = (size -= 2) + 'px';
    }
    // The big words, a span per letter, each coming in a little after the one before.
    function letters(box, text, step, start) {
      box.replaceChildren();
      [...text].forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = ch === ' ' ? 'sp' : 'l';
        if (ch !== ' ') span.innerHTML = `<span class="o">${ch}</span><span class="f">${ch}</span>`;
        span.style.setProperty('--d', (start + i * step).toFixed(3) + 's');
        box.appendChild(span);
      });
    }
    function pips(box, n, start) {
      box.replaceChildren();
      for (let i = 0; i < n; i++) {
        const p = document.createElement('span');
        p.className = 'pip';
        p.style.setProperty('--d', (start + i * .12).toFixed(2) + 's');
        box.appendChild(p);
      }
    }
    // A moment's words, the line under them, and its touches (chevrons, netballs).
    const scoreOf = (ev, s) => ev.score || { home: s && s.home ? Number(s.home.score) || 0 : 0, away: s && s.away ? Number(s.away.score) || 0 : 0 };
    function momentWords(ev, s) {
      const [words, after] = WORDS[ev.kind];
      $('nameAfter').textContent = after;
      letters($('momWords'), words, .04, .2);
      fitLetters($('momWords'), ev.kind === 'level' ? 1240 : 1560, 180, 90); // level: room for both crests either side
      const sc = scoreOf(ev, s), row = $('momRow');
      const scoreBox = () => { const b = document.createElement('span'); b.className = 'score'; b.innerHTML = `${sc.home} <b>–</b> ${sc.away}`; return b; };
      const text = t => { const b = document.createElement('span'); b.textContent = t; return b; };
      if (ev.kind === 'lead' || ev.kind === 'level') row.replaceChildren(scoreBox());
      else if (ev.kind === 'comeback') row.replaceChildren(text(`from ${Math.max(5, Number(ev.down) || 5)} down`), scoreBox());
      else if (ev.kind === 'siren') {
        const q = ev.period ? (ev.period > 4 ? 'Extra time' : `${ev.periodLabel || (s && s.periodLabel) || 'Q'}${ev.period}`) : '';
        const left = Number(ev.clockLeft);
        row.replaceChildren(...[q && text(q), text(Number.isFinite(left) && left > 0 ? `${left} second${left === 1 ? '' : 's'} to go` : 'at the siren'), scoreBox()].filter(Boolean));
      } else if (ev.kind === 'backToBack') {
        const balls = [0, 1].map(i => { const b = document.createElement('span'); b.className = 'mball'; b.style.setProperty('--d', (1.1 + i * .3) + 's'); b.innerHTML = $('ballSvg').innerHTML; return b; });
        row.replaceChildren(text('Super shots'), ...balls);
      } else row.replaceChildren();
      const box = $('chevrons');
      box.replaceChildren(...Array.from({ length: 7 }, (_, i) => {
        const c = document.createElement('span');
        c.className = 'chev';
        c.style.setProperty('--x', (300 + i * 210) + 'px');
        c.style.setProperty('--y', (40 + (i * 83) % 460) + 'px');
        c.style.setProperty('--d', (.15 + (i * .37) % .6).toFixed(2) + 's');
        return c;
      }));
    }
    // Shrinks letters() words to fit a width (layout sizes, so the stage's own scaling doesn't count).
    function fitLetters(box, max, size, min) {
      const ls = box.querySelectorAll('.l, .sp');
      const width = () => ls.length ? ls[ls.length - 1].offsetLeft + ls[ls.length - 1].offsetWidth - ls[0].offsetLeft : 0;
      box.style.fontSize = size + 'px';
      while (width() > max && size > min) box.style.fontSize = (size -= 4) + 'px';
    }
    const waitFor = node => node.tagName === 'IMG' ? Promise.race([node.decode().catch(() => {}), new Promise(r => setTimeout(r, 1500))]) : null;

    // Dresses the stage for one streak: the team (heating up, on fire) or both teams (goal for goal).
    async function dress(s, ev) {
      ['--team-rgb', '--side-dark', '--side-text', '--home-rgb', '--away-rgb'].forEach(v => stage.style.removeProperty(v));
      stage.classList.remove(...ALL_CLASSES);
      stage.classList.add(...KINDS[ev.kind].split(' '));
      $('nameAfter').textContent = 'is';
      const waits = [];
      let who = '';
      if (ev.kind === 'goalForGoal') {
        const h = sideColour(s, 'home'), a = sideColour(s, 'away');
        stage.style.setProperty('--home-rgb', h.rgb);
        stage.style.setProperty('--away-rgb', a.rgb);
        for (const [side, box] of [['home', 'crestH'], ['away', 'crestA']]) {
          const t = s && s[side];
          const node = logoEl({ name: t ? t.name : side === 'home' ? 'Home' : 'Away', logo: s && s.logos && s.logos[side] }, 'logo');
          $(box).replaceChildren(node);
          waits.push(waitFor(node));
        }
        const n = Math.max(GOALS.goalForGoal, Math.min(14, Number(ev.goals) || GOALS.goalForGoal));
        const first = ev.from === 'away' ? 1 : 0;
        $('dots').replaceChildren(...Array.from({ length: n }, (_, i) => {
          const d = document.createElement('span');
          d.className = 'dot';
          d.style.setProperty('--c', (i + first) % 2 ? a.rgb : h.rgb);
          d.style.setProperty('--d', (1 + i * .07).toFixed(2) + 's');
          return d;
        }));
        $('team').style.display = 'none';
        who = s && s.home ? `${s.home.name} v ${s.away.name}` : '';
      } else if (ev.kind === 'level') {
        const h = sideColour(s, 'home'), a = sideColour(s, 'away');
        stage.style.setProperty('--home-rgb', h.rgb);
        stage.style.setProperty('--away-rgb', a.rgb);
        for (const [side, box] of [['home', 'mcrestH'], ['away', 'mcrestA']]) {
          const t = s && s[side];
          const node = logoEl({ name: t ? t.name : side === 'home' ? 'Home' : 'Away', logo: s && s.logos && s.logos[side] }, 'logo');
          $(box).replaceChildren(node);
          waits.push(waitFor(node));
        }
        $('team').style.display = 'none';
        momentWords(ev, s);
        who = s && s.home ? `${s.home.name} v ${s.away.name}` : '';
      } else {
        const side = ev.side === 'away' ? 'away' : 'home';
        const t = s && s[side];
        const c = sideColour(s, side);
        stage.style.setProperty('--team-rgb', c.rgb);
        stage.style.setProperty('--side-dark', c.dark);
        stage.style.setProperty('--side-text', c.text);
        $('team').style.display = t && t.name ? '' : 'none';
        if (t && t.name) {
          $('name').textContent = t.name;
          fit($('name').parentNode, 1000, 76, 34);
          const node = logoEl({ name: t.name, logo: s.logos && s.logos[side] }, 'logo');
          $('crest').replaceChildren(node);
          waits.push(waitFor(node));
          who = `${t.name} (${side})`;
        }
        if (WORDS[ev.kind]) momentWords(ev, s);
        const n = Math.max(GOALS[ev.kind] || 0, Math.min(9, Number(ev.goals) || GOALS[ev.kind] || 0));
        if (WORDS[ev.kind]) { /* done above */ }
        else if (ev.kind === 'heating') { letters($('heatWords'), 'HEATING UP', .045, .25); pips($('heatPips'), n, .9); $('heatCount').textContent = `${n} in a row`; }
        else { letters($('fireWords'), 'ON FIRE', 0, 0); pips($('firePips'), n, .9); $('fireCount').textContent = `${n} in a row`; }
      }
      await Promise.all(waits);
      return who;
    }

    // ── Embers, flames and sparks: a canvas moved by elapsed time (speeds in px a second), so the frame rate doesn't change them ──
    const ctx = $('fx').getContext('2d');
    const sprites = new Map();
    function sprite(rgb) { // a soft round blob in one colour, drawn once and reused
      if (sprites.has(rgb)) return sprites.get(rgb);
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, `rgba(${rgb}, 1)`); grad.addColorStop(.4, `rgba(${rgb}, .7)`); grad.addColorStop(1, `rgba(${rgb}, 0)`);
      g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
      sprites.set(rgb, c);
      return c;
    }
    const FIRE = ['255, 250, 220', '255, 220, 90', '255, 160, 30', '255, 80, 0', '200, 20, 0', '90, 10, 10'];
    const rand = (a, b) => a + Math.random() * (b - a);
    let parts = [], emitters = [], fxStart = 0, fxEnd = 0, last = 0, raf = 0;
    // Each emitter: from..to seconds after the start, rate a second, and make() for one particle.
    function emittersFor(ev, s) {
      if (ev.kind === 'heating') return [
        { from: .2, to: 2.9, rate: 70, make: () => ({ x: rand(560, 1360), y: rand(640, 700), vx: rand(-30, 30), vy: rand(-260, -140), ay: -40, life: rand(1, 1.8), size: rand(8, 20), ramp: FIRE.slice(1, 5), wobble: rand(1, 3) }) },
      ];
      if (ev.kind === 'fire') return [
        { from: .35, to: 2.95, rate: 380, make: () => ({ x: rand(460, 1460), y: rand(590, 670), vx: rand(-40, 40), vy: rand(-520, -300), ay: -260, life: rand(.5, 1), size: rand(50, 110), shrink: true, ramp: FIRE, wobble: rand(2, 5) }) },
        { from: .42, to: .5, rate: 900, make: () => { const a = rand(0, Math.PI * 2), v = rand(500, 1300); return { x: 960, y: 560, vx: Math.cos(a) * v, vy: Math.sin(a) * v, ay: 600, drag: 2.2, life: rand(.5, .9), size: rand(10, 22), ramp: FIRE.slice(0, 4) }; } },
        { from: .5, to: 2.9, rate: 60, make: () => ({ x: rand(520, 1400), y: rand(500, 700), vx: rand(-50, 50), vy: rand(-380, -220), ay: -60, life: rand(.8, 1.4), size: rand(6, 12), ramp: FIRE.slice(0, 3), wobble: rand(2, 4) }) },
      ];
      const h = sideColour(s, 'home').rgb, a = sideColour(s, 'away').rgb;
      const team = sideColour(s, ev.side === 'away' ? 'away' : 'home').rgb, gold = css('--yellow-rgb') || '255, 205, 0';
      const burst = (at, x, y, ramp, n = 700) => ({ from: at, to: at + .08, rate: n, make: () => { const ang = rand(0, Math.PI * 2), v = rand(400, 1100); return { x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v * .6, ay: 300, drag: 2.4, life: rand(.4, .8), size: rand(8, 16), ramp }; } });
      if (ev.kind === 'lead') return [
        { from: .3, to: 2.8, rate: 90, make: () => ({ x: rand(420, 1500), y: rand(700, 780), vx: rand(-20, 20), vy: rand(-700, -450), ay: 0, drag: .6, life: rand(.6, 1.1), size: rand(6, 12), ramp: ['255, 255, 255', gold, gold] }) },
        burst(.3, 960, 560, ['255, 255, 255', gold, team]),
      ];
      if (ev.kind === 'comeback') return [
        { from: .3, to: 2.8, rate: 80, make: () => ({ x: rand(200, 700), y: rand(420, 760), vx: rand(900, 1500), vy: rand(-40, 40), ay: 0, drag: .8, life: rand(.5, .9), size: rand(6, 12), ramp: ['255, 255, 255', team, team] }) },
      ];
      if (ev.kind === 'siren') return [burst(.4, 960, 560, ['255, 255, 255', '255, 80, 80', '220, 0, 0'], 900)];
      if (ev.kind === 'backToBack') return [burst(1.3, 900, 735, ['255, 255, 255', gold, team], 500), burst(1.6, 1000, 735, ['255, 255, 255', gold, team], 500)];
      const spark = (fromX, dir, rgb) => () => { const v = rand(700, 1300); return { x: fromX, y: rand(520, 600), vx: dir * v, vy: rand(-160, 160), ay: 0, drag: 1.2, life: rand(.35, .7), size: rand(8, 16), ramp: ['255, 255, 255', rgb, rgb] }; };
      if (ev.kind === 'level') return [
        { from: .45, to: 2.9, rate: 50, make: spark(300, 1, h) },
        { from: .45, to: 2.9, rate: 50, make: spark(1620, -1, a) },
      ];
      return [
        { from: 1, to: 2.9, rate: 70, make: spark(400, 1, h) },
        { from: 1, to: 2.9, rate: 70, make: spark(1520, -1, a) },
        { from: .7, to: .78, rate: 600, make: () => { const ang = rand(0, Math.PI * 2), v = rand(400, 1000); return { x: 960, y: 548, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v * .5, ay: 0, drag: 2.5, life: rand(.4, .7), size: rand(8, 14), ramp: ['255, 255, 255', '170, 235, 255', '120, 200, 255'] }; } },
      ];
    }
    function startFx(ev, s) {
      cancelAnimationFrame(raf);
      parts = []; emitters = emittersFor(ev, s).map(e => ({ ...e, owed: 0 }));
      fxStart = last = performance.now(); fxEnd = fxStart + LENGTH_MS;
      raf = requestAnimationFrame(frame);
    }
    function frame(now) {
      const dt = Math.min(.1, (now - last) / 1000), t = (now - fxStart) / 1000;
      last = now;
      for (const e of emitters) {
        if (t < e.from || t > e.to) continue;
        e.owed += e.rate * dt;
        while (e.owed >= 1) { e.owed--; const p = e.make(); p.age = 0; p.phase = rand(0, 6); parts.push(p); }
      }
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.globalCompositeOperation = 'lighter';
      parts = parts.filter(p => (p.age += dt) < p.life);
      for (const p of parts) {
        if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
        p.vy += p.ay * dt;
        p.x += (p.vx + (p.wobble ? Math.sin(p.phase + p.age * p.wobble * 6) * 40 : 0)) * dt;
        p.y += p.vy * dt;
        const f = p.age / p.life;
        const size = p.shrink ? p.size * (1 - f * .8) : p.size;
        ctx.globalAlpha = f < .1 ? f * 10 : 1 - Math.pow(f, 2);
        ctx.drawImage(sprite(p.ramp[Math.min(p.ramp.length - 1, Math.floor(f * p.ramp.length))]), p.x - size, p.y - size, size * 2, size * 2);
      }
      ctx.globalAlpha = 1;
      if (now < fxEnd || parts.length) raf = requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, 1920, 1080);
    }

    const scoreboard = async () => (await fetch('/api/scoreboard', { cache: 'no-store' })).json();

    // Starts the animation from the beginning (taking 'go' off and back on restarts every CSS animation).
    const LENGTH_MS = 3600;
    let playingUntil = 0;
    const queue = [];
    async function play(s, ev) {
      playingUntil = performance.now() + LENGTH_MS + 2000; // held while the logo loads
      const [who, sponsor] = await Promise.all([dress(s, ev), sponsorSpot.moment(ev.kind, $('shaker'))]);
      stage.classList.remove('go');
      void stage.offsetWidth;
      stage.classList.add('go');
      startFx(ev, s);
      playingUntil = performance.now() + LENGTH_MS;
      window.pageLog && window.pageLog('info', `Playing ${NAMES[ev.kind]}${who ? ` for ${who}` : ''}${ev.goals ? `, ${ev.goals} goals` : ''}${sponsor ? `, brought to you by ${sponsor.name}` : ''}`);
      setTimeout(next, LENGTH_MS);
    }
    function next() { if (queue.length && performance.now() >= playingUntil) { const q = queue.shift(); play(q.s, q.ev); } }

    // Watching (the default): stays clear until the helper reports a new streak on the scoreboard (from the goals PlayHQ's
    // scorer records while following PlayHQ, or +1 / +2 presses), then plays it. One that lands while another is playing
    // plays straight after it, and one that comes with a super shot waits for the super shot graphic to finish first.
    // Only asks the helper on this computer.
    const SUPER_SHOT_MS = 3000;
    const off = { heating: opts.get('heating') === '0', fire: opts.get('fire') === '0', goalForGoal: opts.get('goalforgoal') === '0', lead: opts.get('lead') === '0',
      level: opts.get('level') === '0', comeback: opts.get('comeback') === '0', siren: opts.get('siren') === '0', backToBack: opts.get('backtoback') === '0' };
    let seen = null, warned = false;
    async function watch() {
      try {
        const s = await scoreboard();
        const latest = s.streak || { n: 0 };
        if (warned) { console.info('Streak: the helper is back'); warned = false; }
        if (seen === null || latest.n < seen) seen = latest.n; // first look, or the helper's count started again
        // Every one since the last look (two goals pressed quickly can make two), oldest first.
        const fresh = (s.streakLog && s.streakLog.length ? s.streakLog : [latest]).filter(ev => ev.n > seen);
        if (fresh.length) seen = latest.n;
        for (const ev of fresh) {
          const now = s.serverNow || Date.now();
          const age = now - (ev.at || 0);
          if (!KINDS[ev.kind]) console.warn(`Streak: unknown kind ${ev.kind}`);
          else if (off[ev.kind]) console.info(`Streak: ${NAMES[ev.kind]} is turned off on this source, so it isn't played`);
          else if (age > 15000) console.info(`Streak ${ev.n} is ${Math.round(age / 1000)} s old, so it isn't played`);
          else {
            const shot = s.superShot && s.superShot.at ? SUPER_SHOT_MS - (now - s.superShot.at) : 0;
            const go = () => { queue.push({ s, ev }); next(); };
            if (shot > 0) setTimeout(go, shot); else go();
          }
        }
      } catch (err) {
        if (!warned) console.warn('Streak: scoreboard unavailable, still watching:', err.message);
        warned = true;
      }
      setTimeout(watch, 1000);
    }

    (async function start() {
      if (document.fonts) await document.fonts.ready;
      if (!opts.has('play')) {
        window.pageLog && window.pageLog('info', `Watching the scoreboard for streaks${Object.keys(off).filter(k => off[k]).map(k => `, not ${NAMES[k]}`).join('')}`);
        return watch();
      }
      // ?play=heating|fire|goalforgoal|lead|level|comeback|siren|backtoback (&team=home|away): play once now.
      let kind = kindOf(opts.get('play'));
      if (!kind) { console.warn(`Streak: ?play=${opts.get('play')} is not one of ${Object.keys(KINDS).join(', ')}; playing heating up`); kind = 'heating'; }
      const side = String(opts.get('team') || '').toLowerCase() === 'away' ? 'away' : 'home';
      let s = null;
      try { s = await scoreboard(); } catch (err) { console.warn('Streak: scoreboard unavailable, playing without the teams:', err.message); }
      const ev = { kind, side: kind === 'goalForGoal' || kind === 'level' ? '' : side, from: side, goals: GOALS[kind] || 0, down: 6 };
      if (kind === 'siren') Object.assign(ev, { period: (s && s.period) || 4, clockLeft: 2 });
      await play(s, ev);
      studioDone(LENGTH_MS + 100); // played once and faded out: done
    })();
  </script>
</body>
</html>
