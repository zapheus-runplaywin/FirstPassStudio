<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FirstPass Studio sound</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:">
</head>
<body>
<script>
  // Hidden page (desktop/soundtap.ts): hears one output window's sound and hands it to the app as 48 kHz
  // stereo, 16-bit interleaved, in 20 ms pieces. The app answers the capture with that window's sound
  // (no picture is kept), and starts it with studioTapStart(). It says 'started: <what the capture is>' to the log,
  // and every half second the loudest moment of each side since the last time (0 to 1), for the board's meters.
  const PIECE = 960; // 20 ms at 48 kHz
  const WORKLET = `
    const pcm = v => v >= 1 ? 32767 : v <= -1 ? -32768 : Math.round(v < 0 ? v * 32768 : v * 32767);
    registerProcessor('tap', class extends AudioWorkletProcessor {
      constructor() { super(); this.buf = new Int16Array(${PIECE} * 2); this.n = 0; }
      process(inputs) {
        const [l, r = l] = inputs[0] || [];
        if (!l) return true;
        for (let i = 0; i < l.length; i++) {
          this.buf[this.n++] = pcm(l[i]);
          this.buf[this.n++] = pcm(r[i]);
          if (this.n === this.buf.length) {
            this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
            this.buf = new Int16Array(${PIECE} * 2);
            this.n = 0;
          }
        }
        return true;
      }
    });`;
  async function studioTapStart() {
    try {
      // The browser's call processing (automatic level, noise suppression, echo cancelling) is off: it's made for
      // voices, and on music it pumps the level and dulls the sound.
      const plain = { autoGainControl: false, noiseSuppression: false, echoCancellation: false };
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: { ...plain, channelCount: { ideal: 2 } } })
        .catch(() => navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })); // a browser that won't take the ask
      for (const t of stream.getVideoTracks()) t.stop();
      const track = stream.getAudioTracks()[0];
      if (!track) throw new Error('no sound came with it');
      // Turned off again on the track, in case the capture didn't take it from the ask.
      await track.applyConstraints(plain).catch(() => {});
      const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
      const tap = new AudioWorkletNode(ctx, 'tap', { numberOfInputs: 1, numberOfOutputs: 1, channelCount: 2, channelCountMode: 'explicit' });
      // The loudest moment of each side, from the pieces as they go (a sample is 16-bit, so 32768 is full scale).
      const peak = [0, 0];
      tap.port.onmessage = e => {
        const pcm = new Int16Array(e.data);
        for (let i = 0; i < pcm.length; i += 2) {
          const l = Math.abs(pcm[i]), r = Math.abs(pcm[i + 1]);
          if (l > peak[0]) peak[0] = l;
          if (r > peak[1]) peak[1] = r;
        }
        studioTap.sound(e.data);
      };
      setInterval(() => { studioTap.level(peak[0] / 32768, peak[1] / 32768); peak[0] = peak[1] = 0; }, 500);
      ctx.createMediaStreamSource(new MediaStream([track])).connect(tap);
      // Kept running by a silent path to the speakers (a node that goes nowhere isn't run).
      const hush = ctx.createGain();
      hush.gain.value = 0;
      tap.connect(hush).connect(ctx.destination);
      if (ctx.state !== 'running') await ctx.resume();
      track.onended = () => studioTap.said('ended');
      const got = track.getSettings();
      const on = ['autoGainControl', 'noiseSuppression', 'echoCancellation'].filter(k => got[k] === true);
      studioTap.said(`started: ${got.channelCount || '?'} channels, ${got.sampleRate || ctx.sampleRate} Hz, `
        + (on.length ? `still on: ${on.join(', ')}` : 'no browser processing'));
    } catch (err) {
      studioTap.said(`failed: ${err.message}`);
    }
  }
</script>
</body>
</html>
