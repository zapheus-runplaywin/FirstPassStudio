<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What's new in FirstPass Studio</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; font-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  @font-face { font-family: Montserrat; font-weight: 600; src: url(../public/vendor/montserrat/montserrat-latin-600-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0F172A; color: #F8FAFC; font-size: 13px; }
  main { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
  header { display: flex; align-items: center; gap: 14px; padding: 22px 24px 14px; -webkit-app-region: drag; -webkit-user-select: none; user-select: none; }
  header img { width: 56px; height: 56px; border-radius: 12px; }
  h1 { font-family: Montserrat, -apple-system, system-ui, sans-serif; font-size: 18px; margin: 0; }
  header p { color: #CBD5E1; margin: 3px 0 0; }
  #list { flex: 1; overflow-y: auto; padding: 0 24px 8px; }
  section { padding: 12px 0; border-top: 1px solid #1E293B; }
  h2 { font-size: 13px; margin: 0 0 6px; color: #F1C40F; display: flex; justify-content: space-between; }
  h2 span { color: #64748B; font-weight: 400; }
  ul { margin: 0; padding-left: 18px; line-height: 1.55; color: #E2E8F0; }
  #more { color: #94A3B8; margin: 6px 0 0; }
  .buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px 18px; border-top: 1px solid #1E293B; }
  button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 1px solid #334155; background: #1E293B; color: #F8FAFC; }
  button.go { background: #F75C03; border-color: #F75C03; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <img src="../public/studio/1p-studio-dark.svg" alt="">
    <div>
      <h1>What's new in FirstPass Studio</h1>
      <p id="sub"></p>
    </div>
  </header>
  <div id="list"></div>
  <div class="buttons">
    <button id="close">Close</button>
    <button class="go" id="open">Open Studio</button>
  </div>
</main>
<script>
  // Shown by the Mac app (windows.js showWhatsNew) the first time it opens after an update. It
  // calls show() with the releases since the version last opened, newest first, and waits on
  // window.choice: 'open' for Open Studio, or null for Close. recent: opened from the menu bar
  // (What's new…), listing the latest releases rather than those since the last version opened.
  const $ = id => document.getElementById(id);
  const MAX = 30; // releases listed; older ones are summed up in a line
  window.show = (releases, version, recent) => {
    $('sub').textContent = `You're on version ${version}.` + (recent ? ' The latest changes.' : releases.length > 1 ? ` Changes in the ${releases.length} updates since you last opened it.` : '');
    const list = $('list');
    list.textContent = '';
    for (const r of releases.slice(0, MAX)) {
      const s = document.createElement('section');
      const h = document.createElement('h2');
      h.textContent = `Version ${r.version}`;
      if (r.date) {
        const d = document.createElement('span');
        const when = new Date(`${r.date}T12:00:00`);
        d.textContent = isNaN(when) ? r.date : when.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
        h.append(d);
      }
      const ul = document.createElement('ul');
      for (const c of r.changes) { const li = document.createElement('li'); li.textContent = c; ul.append(li); }
      s.append(h, ul);
      list.append(s);
    }
    if (releases.length > MAX) {
      const p = document.createElement('p');
      p.id = 'more';
      p.textContent = `And ${releases.length - MAX} earlier updates.`;
      list.append(p);
    }
  };
  window.choice = new Promise(resolve => {
    $('open').onclick = () => resolve('open');
    $('close').onclick = () => resolve(null);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') resolve(null);
      if (e.key === 'Enter') $('open').click();
    });
  });
</script>
</body>
</html>
